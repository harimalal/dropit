name: APK Android (debug)

# Compile un .apk de debug téléchargeable — sans passer par le Play Store.
# Existe parce que le SDK Android n'est pas accessible depuis l'environnement
# de développement habituel (dl.google.com bloqué) : GitHub Actions, lui,
# y a accès sans rien configurer de plus.

on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/capacitor-android
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android-debug-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vérifie que l'URL chargée par le WebView (capacitor.config.json)
      # répond bien avant de passer du temps à compiler. Fait ici plutôt
      # qu'en local : cet environnement de dev n'a lui-même pas accès à
      # ce domaine (proxy sortant restrictif), les runners GitHub si.
      - name: Vérifier que le site en ligne répond
        run: |
          url=$(node -p "require('./capacitor.config.json').server.url")
          echo "URL testée : $url/app.html"
          final_url=$(curl -sS -o /dev/null -w "%{url_effective}" -L "$url/app.html")
          echo "URL finale après redirections éventuelles : $final_url"
          body=$(curl -sS -L -w "\n%{http_code}" "$url/app.html")
          code=$(echo "$body" | tail -1)
          content=$(echo "$body" | head -n -1)
          echo "Code HTTP final : $code"
          if [ "$code" != "200" ]; then
            echo "::error::Le site répond $code, pas 200, même après avoir suivi les redirections."
            exit 1
          fi
          if ! echo "$content" | grep -q "<title>Dropit</title>"; then
            echo "::error::La page ne contient pas <title>Dropit</title> — contenu inattendu."
            exit 1
          fi
          echo "OK : le site répond 200 et sert bien app.html (WebView Android suit les redirections comme un navigateur normal)."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances Capacitor
        run: npm ci

      # `android/capacitor-cordova-android-plugins/` est volontairement hors
      # suivi git (généré, pas du code) : sans cette étape, Gradle échoue en
      # cherchant un fichier qui n'existe que localement, jamais commité.
      - name: Synchroniser le projet natif (cap sync)
        run: npx cap sync android

      # Le SDK Android est déjà préinstallé sur les runners Ubuntu de GitHub —
      # inutile d'installer quoi que ce soit en plus. Seules les licences
      # doivent être acceptées pour que Gradle puisse télécharger tout seul
      # la plateforme/les build-tools que le projet demande (variables.gradle).
      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: dropit-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
