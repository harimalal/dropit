name: APK Android (debug)

# Compile un .apk de debug téléchargeable — sans passer par le Play Store.
# Existe parce que le SDK Android n'est pas accessible depuis l'environnement
# de développement habituel (dl.google.com bloqué) : GitHub Actions, lui,
# y a accès sans rien configurer de plus.

on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/capacitor-android
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android-debug-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: dropit-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
