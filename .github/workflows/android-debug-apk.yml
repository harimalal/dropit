name: APK Android (debug)

# Compile un .apk de debug téléchargeable — sans passer par le Play Store.
# Existe parce que le SDK Android n'est pas accessible depuis l'environnement
# de développement habituel (dl.google.com bloqué) : GitHub Actions, lui,
# y a accès sans rien configurer de plus.

on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/capacitor-android
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: write  # nécessaire pour publier/mettre à jour la release ci-dessous

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vérifie que l'URL chargée par le WebView (capacitor.config.json)
      # répond bien avant de passer du temps à compiler. Fait ici plutôt
      # qu'en local : cet environnement de dev n'a lui-même pas accès à
      # ce domaine (proxy sortant restrictif), les runners GitHub si.
      - name: Vérifier que le site en ligne répond
        run: |
          url=$(node -p "require('./capacitor.config.json').server.url")
          echo "URL testée : $url/app.html"
          final_url=$(curl -sS -o /dev/null -w "%{url_effective}" -L "$url/app.html")
          echo "URL finale après redirections éventuelles : $final_url"
          body=$(curl -sS -L -w "\n%{http_code}" "$url/app.html")
          code=$(echo "$body" | tail -1)
          content=$(echo "$body" | head -n -1)
          echo "Code HTTP final : $code"
          if [ "$code" != "200" ]; then
            echo "::error::Le site répond $code, pas 200, même après avoir suivi les redirections."
            exit 1
          fi
          if ! echo "$content" | grep -q "<title>Dropit</title>"; then
            echo "::error::La page ne contient pas <title>Dropit</title> — contenu inattendu."
            exit 1
          fi
          # Vérifie spécifiquement que le correctif OAuth natif (com.dropit.app://
          # auth-callback) est bien déployé sur le site en ligne — un push sur une
          # branche ne suffit pas, il faut qu'il soit passé par main pour que
          # Cloudflare Pages le serve réellement à l'app installée.
          if ! echo "$content" | grep -q "auth-callback"; then
            echo "::error::Le correctif OAuth natif (auth-callback) n'est pas présent sur le site en ligne."
            exit 1
          fi
          echo "OK : le site répond 200, sert bien app.html, et contient le correctif OAuth natif (WebView Android suit les redirections comme un navigateur normal)."

          # Vérifie que le site en ligne sert bien la version la plus récente
          # (viewport-fit=cover, ajouté pour le correctif des boutons compte/menu
          # coincés sous la barre de statut) — sert de canari en cas de cache
          # (navigateur, CDN) qui servirait une version périmée de app.html.
          if ! echo "$content" | grep -q "viewport-fit=cover"; then
            echo "::error::Le site en ligne sert une version périmée de app.html (viewport-fit=cover absent) — probable cache CDN/navigateur."
            exit 1
          fi
          echo "OK : le site sert bien la dernière version (viewport-fit=cover présent)."

          # Vérifie que Cloudflare Pages sert bien l'en-tête Cache-Control
          # ajouté pour app.html (_headers) — sans lui, un navigateur/WebView
          # peut continuer à afficher une version périmée après déploiement.
          headers=$(curl -sSI -L "$url/app.html")
          if ! echo "$headers" | grep -qi "cache-control:.*no-cache"; then
            echo "::error::L'en-tête Cache-Control: no-cache n'est pas présent sur app.html — _headers n'est peut-être pas pris en compte."
            exit 1
          fi
          echo "OK : Cache-Control: no-cache est bien présent sur app.html."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances Capacitor
        run: npm ci

      # `android/capacitor-cordova-android-plugins/` est volontairement hors
      # suivi git (généré, pas du code) : sans cette étape, Gradle échoue en
      # cherchant un fichier qui n'existe que localement, jamais commité.
      - name: Synchroniser le projet natif (cap sync)
        run: npx cap sync android

      # Le SDK Android est déjà préinstallé sur les runners Ubuntu de GitHub —
      # inutile d'installer quoi que ce soit en plus. Seules les licences
      # doivent être acceptées pour que Gradle puisse télécharger tout seul
      # la plateforme/les build-tools que le projet demande (variables.gradle).
      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK (artifact du run, pratique pour debug)
        uses: actions/upload-artifact@v4
        with:
          name: dropit-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Un artifact de run GitHub Actions exige d'être connecté à GitHub pour
      # le télécharger — inutilisable pour un bouton public sur le site. Une
      # release, elle, donne un lien stable et public : toujours la même URL,
      # écrasée à chaque build réussi.
      - name: Publier/mettre à jour la release publique (lien stable pour le site)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Renommé avant l'upload : le nom du fichier téléchargé (donc l'URL
          # de l'asset) vient de ce nom, pas d'une option gh release séparée.
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/dropitapp.apk
          gh release delete android-debug-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create android-debug-latest \
            /tmp/dropitapp.apk \
            -R "$GITHUB_REPOSITORY" \
            --title "Dropit Android (debug)" \
            --notes "Build automatique depuis feature/capacitor-android — commit ${{ github.sha }}. APK de debug, non signé pour le Play Store : à installer directement (sideload)." \
            --prerelease
