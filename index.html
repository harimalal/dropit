<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dropit</title>
<style>
  :root{
    --canvas:#FAF6F1;
    --canvas-card:#FFFDFB;
    --ink:#2B2420;
    --ink-soft:#7A7168;
    --ink-faint:#A79E93;
    --line:#E8DFD3;
    --grid-line:rgba(43,36,32,0.05);
    --accent:#BF5B44;
    --accent-soft:#F3E2DC;
    --status-actif:#3F8A5C;
    --status-actif-soft:#E3EFE6;
    --status-ralentit:#C48A2E;
    --status-ralentit-soft:#F5EBD8;
    --status-pause:#A79E93;
    --status-pause-soft:#EFEAE3;
    --status-accompli:#BF5B44;
    --status-accompli-soft:#F3E2DC;
    --radius:14px;
    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:var(--font-display);color:var(--ink);background-color:var(--canvas);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:26px 26px;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .btn{
    border:1px solid var(--line);background:var(--canvas-card);border-radius:10px;padding:9px 15px;
    font-size:13.5px;font-weight:600;color:var(--ink);transition:background .12s ease, border-color .12s ease;
  }
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#A34936;}
  .btn-ghost{border-color:transparent;background:transparent;padding:9px 10px;}
  .btn-ghost:hover{background:var(--accent-soft);}
  .btn-danger{color:#9C4632;}

  /* HOME BADGES */
  .home-container{position:fixed;inset:0;background:var(--line);overflow:hidden;}
  .home-badges{
    display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;
    gap:8px;padding:10px;width:100%;height:100%;box-sizing:border-box;
  }
  .tile{
    flex-shrink:0;border-radius:16px;padding:4px;box-sizing:border-box;
    background:conic-gradient(var(--ring-color,var(--line)) calc(var(--pct,0)*1%), var(--line) 0);
  }
  @media (prefers-reduced-motion:no-preference){.tile{transition:filter .12s ease;}}
  .tile:hover{filter:brightness(0.98);}
  .tile-body{
    height:100%;width:100%;border-radius:12px;background:var(--canvas-card);
    display:flex;flex-direction:column;overflow:hidden;padding:14px;box-sizing:border-box;
  }
  .tile-emoji{line-height:1;}
  .tile-title{font-weight:800;letter-spacing:-0.01em;line-height:1.2;color:var(--ink);margin-top:6px;white-space:nowrap;}
  .tile-meta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;
    font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);white-space:nowrap;}
  .tile-status-word{font-weight:700;letter-spacing:0.04em;text-transform:uppercase;}
  .tile-status-word.actif{color:var(--status-actif);}
  .tile-status-word.ralentit{color:var(--status-ralentit);}
  .tile-status-word.pause{color:var(--status-pause);}
  .tile-status-word.accompli{color:var(--status-accompli);}

  .empty-state{
    position:absolute;inset:24px;border:1px dashed var(--line);border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:6px;
    color:var(--ink-soft);font-size:14px;background:var(--canvas);padding:20px;
  }
  .empty-state b{color:var(--ink);}

  /* TOP BAR (project detail) */
  .top-bar{position:fixed;top:12px;left:12px;right:12px;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .top-back-btn{
    width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--canvas-card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 6px 16px rgba(43,36,32,0.14);
  }
  .top-back-btn:hover{border-color:var(--accent);color:var(--accent);}
  .top-back-btn .icon{width:14px;height:14px;}
  .top-delete-btn{
    width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--canvas-card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);box-shadow:0 6px 16px rgba(43,36,32,0.14);
  }
  .top-delete-btn:hover{border-color:#9C4632;color:#9C4632;}
  .top-delete-btn .icon{width:14px;height:14px;}

  /* PROJECT DETAIL */
  .detail-scroll{position:fixed;inset:0;background:var(--canvas);overflow-y:auto;}
  .detail-inner{max-width:600px;margin:0 auto;padding:64px 20px 140px;}
  .detail-header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:22px;}
  .detail-emoji{font-size:44px;line-height:1;}
  .detail-title{font-size:22px;font-weight:800;letter-spacing:-0.01em;}
  .detail-summary{font-size:13.5px;color:var(--ink-soft);max-width:440px;line-height:1.5;}
  .detail-status-row{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .status-dot{width:8px;height:8px;border-radius:50%;}
  .status-dot.actif{background:var(--status-actif);}
  .status-dot.ralentit{background:var(--status-ralentit);}
  .status-dot.pause{background:var(--status-pause);}
  .status-dot.accompli{background:var(--status-accompli);}
  .detail-status-text{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);letter-spacing:0.03em;}

  .progress-track{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin:14px 0 26px;}
  .progress-fill{height:100%;border-radius:4px;background:var(--accent);}
  @media (prefers-reduced-motion:no-preference){.progress-fill{transition:width .3s ease;}}

  .next-action-card{
    background:var(--accent-soft);border:1px solid var(--accent);border-radius:16px;padding:18px;
    display:flex;flex-direction:column;gap:12px;margin-bottom:24px;
  }
  .next-action-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent);font-weight:700;}
  .next-action-title{font-size:17px;font-weight:700;color:var(--ink);line-height:1.35;}
  .next-action-row{display:flex;gap:10px;}
  .next-action-row .btn-primary{flex:1;}

  .accompli-banner{
    background:var(--accent);color:#fff;border-radius:16px;padding:22px;text-align:center;margin-bottom:24px;
  }
  .accompli-banner .big{font-size:19px;font-weight:800;margin-bottom:6px;}
  .accompli-banner .stats{font-family:var(--font-mono);font-size:11.5px;opacity:.9;}

  .section-label{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--ink-faint);margin:20px 0 10px;
  }
  .category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .category-card{
    background:var(--canvas-card);border:1px solid var(--line);border-radius:14px;padding:14px;
    display:flex;flex-direction:column;gap:8px;text-align:left;
  }
  .category-card-title{font-size:14px;font-weight:700;color:var(--ink);
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
  .category-progress-track{height:4px;border-radius:3px;background:var(--line);overflow:hidden;}
  .category-progress-fill{height:100%;border-radius:3px;background:var(--accent);}
  .category-card-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);}
  .category-card.done{opacity:.6;}
  .add-category-link{
    display:inline-block;margin-top:10px;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
    background:none;border:none;padding:4px 0;
  }
  .add-category-link:hover{color:var(--accent);}

  .step-row{
    display:flex;align-items:center;gap:10px;background:var(--canvas-card);border:1px solid var(--line);
    border-radius:10px;padding:11px 12px;margin-bottom:8px;
  }
  .step-check{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.6px solid var(--ink-faint);background:transparent;
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .step-check.checked{background:var(--status-actif);border-color:var(--status-actif);}
  .step-check .icon{width:12px;height:12px;}
  .step-title{flex:1;font-size:14px;color:var(--ink);min-width:0;}
  .step-row.done .step-title{color:var(--ink-faint);}
  .step-row.priority{background:var(--accent-soft);border-color:var(--accent);}
  .step-row.priority .step-title{font-weight:600;}
  .step-row{touch-action:pan-y;}
  .step-row.dragging{opacity:.55;}
  .step-title-input{
    flex:1;border:1px solid var(--accent);border-radius:7px;padding:5px 8px;font-size:14px;
    color:var(--ink);background:var(--canvas-card);min-width:0;font-family:inherit;
  }
  .step-title-input:focus{outline:none;}
  .step-row-ghost{
    position:fixed;z-index:80;pointer-events:none;box-shadow:0 10px 24px rgba(43,36,32,0.28);
    border-radius:10px;opacity:.96;
  }
  /* PRIORITÉS (page projet) */
  .priority-block{margin-bottom:18px;}
  .priority-block-label{
    font-family:var(--font-mono);font-size:10px;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:8px;
  }
  .priority-block-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;
    padding:9px 12px;margin-bottom:6px;font-size:13.5px;color:var(--ink);
  }
  .priority-block-title{min-width:0;}
  .priority-block-cat{font-size:11px;color:var(--accent);flex-shrink:0;}
  /* DROP STRIP catégories (pendant le drag) */
  .category-drop-strip{
    position:fixed;top:0;left:0;right:0;z-index:79;display:none;gap:8px;
    padding:12px 14px;background:var(--canvas-card);border-bottom:1px solid var(--line);
    overflow-x:auto;box-shadow:0 4px 14px rgba(43,36,32,0.12);
  }
  .category-drop-strip.active{display:flex;}
  .category-drop-chip{
    flex-shrink:0;padding:8px 14px;border-radius:20px;border:1.5px dashed var(--line);
    font-size:12.5px;color:var(--ink-faint);white-space:nowrap;background:var(--canvas);
  }
  .category-drop-chip.drop-hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;}
  .step-remove{border:none;background:none;color:var(--ink-faint);font-size:16px;line-height:1;padding:2px 4px;flex-shrink:0;}
  .step-remove:hover{color:#9C4632;}

  .add-step-row{display:flex;gap:8px;margin-top:6px;}
  .add-step-row input{
    flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;
    background:var(--canvas-card);color:var(--ink);min-width:0;
  }

  .suggest-more-btn{width:100%;margin-top:16px;}

  /* COMPOSE BAR */
  .compose-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:42;
    background:var(--canvas-card);border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:8px;box-shadow:0 -4px 16px rgba(43,36,32,0.10);
  }
  .compose-text-input{
    flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 15px;font-size:14px;
    background:var(--canvas);color:var(--ink);min-width:0;
  }
  .compose-send-btn{
    flex-shrink:0;width:38px;height:38px;border-radius:50%;border:none;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .compose-send-btn:hover{background:#A34936;}
  .compose-send-btn:disabled{opacity:.45;}
  .compose-send-btn .icon{width:16px;height:16px;}

  .loading-overlay{
    position:fixed;inset:0;background:rgba(43,36,32,0.5);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .loading-card{
    background:var(--canvas-card);border-radius:16px;padding:24px 28px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:10px;max-width:280px;
  }
  .loading-spinner{
    width:26px;height:26px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);
  }
  @media (prefers-reduced-motion:no-preference){.loading-spinner{animation:spin 0.8s linear infinite;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{font-size:13.5px;color:var(--ink-soft);}

  .toast{
    position:fixed;left:50%;bottom:78px;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;
    box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:55;opacity:0;pointer-events:none;
  }
  @media (prefers-reduced-motion:no-preference){.toast{transition:opacity .25s ease;}}
  .toast.show{opacity:1;}

  .reset-link{
    position:fixed;left:16px;bottom:74px;z-index:40;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);
    background:var(--canvas-card);border:1px solid var(--line);border-radius:14px;padding:7px 13px;
    box-shadow:0 6px 16px rgba(43,36,32,0.1);
  }
  .reset-link:hover{color:var(--accent);border-color:var(--accent);}

  .icon{width:15px;height:15px;display:block;}

  /* NOTES PAR TÂCHE — icône + panel */
  .note-icon-btn{
    position:relative;border:none;background:none;padding:3px 5px;
    color:var(--ink-faint);flex-shrink:0;border-radius:6px;
  }
  .note-icon-btn:hover,.note-icon-btn.has-notes{color:var(--accent);}
  .note-icon-btn .icon{width:15px;height:15px;}
  .note-badge{
    position:absolute;top:-3px;right:-2px;min-width:14px;height:14px;
    background:var(--accent);color:#fff;border-radius:7px;
    font-size:9px;font-weight:700;line-height:14px;text-align:center;padding:0 2px;
  }
  .note-panel{
    border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;
    background:var(--canvas);padding:10px 12px;margin-top:-2px;margin-bottom:8px;
  }
  .note-entry{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px;}
  .note-entry-text{flex:1;font-size:13px;color:var(--ink);line-height:1.4;white-space:pre-wrap;word-break:break-word;}
  .note-delete-btn{border:none;background:none;color:var(--ink-faint);font-size:14px;padding:0 3px;flex-shrink:0;line-height:1;}
  .note-delete-btn:hover{color:var(--accent);}
  .note-pencil-btn{border:none;background:none;color:var(--ink-faint);padding:0 3px;flex-shrink:0;line-height:1;}
  .note-pencil-btn:hover{color:var(--accent);}
  .note-edit-area{width:100%;box-sizing:border-box;border:1px solid var(--accent);border-radius:8px;padding:7px 9px;font-size:13px;background:var(--canvas-card);color:var(--ink);resize:vertical;min-height:44px;font-family:inherit;}
  .note-edit-area:focus{outline:none;}
  .note-edit-actions{display:flex;gap:6px;margin-top:5px;}
  .note-edit-ok{border:none;background:var(--accent);color:#fff;border-radius:7px;padding:4px 12px;font-size:12px;font-weight:600;}
  .note-edit-cancel{border:1px solid var(--line);background:transparent;color:var(--ink-faint);border-radius:7px;padding:4px 10px;font-size:12px;}
  .note-add-area{
    width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:13px;background:var(--canvas-card);color:var(--ink);
    resize:vertical;min-height:52px;font-family:inherit;
  }
  .note-add-area:focus{outline:none;border-color:var(--accent);}
  .note-add-hint{font-size:10.5px;color:var(--ink-faint);margin-top:4px;}
  .note-add-trigger{
    width:100%;box-sizing:border-box;text-align:left;border:1px dashed var(--line);border-radius:8px;
    padding:9px 10px;font-size:13px;color:var(--ink-faint);background:transparent;
  }
  .note-add-trigger:hover{border-color:var(--accent);color:var(--accent);}
  /* NOTE EDIT MODAL (tâche) */
  .note-edit-modal{position:fixed;inset:0;z-index:55;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,36,32,0.38);}
  .note-edit-modal-box{width:100%;max-width:620px;height:62vh;background:var(--canvas-card);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 32px rgba(43,36,32,0.18);}
  .note-edit-modal-header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .note-edit-modal-title{font-size:13.5px;font-weight:700;color:var(--ink);}
  .note-edit-modal-textarea{
    flex:1;width:100%;box-sizing:border-box;border:none;background:transparent;
    padding:16px 18px;font-size:15px;color:var(--ink);outline:none;resize:none;font-family:inherit;line-height:1.5;
  }
  .note-edit-modal-actions{border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
  /* NOTES LIBRES PROJET */
  .project-notes-section{margin-top:14px;}
  .proj-notes-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;display:block;padding-top:12px;border-top:1px solid var(--line);}
  .proj-note-row{background:var(--canvas-card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .proj-note-top{display:flex;align-items:center;gap:6px;}
  .proj-note-icon{color:var(--ink-faint);flex-shrink:0;display:flex;align-items:center;}
  .proj-note-icon .icon{width:14px;height:14px;}
  .cat-note-title{
    flex:1;border:none;background:transparent;font-size:13.5px;color:var(--ink);
    padding:0;outline:none;font-family:inherit;min-width:0;
  }
  .cat-note-title::placeholder{color:var(--ink-faint);}
  .cat-note-delete{border:none;background:none;color:var(--ink-faint);font-size:16px;padding:0 2px;line-height:1;flex-shrink:0;}
  .cat-note-delete:hover{color:var(--accent);}
  .proj-note-body{font-size:13px;color:var(--ink);line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
  .proj-note-body-edit{margin-top:8px;}
  .proj-note-move{
    border:1px solid var(--line);background:var(--canvas-card);border-radius:6px;
    font-size:11px;color:var(--ink-faint);padding:2px 5px;max-width:110px;flex-shrink:0;
  }

  /* VOIR LA SUITE */
  .voir-suite-link{
    display:inline-block;margin:4px 0 10px;font-family:var(--font-mono);font-size:11px;
    color:var(--ink-faint);background:none;border:none;padding:0;
  }
  .voir-suite-link:hover{color:var(--accent);}


  /* CHAT MODAL */
  .chat-icon-btn{
    position:fixed;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;
    background:var(--ink);color:#fff;border:none;z-index:45;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(43,36,32,0.22);
  }
  .chat-icon-btn:hover{background:var(--accent);}
  .chat-icon-btn .icon{width:20px;height:20px;}
  .chat-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,36,32,0.38);}
  .chat-modal-box{width:100%;max-width:620px;height:72vh;background:var(--canvas-card);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 32px rgba(43,36,32,0.18);}
  .chat-modal-header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .chat-modal-title{font-size:13.5px;font-weight:700;color:var(--ink);}
  .chat-modal-sub{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);margin-top:1px;}
  .chat-close-btn{border:none;background:none;font-size:22px;color:var(--ink-faint);line-height:1;padding:0 2px;}
  .chat-close-btn:hover{color:var(--ink);}
  .chat-messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .chat-empty{font-size:13px;color:var(--ink-faint);text-align:center;padding:20px 0;}
  .chat-msg-user{align-self:flex-end;max-width:86%;}
  .chat-msg-ai{align-self:flex-start;max-width:92%;}
  .chat-bubble-user{padding:10px 14px;border-radius:16px 16px 4px 16px;font-size:13.5px;line-height:1.5;background:var(--accent);color:#fff;}
  .chat-bubble-ai{padding:11px 14px;border-radius:16px 16px 16px 4px;font-size:13.5px;line-height:1.6;background:var(--canvas);border:1px solid var(--line);color:var(--ink);}
  .chat-ai-footer{display:flex;align-items:center;gap:4px;margin-top:4px;}
  .chat-copy-btn{border:none;background:none;padding:2px 6px;color:var(--ink-faint);border-radius:5px;font-size:11px;font-family:var(--font-mono);}
  .chat-copy-btn:hover{background:var(--accent-soft);color:var(--accent);}
  .chat-loading{padding:8px 16px;font-size:13px;color:var(--ink-faint);display:flex;align-items:center;gap:8px;}
  .chat-input-row{border-top:1px solid var(--line);display:flex;background:var(--canvas-card);}
  .chat-text-input{flex:1;border:none;background:transparent;padding:13px 16px;font-size:14px;color:var(--ink);outline:none;}
  .chat-send-btn{border:none;background:transparent;padding:12px 16px;color:var(--accent);font-weight:700;font-size:13px;flex-shrink:0;}
  .chat-send-btn:hover{color:#A34936;}
  .chat-send-btn:disabled{opacity:.35;}
  /* Formatage réponses IA */
  .ai-h1{font-size:17px;font-weight:800;color:var(--ink);margin:10px 0 4px;line-height:1.3;}
  .ai-h2{font-size:15px;font-weight:700;color:var(--ink);margin:8px 0 3px;line-height:1.3;}
  .ai-h3{font-size:13.5px;font-weight:700;color:var(--ink);margin:6px 0 2px;}
  .ai-p{margin:2px 0;line-height:1.6;}
  .ai-li{display:flex;gap:8px;margin:2px 0;align-items:baseline;}
  .ai-bullet{color:var(--accent);flex-shrink:0;font-weight:700;}
  /* Project DNA */
  .project-dna{font-size:12.5px;color:var(--status-actif);font-style:italic;max-width:440px;line-height:1.4;margin-top:4px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var DEVICE_ID_KEY = "dropit-device-id";
  var STATUS_LABELS = {actif:"Actif", ralentit:"Ralentit", pause:"En pause", accompli:"Accompli"};
  var showAllItems = false;

  function getOrCreateDeviceId(){
    var id = localStorage.getItem(DEVICE_ID_KEY);
    if(!id){
      id = "did-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10);
      localStorage.setItem(DEVICE_ID_KEY, id);
    }
    return id;
  }

  var state = {projects: []};
  var currentProjectId = null; // null = home
  var currentCategoryId = null; // set when viewing a single category's checklist
  var generating = false;
  var composeText = "";
  var chatState = {};
  var chatProjectOpen = false;
  var chatHomeOpen = false;
  var noteOpenId = null;
  var noteModal = null; // {taskId, noteId (null = nouvelle note), text}
  var editingItemId = null; // tâche en édition inline (appui court sur le titre)
  var projectNoteEditId = null;
  var projectNoteOpenId = null;

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function nowIso(){ return new Date().toISOString(); }
  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function makeProject(overrides){
    var base = {
      id: uid(), title:"", emoji:"✨", summary:"", categories:[],
      projectNotes: [],
      createdAt: nowIso(), updatedAt: nowIso()
    };
    overrides = overrides || {};
    for(var k in overrides){ base[k] = overrides[k]; }
    return base;
  }
  function makeCategory(title, itemTitles){
    return {
      id: uid(), title: String(title||"").trim() || "À faire",
      items: (itemTitles||[]).map(makeItem).filter(function(it){return it.title;}),
      catNotes: [],
      createdAt: nowIso(), updatedAt: nowIso()
    };
  }
  function makeItem(title){
    return {id: uid(), title:String(title||"").trim(), done:false, createdAt: nowIso(), notes:[]};
  }
  function normalizeItem(raw){
    var notes;
    if(Array.isArray(raw.notes)){
      notes = raw.notes.map(function(n){ return {id:n.id||uid(), text:n.text||"", createdAt:n.createdAt||nowIso()}; });
    } else if(raw.note && String(raw.note).trim()){
      notes = [{id:uid(), text:String(raw.note).trim(), createdAt:raw.createdAt||nowIso()}];
    } else {
      notes = [];
    }
    return {
      id:raw.id||uid(), title:raw.title||"", done:!!raw.done, createdAt:raw.createdAt||nowIso(),
      notes: notes
    };
  }
  function normalizeCategory(raw){
    var catNotes = Array.isArray(raw.catNotes) ? raw.catNotes.map(function(n){
      return {id:n.id||uid(), title:n.title||"", createdAt:n.createdAt||nowIso()};
    }) : [];
    return {
      id: raw.id || uid(), title: raw.title || "À faire",
      items: (raw.items||[]).map(normalizeItem),
      catNotes: catNotes,
      createdAt: raw.createdAt || nowIso(), updatedAt: raw.updatedAt || nowIso()
    };
  }
  function normalizeProject(raw){
    var categories;
    if(Array.isArray(raw.categories)){
      categories = raw.categories.map(normalizeCategory);
    } else if(Array.isArray(raw.steps)){
      categories = [{
        id: uid(), title: "À faire",
        items: raw.steps.map(normalizeItem),
        catNotes: [],
        createdAt: raw.createdAt || nowIso(), updatedAt: raw.updatedAt || nowIso()
      }];
    } else {
      categories = [];
    }
    var projectNotes = Array.isArray(raw.projectNotes) ? raw.projectNotes.map(function(n){
      return {id:n.id||uid(), title:n.title||"", body:n.body||"", catId:n.catId||null, createdAt:n.createdAt||nowIso()};
    }) : [];
    if(!raw.projectNotes){
      categories.forEach(function(cat){
        if(cat.catNotes && cat.catNotes.length){
          cat.catNotes.forEach(function(n){
            projectNotes.push({id:n.id||uid(), title:n.title||"", body:"", catId:cat.id, createdAt:n.createdAt||nowIso()});
          });
        }
        cat.catNotes = [];
      });
    }
    return {
      id: raw.id || uid(),
      title: raw.title || "Projet",
      emoji: raw.emoji || "✨",
      summary: raw.summary || "",
      dna: raw.dna || "",
      categories: categories,
      projectNotes: projectNotes,
      createdAt: raw.createdAt || nowIso(),
      updatedAt: raw.updatedAt || nowIso()
    };
  }

  function allItems(p){
    var out = [];
    p.categories.forEach(function(cat){ cat.items.forEach(function(it){ out.push(it); }); });
    return out;
  }
  function progressPct(p){
    var items = allItems(p);
    if(!items.length) return 0;
    var done = items.filter(function(it){return it.done;}).length;
    return Math.round((done/items.length)*100);
  }
  function isAccompli(p){
    var items = allItems(p);
    return items.length>0 && items.every(function(it){return it.done;});
  }
  function activityStatus(p){
    if(isAccompli(p)) return "accompli";
    var days = (Date.now() - new Date(p.updatedAt).getTime()) / 86400000;
    if(days < 2) return "actif";
    if(days < 7) return "ralentit";
    return "pause";
  }
  function nextActionItem(p){
    for(var ci=0; ci<p.categories.length; ci++){
      var cat = p.categories[ci];
      for(var ii=0; ii<cat.items.length; ii++){
        if(!cat.items[ii].done) return {item:cat.items[ii], category:cat};
      }
    }
    return null;
  }
  function priorityItems(p){
    var result = [];
    for(var ci=0; ci<p.categories.length && result.length<3; ci++){
      var cat = p.categories[ci];
      for(var ii=0; ii<cat.items.length && result.length<3; ii++){
        if(!cat.items[ii].done) result.push({item:cat.items[ii], category:cat});
      }
    }
    return result;
  }
  function findItemAnywhere(p, itemId){
    for(var i=0;i<p.categories.length;i++){
      var cat = p.categories[i];
      for(var j=0;j<cat.items.length;j++){
        if(cat.items[j].id === itemId) return {category:cat, item:cat.items[j]};
      }
    }
    return null;
  }
  function findCategory(p, categoryId){
    return p.categories.filter(function(c){ return c.id === categoryId; })[0] || null;
  }
  function findProject(id){
    return state.projects.filter(function(p){ return p.id === id; })[0] || null;
  }

  /* ---------- default sample data ---------- */

  function defaultData(){
    var bali = makeProject({
      title:"Bali cet été", emoji:"🌴",
      summary:"Vous avez commencé à organiser le voyage — reste l'hébergement et le budget.",
      categories:[
        makeCategory("Dates & transport", ["Choisir les dates de départ","Réserver les billets d'avion"]),
        makeCategory("Sur place", ["Trouver un hébergement","Lister les activités sur place"]),
        makeCategory("Budget", ["Définir le budget global"])
      ]
    });
    bali.categories[0].items.forEach(function(it){ it.done = true; });
    bali.updatedAt = nowIso();

    var julie = makeProject({
      title:"Anniversaire de Julie", emoji:"🎂",
      summary:"Presque prêt — reste le gâteau et la décoration.",
      categories:[
        makeCategory("Organisation", ["Fixer la date et le lieu","Faire la liste des invités","Envoyer les invitations"]),
        makeCategory("Préparatifs", ["Commander le gâteau","Prévoir la décoration"])
      ]
    });
    julie.categories[0].items.forEach(function(it){ it.done = true; });
    var d1 = new Date(); d1.setDate(d1.getDate()-6);
    julie.updatedAt = d1.toISOString();

    var demenagement = makeProject({
      title:"Déménagement", emoji:"📦",
      summary:"Les achats sont faits — reste l'administratif et l'organisation.",
      categories:[
        makeCategory("Achats & aménagement", ["Acheter un canapé","Acheter une table et des chaises","Acheter de la vaisselle","Commander des cartons"]),
        makeCategory("Administratif", ["Changer d'adresse","Résilier les anciens contrats (eau, électricité)","Souscrire les nouveaux contrats","Prévenir l'employeur et les organismes"]),
        makeCategory("Organisation", ["Réserver un camion de déménagement","Demander de l'aide pour le jour J","Planifier l'emballage des cartons"]),
        makeCategory("Budget", ["Estimer le coût total du déménagement"])
      ]
    });
    demenagement.categories[0].items.forEach(function(it){ it.done = true; });
    var d2 = new Date(); d2.setDate(d2.getDate()-1);
    demenagement.updatedAt = d2.toISOString();

    return {projects: [bali, julie, demenagement]};
  }

  /* ---------- persistence ---------- */

  function load(){
    var deviceId = getOrCreateDeviceId();
    fetch("/api/projects?device_id=" + encodeURIComponent(deviceId))
      .then(function(res){ return res.json(); })
      .then(function(json){
        var parsed = json.data || {};
        if(parsed.projects && parsed.projects.length > 0){
          state = {projects: parsed.projects.map(normalizeProject)};
        } else {
          state = defaultData();
          persist();
        }
        render();
      })
      .catch(function(){ state = defaultData(); render(); });
  }

  var saveTimer = null;
  function persist(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      var deviceId = getOrCreateDeviceId();
      fetch("/api/projects", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({device_id: deviceId, state: state})
      }).catch(function(){ showToast("Échec de l'enregistrement"); });
    }, 350);
  }

  /* ---------- badge sizing (mesure de texte) ---------- */

  var __measureCanvas = null;
  function measureTextWidth(text, fontSize, fontWeight){
    if(!__measureCanvas) __measureCanvas = document.createElement("canvas");
    var ctx = __measureCanvas.getContext("2d");
    ctx.font = fontWeight+" "+fontSize+"px -apple-system, BlinkMacSystemFont, sans-serif";
    return ctx.measureText(text).width;
  }

  var __measureProbe = null;
  function getMeasureProbe(){
    if(!__measureProbe){
      __measureProbe = document.createElement("div");
      __measureProbe.className = "tile-body";
      __measureProbe.style.position = "absolute";
      __measureProbe.style.visibility = "hidden";
      __measureProbe.style.left = "-9999px";
      __measureProbe.style.top = "-9999px";
      __measureProbe.style.height = "auto";
      document.body.appendChild(__measureProbe);
    }
    return __measureProbe;
  }

  /* ---------- icons ---------- */

  function backIcon(){ return '<svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function trashIcon(){ return '<svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function checkIcon(){ return '<svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M4 10.5l3.5 3.5L16 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function sendIcon(){ return '<svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M3 10l14-7-5 14-2.5-5.5L3 10z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>'; }
  function sparkleIcon(){ return '<svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M10 3l1.3 4.2L15.5 8.5l-4.2 1.3L10 14l-1.3-4.2L4.5 8.5l4.2-1.3L10 3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>'; }
  function copyIcon(){ return '<svg viewBox="0 0 16 16" fill="none" style="width:11px;height:11px;display:inline-block;vertical-align:middle;"><rect x="5" y="3" width="8" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M3 5.5H2.5A1.5 1.5 0 001 7v6a1.5 1.5 0 001.5 1.5h5A1.5 1.5 0 009 13v-.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'; }
  function pencilIcon(){ return '<svg viewBox="0 0 16 16" fill="none" style="width:11px;height:11px;display:inline-block;vertical-align:middle;"><path d="M2 11.5l6-6 2.5 2.5-6 6-2.5.5.5-3z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M9.5 5l1-1a1.2 1.2 0 011.7 0l.3.3a1.2 1.2 0 010 1.7l-1 1L9.5 5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>'; }
  function bookmarkIcon(){ return '<svg viewBox="0 0 16 16" fill="none" style="width:11px;height:11px;display:inline-block;vertical-align:middle;"><path d="M3.5 2.5h9v11l-4.5-2.5L3.5 13.5V2.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>'; }
  function moveIcon(){ return '<svg viewBox="0 0 16 16" fill="none" style="width:11px;height:11px;display:inline-block;vertical-align:middle;"><path d="M2 4h7v8H2V4z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M9 6l3 2-3 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }

  /* ---------- rendering ---------- */

  function render(){
    var app = document.getElementById("app");
    var project = currentProjectId ? findProject(currentProjectId) : null;
    if(project && currentCategoryId){
      var category = findCategory(project, currentCategoryId);
      if(category){ app.innerHTML = renderCategoryDetail(project, category); }
      else { currentCategoryId = null; app.innerHTML = renderDetail(project); }
    } else if(project){
      app.innerHTML = renderDetail(project);
    } else {
      app.innerHTML = renderHome();
      layoutHomeTreemap();
    }
    bindGlobalEvents();
    if(generating) renderLoadingOverlay();
  }

  function renderHome(){
    var containerHtml = state.projects.length === 0
      ? '<div class="empty-state"><b>Dis ce que tu veux réaliser.</b><span>Écris une intention en bas — l\'IA construit le projet pour toi.</span></div>'
      : '';
    return ''+
    '<div class="home-container" id="home-container">'+containerHtml+'</div>'+
    renderComposeBar()+
    renderHomeChatModal()+
    (state.projects.length > 0 ? '<button class="chat-icon-btn" id="chat-home-icon-btn" title="Demander à l\'IA" style="bottom:76px;">'+chatIcon()+'</button>' : '')+
    '<div class="toast" id="toast"></div>';
  }

  function renderHomeChatModal(){
    if(!chatHomeOpen) return '';
    var cs = chatState['home'] || {messages:[], loading:false};
    var msgsHtml = '';
    if(!cs.messages.length && !cs.loading){
      msgsHtml = '<div class="chat-empty">Pose une question sur tous tes projets…</div>';
    } else {
      msgsHtml = cs.messages.map(function(m, idx){
        if(m.role==='user') return '<div class="chat-msg-user"><div class="chat-bubble-user">'+escapeHtml(m.text)+'</div></div>';
        return '<div class="chat-msg-ai">'+
          '<div class="chat-bubble-ai">'+parseAiText(m.text)+'</div>'+
          '<div class="chat-ai-footer"><button class="chat-copy-btn" data-copy-idx="'+idx+'" data-copy-proj="home">'+copyIcon()+' copier</button></div>'+
        '</div>';
      }).join('');
    }
    var loadHtml = cs.loading ? '<div class="chat-loading"><div class="loading-spinner" style="width:12px;height:12px;border-width:2px;display:inline-block;"></div>En train de répondre…</div>' : '';
    return '<div class="chat-modal" id="chat-modal-home">'+
      '<div class="chat-modal-box">'+
        '<div class="chat-modal-header">'+
          '<div>'+
            '<div class="chat-modal-title">'+chatIcon()+' Vue d\'ensemble</div>'+
            '<div class="chat-modal-sub">claude-sonnet-4-6 · '+state.projects.length+' projet'+(state.projects.length>1?'s':'')+'</div>'+
          '</div>'+
          '<button class="chat-close-btn" id="chat-home-close-btn">×</button>'+
        '</div>'+
        '<div class="chat-messages" id="chat-msgs-home">'+msgsHtml+'</div>'+
        loadHtml+
        '<div class="chat-input-row">'+
          '<input class="chat-text-input" id="chat-home-input" placeholder="Quels projets avancent le plus ?"'+(cs.loading?' disabled':'')+'>'+
          '<button class="chat-send-btn" id="chat-home-send-btn"'+(cs.loading?' disabled':'')+'>Envoyer</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function renderComposeBar(){
    return ''+
    '<div class="compose-bar" id="compose-bar">'+
      '<input class="compose-text-input" id="compose-text-input" type="text" placeholder="On aimerait partir à Bali en septembre…" value="'+escapeHtml(composeText)+'">'+
      '<button class="compose-send-btn" id="compose-send-btn" title="Créer" '+(generating?"disabled":"")+'>'+sendIcon()+'</button>'+
    '</div>';
  }

  function buildBadgeHtml(p, weight, minWeight, maxWeight, scaleMul){
    var norm = (maxWeight > minWeight) ? (weight - minWeight) / (maxWeight - minWeight) : 0.5;
    var fontSize = (13 + norm * 7) * scaleMul;
    var padH = 16 * scaleMul;
    var padV = 10 * scaleMul;
    var emojiSize = Math.max(14, fontSize * 1.35);
    var titleWidth = measureTextWidth(p.title, fontSize, "800");
    var width = Math.max(titleWidth + padH * 2 + 4, 76 * scaleMul);
    var pct = progressPct(p);
    var status = activityStatus(p);
    var items2 = allItems(p);
    var doneCount = items2.filter(function(it){ return it.done; }).length;

    var emojiHtml = '<div class="tile-emoji" style="font-size:'+emojiSize+'px;">'+p.emoji+'</div>';
    var titleHtml = '<div class="tile-title" style="font-size:'+fontSize+'px;">'+escapeHtml(p.title)+'</div>';
    var metaHtml = '<div class="tile-meta">'+
      '<span class="tile-status-word '+status+'">'+STATUS_LABELS[status]+'</span>'+
      '<span>'+pct+'% · '+doneCount+'/'+items2.length+'</span>'+
    '</div>';

    var probe = getMeasureProbe();
    probe.style.width = width+"px";
    probe.style.padding = padV+"px "+padH+"px";
    probe.innerHTML = emojiHtml+titleHtml+metaHtml;
    var heightWithMeta = probe.scrollHeight;
    probe.innerHTML = emojiHtml+titleHtml;
    var heightNoMeta = probe.scrollHeight;

    var targetHeight = (58 + norm * 42) * scaleMul;
    var showMeta, height;
    if(targetHeight >= heightWithMeta){ showMeta = true; height = targetHeight; }
    else if(targetHeight >= heightNoMeta){ showMeta = false; height = targetHeight; }
    else { showMeta = false; height = heightNoMeta; }

    var ringGutter = 8; // padding:4px de chaque côté du .tile (anneau de progression)
    return ''+
    '<div class="tile" data-project-id="'+p.id+'" '+
      'style="width:'+(width+ringGutter)+'px;height:'+(height+ringGutter)+'px;--pct:'+pct+';--ring-color:var(--status-'+status+');" '+
      'role="button" tabindex="0">'+
      '<div class="tile-body" style="padding:'+padV+'px '+padH+'px;">'+
        emojiHtml+titleHtml+(showMeta ? metaHtml : '')+
      '</div>'+
    '</div>';
  }

  function layoutHomeTreemap(){
    var container = document.getElementById("home-container");
    if(!container || state.projects.length === 0) return;
    var W = container.clientWidth, H = container.clientHeight;
    if(W < 40 || H < 40) return;

    var weights = state.projects.map(function(p){
      return {p:p, weight: allItems(p).length + p.categories.length};
    });
    var minWeight = Math.min.apply(null, weights.map(function(x){ return x.weight; }));
    var maxWeight = Math.max.apply(null, weights.map(function(x){ return x.weight; }));

    var scaleMul = 1;
    var guard = 0;
    while(true){
      var html = weights.map(function(x){ return buildBadgeHtml(x.p, x.weight, minWeight, maxWeight, scaleMul); }).join("");
      container.innerHTML = '<div class="home-badges" id="home-badges">'+html+'</div>';
      var badges = document.getElementById("home-badges");
      if(badges.scrollHeight <= H + 1 || scaleMul <= 0.5 || guard >= 7) break;
      scaleMul *= 0.85;
      guard++;
    }

    container.querySelectorAll("[data-project-id]").forEach(function(el){
      el.addEventListener("click", function(){
        currentProjectId = el.dataset.projectId;
        showAllItems = false;
        render();
      });
      el.addEventListener("keydown", function(e){
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); el.click(); }
      });
    });
  }

  function renderDetail(p){
    var pct = progressPct(p);
    var status = activityStatus(p);
    var next = nextActionItem(p);
    var accompli = isAccompli(p);
    var items2 = allItems(p);
    var multiCategory = p.categories.length > 1;
    var priorityList = accompli ? [] : priorityItems(p);
    var priorityIds = priorityList.map(function(x){ return x.item.id; });

    var topBarHtml = ''+
    '<div class="top-bar">'+

  function parseAiText(text){
    return String(text||'').split('\n').map(function(line){
      if(!line.trim()) return '<div style="height:5px"></div>';
      var safe = escapeHtml(line);
      safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if(/^### /.test(line)) return '<div class="ai-h3">'+safe.slice(4)+'</div>';
      if(/^## /.test(line))  return '<div class="ai-h2">'+safe.slice(3)+'</div>';
      if(/^# /.test(line))   return '<div class="ai-h1">'+safe.slice(2)+'</div>';
      if(/^[-•] /.test(line)) return '<div class="ai-li"><span class="ai-bullet">·</span><span>'+safe.slice(2)+'</span></div>';
      return '<div class="ai-p">'+safe+'</div>';
    }).join('');
  }

  /* ---------- AI generation ---------- */

  function generateProject(intention){
    var promptText = ""+
      "Tu es le moteur d'un produit qui transforme une intention en projet concret et actionnable.\n\n"+
      "Intention de l'utilisateur : \"" + intention + "\"\n\n"+
      "Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour, sans balises markdown, exactement sous cette forme :\n"+
      '{"title":"titre court (3-5 mots)","emoji":"un seul emoji représentatif","summary":"une phrase naturelle qui résume ce qu\'il y a à faire",'+
      '"categories":[{"title":"nom de la catégorie","items":["élément 1","élément 2","..."]}]}'+
      "\n\nRegroupe les actions par aspect logique et distinct du projet (par exemple pour un déménagement : achats & aménagement, administratif, organisation, budget — "+
      "mais adapte entièrement les catégories au type de projet réel, un voyage ou un anniversaire n'auront pas du tout les mêmes). "+
      "Si le projet est simple et n'a qu'un seul aspect, une seule catégorie suffit. Génère entre 1 et 5 catégories pertinentes, chacune avec 3 à 7 éléments concrets et courts (5 à 10 mots).\n"+
      "Ordonne les catégories et leurs éléments dans l'ordre logique où ils doivent être traités : le tout premier élément de la première catégorie doit être la prochaine action la plus utile à faire maintenant.";

    return Promise.resolve().then(function(){
      return fetch("/api/ai", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 800,
          messages: [{role:"user", content:[{type:"text", text:promptText}]}]
        })
      });
    }).then(function(res){ return res.json(); }).then(function(data){
      var textOut = (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
      var clean = textOut.replace(/```json|```/g,"").trim();
      return JSON.parse(clean);
    });
  }

  function generateCategorySuggestion(p, cat){
    var doneTitles = cat.items.filter(function(it){return it.done;}).map(function(it){return it.title;});
    var remainingTitles = cat.items.filter(function(it){return !it.done;}).map(function(it){return it.title;});
    var promptText = ""+
      "Projet : "+p.title+" — "+p.summary+"\n"+
      "Catégorie : "+cat.title+"\n"+
      "Éléments déjà faits dans cette catégorie : "+JSON.stringify(doneTitles)+"\n"+
      "Éléments restants dans cette catégorie : "+JSON.stringify(remainingTitles)+"\n\n"+
      "Propose 1 à 3 nouveaux éléments concrets et courts qui manquent dans CETTE catégorie spécifiquement, sans répéter ceux déjà listés.\n"+
      'Réponds UNIQUEMENT avec un tableau JSON de chaînes, sans texte autour, sans balises markdown : ["élément a","élément b"]';

    return Promise.resolve().then(function(){
      return fetch("/api/ai", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 300,
          messages: [{role:"user", content:[{type:"text", text:promptText}]}]
        })
      });
    }).then(function(res){ return res.json(); }).then(function(data){
      var textOut = (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
      var clean = textOut.replace(/```json|```/g,"").trim();
      return JSON.parse(clean);
    });
  }

  function generateProjectSuggestion(p){
    var categoriesSummary = p.categories.map(function(cat){
      return {id:cat.id, title:cat.title, items: cat.items.map(function(it){ return {title:it.title, done:it.done}; })};
    });
    var promptText = ""+
      "Projet : "+p.title+" — "+p.summary+"\n"+
      "État actuel du projet, catégorie par catégorie (JSON) : "+JSON.stringify(categoriesSummary)+"\n\n"+
      "Propose la suite la plus utile pour faire avancer ce projet, en tenant vraiment compte de ce qui est déjà fait :\n"+
      "- Si une catégorie existante a encore des éléments non faits ou manque visiblement d'un élément important, tu peux ajouter 1 à 3 nouveaux éléments à CETTE catégorie.\n"+
      "- Si toutes les catégories existantes sont terminées ou presque, propose plutôt une NOUVELLE catégorie pertinente avec ses propres éléments.\n"+
      "- Ne propose jamais un élément qui recoupe une catégorie déjà entièrement terminée.\n\n"+
      "Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour, sans balises markdown, sous l'une de ces deux formes exactes :\n"+
      '{"type":"add_items","categoryId":"<id d\'une catégorie ci-dessus>","items":["élément 1","élément 2"]}\n'+

  function reorderCategoryItems(p, catId, orderedIds){
    var cat = findCategory(p, catId);
    if(!cat) return;
    var byId = {};
    cat.items.forEach(function(it){ byId[it.id] = it; });
    var reorderedRemaining = orderedIds.map(function(id){ return byId[id]; }).filter(Boolean);
    var doneItems = cat.items.filter(function(it){ return it.done; });
    cat.items = reorderedRemaining.concat(doneItems);
    p.updatedAt = nowIso();
    persist(); render();
  }

  function moveItemToCategory(p, itemId, sourceCatId, targetCatId){
    if(sourceCatId === targetCatId) return;
    var sourceCat = findCategory(p, sourceCatId);
    var targetCat = findCategory(p, targetCatId);
    if(!sourceCat || !targetCat) return;
    var idx = sourceCat.items.findIndex(function(it){ return it.id === itemId; });
    if(idx === -1) return;
    var item = sourceCat.items.splice(idx, 1)[0];
    targetCat.items.push(item);
    p.updatedAt = nowIso();
    persist(); render();
    showToast("Déplacé vers "+targetCat.title);
  }

  function reorderStepItems(listEl, draggedEl, pointerY){
    var siblings = Array.prototype.slice.call(listEl.querySelectorAll(".step-item[data-item-id]"));
    for(var i=0; i<siblings.length; i++){
      var sib = siblings[i];
      if(sib === draggedEl) continue;
      var r = sib.getBoundingClientRect();
      var mid = r.top + r.height/2;
      if(pointerY < mid){
        if(sib.previousElementSibling !== draggedEl) listEl.insertBefore(draggedEl, sib);
        return;
      }
    }
    if(listEl.lastElementChild !== draggedEl) listEl.appendChild(draggedEl);
  }

  var ITEM_LONG_PRESS_MS = 450;
  var ITEM_DRAG_THRESHOLD = 10;

  function beginItemDrag(itemEl, listEl, itemId, sourceCatId, pointerId, clientY){
    var rect = itemEl.getBoundingClientRect();
    var grabOffsetY = clientY - rect.top;
    itemEl.classList.add("dragging");
    if(navigator.vibrate) navigator.vibrate(12);

    var ghost = itemEl.cloneNode(true);
    ghost.className = "step-item step-row-ghost";
    ghost.style.left = rect.left + "px";
    ghost.style.top = rect.top + "px";
    ghost.style.width = rect.width + "px";
    document.body.appendChild(ghost);

    var dropStrip = document.getElementById("category-drop-strip");
    if(dropStrip) dropStrip.classList.add("active");
    var hoverChip = null;

    function onMove(e){
      if(e.pointerId !== pointerId) return;
      e.preventDefault();
      ghost.style.top = (e.clientY - grabOffsetY) + "px";
      reorderStepItems(listEl, itemEl, e.clientY);

      if(dropStrip){
        var found = null;
        dropStrip.querySelectorAll(".category-drop-chip").forEach(function(chip){
          var cRect = chip.getBoundingClientRect();
          if(e.clientX>=cRect.left && e.clientX<=cRect.right && e.clientY>=cRect.top-10 && e.clientY<=cRect.bottom+16){
            found = chip;
          }
        });
        if(hoverChip && hoverChip !== found) hoverChip.classList.remove("drop-hover");
        if(found) found.classList.add("drop-hover");
        hoverChip = found;
      }
    }

    function onUp(e){
      if(e.pointerId !== pointerId) return;
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      ghost.remove();
      itemEl.classList.remove("dragging");
      if(dropStrip) dropStrip.classList.remove("active");

      var p = findProject(currentProjectId);
      if(!p) return;

      if(hoverChip){
        hoverChip.classList.remove("drop-hover");
        moveItemToCategory(p, itemId, sourceCatId, hoverChip.dataset.dropCat);
      } else {
        var orderedIds = Array.prototype.slice.call(listEl.querySelectorAll(".step-item[data-item-id]"))
          .map(function(el){ return el.dataset.itemId; });
        reorderCategoryItems(p, sourceCatId, orderedIds);
      }
    }

    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  }

  function setupItemDragAndTap(){
    document.querySelectorAll(".step-list").forEach(function(listEl){
      var sourceCatId = listEl.dataset.catId;
      listEl.querySelectorAll(".step-item[data-item-id]").forEach(function(itemEl){
        var itemId = itemEl.dataset.itemId;
        var pressTimer = null, startX = 0, startY = 0, longPressed = false, moved = false, activePointerId = null;

        itemEl.addEventListener("pointerdown", function(e){
          if(e.target.closest("button") || e.target.closest("input")) return;
          if(e.pointerType === "mouse" && e.button !== 0) return;
          startX = e.clientX; startY = e.clientY; longPressed = false; moved = false;
          activePointerId = e.pointerId;
          try{ itemEl.setPointerCapture(activePointerId); }catch(err){}
          pressTimer = setTimeout(function(){
            longPressed = true;
            beginItemDrag(itemEl, listEl, itemId, sourceCatId, activePointerId, e.clientY);
          }, ITEM_LONG_PRESS_MS);
        });
        itemEl.addEventListener("pointermove", function(e){
          if(e.pointerId !== activePointerId || longPressed) return;
          if(Math.abs(e.clientX-startX) > ITEM_DRAG_THRESHOLD || Math.abs(e.clientY-startY) > ITEM_DRAG_THRESHOLD){
            moved = true;
            clearTimeout(pressTimer);
          }
        });
        itemEl.addEventListener("pointerup", function(e){
          if(e.pointerId !== activePointerId) return;
          clearTimeout(pressTimer);
          if(!longPressed && !moved){
            editingItemId = itemId;
            render();
            setTimeout(function(){
              var input = document.querySelector('[data-item-title-input="'+itemId+'"]');
              if(input){ input.focus(); input.select(); }
            }, 30);
          }
          activePointerId = null;
        });
        itemEl.addEventListener("pointercancel", function(){ clearTimeout(pressTimer); activePointerId = null; });
      });
    });
  }

      var p = findProject(currentProjectId);
      var cat = p ? findCategory(p, addItemBtn.dataset.category) : null;
      if(!p || !cat) return;
      cat.items.push(makeItem(title));
      p.updatedAt = nowIso();
      persist(); render();
    });
    var newItemInput = document.getElementById("new-item-input");
    if(newItemInput) newItemInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); document.getElementById("add-item-btn").click(); }
    });

    var voirSuiteBtn = document.getElementById("voir-suite-btn");
    if(voirSuiteBtn) voirSuiteBtn.addEventListener("click", function(){ showAllItems = true; render(); });

    // Chat modal
    var chatIconBtn = document.getElementById("chat-icon-btn");
    if(chatIconBtn) chatIconBtn.addEventListener("click", function(){
      chatProjectOpen = true; render();
      setTimeout(function(){ var el = document.getElementById('chat-msgs-'+currentProjectId); if(el) el.scrollTop = el.scrollHeight; }, 50);
    });
    var chatCloseBtn = document.getElementById("chat-close-btn");
    if(chatCloseBtn) chatCloseBtn.addEventListener("click", function(){ chatProjectOpen = false; render(); });
    var chatModal = document.getElementById("chat-modal");
    if(chatModal) chatModal.addEventListener("click", function(e){ if(e.target === chatModal){ chatProjectOpen = false; render(); } });
    var chatSendBtn = document.getElementById("chat-send-btn");
    var chatInput = document.getElementById("chat-input");
    if(chatSendBtn) chatSendBtn.addEventListener("click", function(){
      if(!chatInput || !chatInput.value.trim()) return;
      var text = chatInput.value; chatInput.value = '';
      performChatSend(currentProjectId, text);
    });
    if(chatInput) chatInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); if(chatSendBtn) chatSendBtn.click(); }
      if(e.key === "Escape"){ chatProjectOpen = false; render(); }
    });
    document.querySelectorAll("[data-copy-idx]").forEach(function(el){
      el.addEventListener("click", function(){
        var cs = chatState[el.dataset.copyProj];
        var msg = cs && cs.messages[parseInt(el.dataset.copyIdx, 10)];
        if(!msg) return;
        navigator.clipboard.writeText(msg.text).then(function(){ showToast("Copié"); }).catch(function(){ showToast("Copie impossible"); });
      });
    });
    // Notes tâche — icône toggle
    document.querySelectorAll("[data-note-open]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.dataset.noteOpen;
        noteOpenId = (noteOpenId === id) ? null : id;
        render();
      });
    });
    // Notes tâche — suppression d'une note
    document.querySelectorAll("[data-delete-note]").forEach(function(el){
      el.addEventListener("click", function(){
        performDeleteNote(currentProjectId, el.dataset.deleteNoteTask, el.dataset.deleteNote);
      });
    });
    // Notes projet libres — titre (blur)
    document.querySelectorAll("[data-pn-title]").forEach(function(el){
      el.addEventListener("blur", function(){ performUpdateProjectNoteTitle(currentProjectId, el.dataset.pnTitle, el.value); });
    });
    // Notes projet libres — supprimer
    document.querySelectorAll("[data-pn-delete]").forEach(function(el){
      el.addEventListener("click", function(){ performDeleteProjectNote(currentProjectId, el.dataset.pnDelete); });
    });
    // Notes projet libres — toggle expand/collapse
    document.querySelectorAll("[data-pn-toggle]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.dataset.pnToggle;
        if(projectNoteEditId === id) return;
        projectNoteOpenId = (projectNoteOpenId === id) ? null : id;
        render();
      });
    });
    // Notes projet libres — ouvrir édition body (+ expand)
    document.querySelectorAll("[data-pn-edit-open]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.dataset.pnEditOpen;
        projectNoteEditId = id;
        projectNoteOpenId = id;
        render();
        setTimeout(function(){
          var ta = document.querySelector('[data-pn-edit-ta="'+id+'"]');
          if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
        }, 30);
      });
    });
    // Notes projet libres — valider édition body
    document.querySelectorAll("[data-pn-edit-ok]").forEach(function(el){
      el.addEventListener("click", function(){
        var ta = document.querySelector('[data-pn-edit-ta="'+el.dataset.pnEditOk+'"]');
        if(ta) performEditProjectNoteBody(currentProjectId, el.dataset.pnEditOk, ta.value);
      });
    });
    // Notes projet libres — annuler édition (garde la note ouverte)
    document.querySelectorAll("[data-pn-edit-cancel]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.dataset.pnEditCancelId || projectNoteEditId;
        projectNoteEditId = null;
        projectNoteOpenId = id;
        render();
      });
    });
    // Notes projet libres — déplacer (select)
    document.querySelectorAll("[data-pn-move]").forEach(function(el){
      el.addEventListener("change", function(){ performMoveProjectNote(currentProjectId, el.dataset.pnMove, el.value||null); });
    });
    // Note tâche — ouvrir modal (nouvelle note)
    document.querySelectorAll("[data-note-modal-add]").forEach(function(el){
      el.addEventListener("click", function(){
        noteModal = {taskId: el.dataset.noteModalAdd, noteId: null, text: ''};
        render();
        focusNoteModalTextarea();
      });
    });
    // Note tâche — ouvrir modal (édition)
    document.querySelectorAll("[data-note-modal-edit]").forEach(function(el){
      el.addEventListener("click", function(){
        var taskId = el.dataset.noteModalTask, noteId = el.dataset.noteModalEdit;
        var found = findItemAnywhere(findProject(currentProjectId), taskId);
        var note = found && (found.item.notes||[]).filter(function(n){ return n.id===noteId; })[0];
        noteModal = {taskId: taskId, noteId: noteId, text: note ? note.text : ''};
        render();
        focusNoteModalTextarea();
      });
    });
    // Note tâche modal — fermer sans sauvegarder
    if(noteModal){
      var noteModalCloseBtn = document.getElementById("note-modal-close-btn");
      if(noteModalCloseBtn) noteModalCloseBtn.addEventListener("click", function(){ noteModal = null; render(); });
      var noteModalEl = document.getElementById("note-edit-modal");
      if(noteModalEl) noteModalEl.addEventListener("click", function(e){ if(e.target === noteModalEl){ noteModal = null; render(); } });
      var noteModalSaveBtn = document.getElementById("note-modal-save-btn");
      if(noteModalSaveBtn) noteModalSaveBtn.addEventListener("click", function(){
        var ta = document.getElementById("note-modal-textarea");
        var text = ta ? ta.value : '';
        if(!text.trim()){ noteModal = null; render(); return; }
        var taskId = noteModal.taskId, noteId = noteModal.noteId;
        noteModal = null;
        if(noteId) performEditNote(currentProjectId, taskId, noteId, text);
        else performAddNote(currentProjectId, taskId, text);
      });
    }
    // Chat — save as note
    document.querySelectorAll("[data-save-note-idx]").forEach(function(el){
      el.addEventListener("click", function(){
        var cs = chatState[el.dataset.saveNoteProj];
        var msg = cs && cs.messages[parseInt(el.dataset.saveNoteIdx, 10)];
        if(!msg) return;
        performSaveChatAsNote(el.dataset.saveNoteProj, msg.text);
      });
    });
    // Chat home — icône
    var chatHomeIconBtn = document.getElementById("chat-home-icon-btn");
    if(chatHomeIconBtn) chatHomeIconBtn.addEventListener("click", function(){
      chatHomeOpen = true; render();
      setTimeout(function(){ var el = document.getElementById('chat-msgs-home'); if(el) el.scrollTop = el.scrollHeight; }, 50);
    });
    // Chat home — close
    var chatHomeCloseBtn = document.getElementById("chat-home-close-btn");
    if(chatHomeCloseBtn) chatHomeCloseBtn.addEventListener("click", function(){ chatHomeOpen = false; render(); });
    var chatModalHome = document.getElementById("chat-modal-home");
    if(chatModalHome) chatModalHome.addEventListener("click", function(e){ if(e.target === chatModalHome){ chatHomeOpen = false; render(); } });
    // Chat home — send
    var chatHomeSendBtn = document.getElementById("chat-home-send-btn");
    var chatHomeInput = document.getElementById("chat-home-input");
    if(chatHomeSendBtn) chatHomeSendBtn.addEventListener("click", function(){
      if(!chatHomeInput || !chatHomeInput.value.trim()) return;
      var text = chatHomeInput.value; chatHomeInput.value = '';
      performHomeChatSend(text);
    });
    if(chatHomeInput) chatHomeInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); if(chatHomeSendBtn) chatHomeSendBtn.click(); }
      if(e.key === "Escape"){ chatHomeOpen = false; render(); }
    });
    // Auto-scroll chat si modal ouvert
    setTimeout(function(){
      var el = document.getElementById('chat-msgs-'+currentProjectId);
      if(el) el.scrollTop = el.scrollHeight;
      var el2 = document.getElementById('chat-msgs-home');
      if(el2) el2.scrollTop = el2.scrollHeight;
    }, 20);

    var suggestCategoryBtn = document.getElementById("suggest-category-btn");
    if(suggestCategoryBtn) suggestCategoryBtn.addEventListener("click", function(){
      var p = findProject(currentProjectId);
      var cat = p ? findCategory(p, suggestCategoryBtn.dataset.category) : null;
      if(p && cat) performSuggestForCategory(p, cat);
    });
    var suggestProjectBtn = document.getElementById("suggest-project-btn");
    if(suggestProjectBtn) suggestProjectBtn.addEventListener("click", function(){
      var p = findProject(currentProjectId);
      if(p) performSuggestForProject(p);
    });
  }

  var resizeTimer = null;
  window.addEventListener("resize", function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ if(!currentProjectId) layoutHomeTreemap(); }, 150);
  });

  load();
})();
</script>
</body>
</html>
