  /* ---------- global events ---------- */

  function bindGlobalEvents(){
    var composeTextInput = document.getElementById("compose-text-input");
    if(composeTextInput){
      composeTextInput.addEventListener("input", function(e){ composeText = e.target.value; });
      composeTextInput.addEventListener("keydown", function(e){
        if(e.key === "Enter"){ e.preventDefault(); performCreateFromIntention(); }
      });
    }
    var composeSendBtn = document.getElementById("compose-send-btn");
    if(composeSendBtn && !generating) composeSendBtn.addEventListener("click", function(){ performCreateFromIntention(); });

    var backBtn = document.getElementById("detail-back-btn");
    if(backBtn) backBtn.addEventListener("click", function(){ currentProjectId = null; showAllItems = false; render(); });

    var deleteBtn = document.getElementById("detail-delete-btn");
    if(deleteBtn) deleteBtn.addEventListener("click", function(){
      var p = findProject(currentProjectId);
      if(p && confirm('Supprimer "'+p.title+'" ?')){
        state.projects = state.projects.filter(function(x){ return x.id !== p.id; });
        currentProjectId = null;
        persist(); render();
      }
    });

    document.querySelectorAll("[data-open-category]").forEach(function(el){
      el.addEventListener("click", function(){ currentCategoryId = el.dataset.openCategory; render(); });
    });
    var categoryBackBtn = document.getElementById("category-back-btn");
    if(categoryBackBtn) categoryBackBtn.addEventListener("click", function(){ currentCategoryId = null; render(); });
    var categoryDeleteBtn = document.getElementById("category-delete-btn");
    if(categoryDeleteBtn) categoryDeleteBtn.addEventListener("click", function(){
      var p = findProject(currentProjectId);
      var cat = p ? findCategory(p, currentCategoryId) : null;
      if(p && cat && confirm('Supprimer la catégorie "'+cat.title+'" ?')){
        p.categories = p.categories.filter(function(c){ return c.id !== cat.id; });
        p.updatedAt = nowIso();
        currentCategoryId = null;
        persist(); render();
      }
    });
    // Compte — ouvrir / fermer / déconnexion
    var accountBtn = document.getElementById("account-btn");
    if(accountBtn) accountBtn.addEventListener("click", function(){
      accountSheetOpen = true; render();
    });
    var accountCloseBtn = document.getElementById("account-close-btn");
    if(accountCloseBtn) accountCloseBtn.addEventListener("click", function(){
      accountSheetOpen = false; render();
    });
    var accountSheet = document.getElementById("account-sheet");
    if(accountSheet) accountSheet.addEventListener("click", function(e){
      if(e.target === accountSheet){ accountSheetOpen = false; render(); }
    });
    var accountSignoutBtn = document.getElementById("account-signout-btn");
    if(accountSignoutBtn) accountSignoutBtn.addEventListener("click", function(){
      signOut();
    });

    // Task list — barre de saisie
    var tlAddBtn = document.getElementById('tl-add-btn');
    var tlInput  = document.getElementById('tl-compose-input');
    if(tlAddBtn) tlAddBtn.addEventListener('click', function(){
      if(!tlInput) return;
      var text = tlInput.value.trim(); if(!text) return;
      var p = tlTargetProject(); if(!p) return;
      if(!p.categories.length) p.categories.push(makeCategory('À faire',[]));
      p.categories[0].items.push(makeItem(text));
      p.updatedAt = nowIso(); tlInput.value = '';
      persist(); render();
    });
    if(tlInput) tlInput.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); if(tlAddBtn) tlAddBtn.click(); }
    });
    var tlSuggestBtn = document.getElementById('tl-suggest-btn');
    if(tlSuggestBtn) tlSuggestBtn.addEventListener('click', performTlSuggest);

    // Task list — fermer (bouton retour)
    var tlBackBtn = document.getElementById("tl-back-btn");
    if(tlBackBtn) tlBackBtn.addEventListener("click", function(){
      var tl = document.getElementById('tasklist-screen');
      if(tl){
        tl.classList.remove('open');
        setTimeout(function(){ taskListOpen = false; render(); }, 280);
      } else {
        taskListOpen = false; render();
      }
    });

    // Task list — filtre projet (emoji multi-select)
    document.querySelectorAll("[data-tl-proj-filter]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        var id = el.dataset.tlProjFilter;
        var idx = tlSelectedProjects.indexOf(id);
        if(idx >= 0) tlSelectedProjects.splice(idx, 1);
        else tlSelectedProjects.push(id);
        render();
        requestAnimationFrame(function(){
          var tl = document.getElementById('tasklist-screen');
          if(tl){ tl.style.transition='none'; tl.style.transform='translateX(0)'; }
        });
      });
    });

    // Task list — cocher une tâche (animation slide)
    document.querySelectorAll("[data-tl-toggle]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        tlCheckAndRefresh(el.dataset.tlProj, el.dataset.tlToggle);
      });
    });

    // Task list — clic sur une ligne → naviguer vers le projet
    document.querySelectorAll("[data-tl-nav-proj]").forEach(function(el){
      el.addEventListener("click", function(e){
        if(e.target.closest("[data-tl-toggle]") || e.target.closest("[data-tl-proj-filter]")) return;
        var tl = document.getElementById('tasklist-screen');
        if(tl){
          tl.style.transition = 'transform .2s ease-in';
          tl.style.transform = 'translateX(105%)';
          setTimeout(function(){
            taskListOpen = false;
            currentProjectId = el.dataset.tlNavProj;
            showAllItems = false;
            render();
          }, 200);
        }
      });
    });

    document.querySelectorAll("[data-toggle-item]").forEach(function(el){
      el.addEventListener("click", function(){
        var p = findProject(currentProjectId);
        if(!p) return;
        var found = findItemAnywhere(p, el.dataset.toggleItem);
        if(found){ found.item.done = !found.item.done; p.updatedAt = nowIso(); persist(); render(); }
      });
    });
    document.querySelectorAll("[data-remove-item]").forEach(function(el){
      el.addEventListener("click", function(){
        var p = findProject(currentProjectId);
        if(!p) return;
        var found = findItemAnywhere(p, el.dataset.removeItem);
        if(found){
          found.category.items = found.category.items.filter(function(x){ return x.id !== el.dataset.removeItem; });
          p.updatedAt = nowIso();
          persist(); render();
        }
      });
    });

    // Titre de tâche — édition inline (appui court)
    document.querySelectorAll("[data-item-title-input]").forEach(function(el){
      autoGrowTextarea(el);
      el.addEventListener("input", function(){ autoGrowTextarea(el); });
      el.addEventListener("keydown", function(e){
        if(e.key === "Enter"){ e.preventDefault(); el.blur(); }
        else if(e.key === "Escape"){ e.preventDefault(); editingItemId = null; render(); }
      });
      el.addEventListener("blur", function(){
        var itemId = el.dataset.itemTitleInput;
        var newTitle = el.value.trim();
        editingItemId = null;
        var p = findProject(currentProjectId);
        var found = p && findItemAnywhere(p, itemId);
        if(found && newTitle && newTitle !== found.item.title){
          found.item.title = newTitle;
          p.updatedAt = nowIso();
          persist();
        }
        render();
      });
    });

    // Tâches — clic = éditer le titre
    setupItemTap();

    // Barre fixe catégorie/tâches — ajouter item
    var dfbAddBtn = document.getElementById("dfb-add-btn");
    var dfbInput = document.getElementById("dfb-input");
    if(dfbAddBtn) dfbAddBtn.addEventListener("click", function(){
      if(!dfbInput) return;
      var title = dfbInput.value.trim();
      if(!title) return;
      var p = findProject(currentProjectId);
      var cat = p ? findCategory(p, dfbInput.dataset.dfbCat) : null;
      if(!p || !cat) return;
      cat.items.push(makeItem(title));
      p.updatedAt = nowIso();
      dfbInput.value = '';
      persist(); render();
    });
    if(dfbInput) dfbInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); if(dfbAddBtn) dfbAddBtn.click(); }
    });

    // Barre fixe catégorie/tâches — suggérer
    var dfbSuggestBtn = document.getElementById("dfb-suggest-btn");
    if(dfbSuggestBtn) dfbSuggestBtn.addEventListener("click", function(){
      var p = findProject(currentProjectId);
      var cat = p ? findCategory(p, dfbSuggestBtn.dataset.dfbCat) : null;
      if(p && cat) performSuggestForCategory(p, cat);
    });

    // Barre fixe projet — ajouter catégorie
    var dfbProjAddBtn = document.getElementById("dfb-proj-add-btn");
    var dfbProjInput = document.getElementById("dfb-proj-input");
    if(dfbProjAddBtn) dfbProjAddBtn.addEventListener("click", function(){
      if(!dfbProjInput) return;
      var title = dfbProjInput.value.trim();
      if(!title) return;
      var p = findProject(currentProjectId);
      if(!p) return;
      p.categories.push(makeCategory(title, []));
      p.updatedAt = nowIso();
      dfbProjInput.value = '';
      persist(); render();
    });
    if(dfbProjInput) dfbProjInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); if(dfbProjAddBtn) dfbProjAddBtn.click(); }
    });

    // Barre fixe projet — suggérer pour le projet
    var dfbProjSuggestBtn = document.getElementById("dfb-proj-suggest-btn");
    if(dfbProjSuggestBtn) dfbProjSuggestBtn.addEventListener("click", function(){
      var p = findProject(currentProjectId);
      if(p) performSuggestForProject(p);
    });

    var voirSuiteBtn = document.getElementById("voir-suite-btn");
    if(voirSuiteBtn) voirSuiteBtn.addEventListener("click", function(){ showAllItems = true; render(); });

    // Chat modal
    var chatIconBtn = document.getElementById("chat-icon-btn");
    if(chatIconBtn) chatIconBtn.addEventListener("click", function(){
      chatProjectOpen = true; render();
      setTimeout(function(){ var el = document.getElementById('chat-msgs-'+currentProjectId); if(el) el.scrollTop = el.scrollHeight; }, 50);
    });
    var chatCloseBtn = document.getElementById("chat-close-btn");
    if(chatCloseBtn) chatCloseBtn.addEventListener("click", function(){ chatProjectOpen = false; render(); });
    var chatModal = document.getElementById("chat-modal");
    if(chatModal) chatModal.addEventListener("click", function(e){ if(e.target === chatModal){ chatProjectOpen = false; render(); } });
    var chatSendBtn = document.getElementById("chat-send-btn");
    var chatInput = document.getElementById("chat-input");
    if(chatSendBtn) chatSendBtn.addEventListener("click", function(){
      if(!chatInput || !chatInput.value.trim()) return;
      var text = chatInput.value; chatInput.value = '';
      performChatSend(currentProjectId, text);
    });
    if(chatInput) chatInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); if(chatSendBtn) chatSendBtn.click(); }
      if(e.key === "Escape"){ chatProjectOpen = false; render(); }
    });
    document.querySelectorAll("[data-copy-idx]").forEach(function(el){
      el.addEventListener("click", function(){
        var cs = chatState[el.dataset.copyProj];
        var msg = cs && cs.messages[parseInt(el.dataset.copyIdx, 10)];
        if(!msg) return;
        navigator.clipboard.writeText(msg.text).then(function(){ showToast("Copié"); }).catch(function(){ showToast("Copie impossible"); });
      });
    });
    // Notes tâche — icône toggle
    document.querySelectorAll("[data-note-open]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.dataset.noteOpen;
        noteOpenId = (noteOpenId === id) ? null : id;
        render();
      });
    });
    // Notes tâche — suppression d'une note
    document.querySelectorAll("[data-delete-note]").forEach(function(el){
      el.addEventListener("click", function(){
        performDeleteNote(currentProjectId, el.dataset.deleteNoteTask, el.dataset.deleteNote);
      });
    });
    // Notes projet libres — titre (blur)
    document.querySelectorAll("[data-pn-title]").forEach(function(el){
      el.addEventListener("blur", function(){ performUpdateProjectNoteTitle(currentProjectId, el.dataset.pnTitle, el.value); });
    });
    // Notes projet libres — supprimer
    document.querySelectorAll("[data-pn-delete]").forEach(function(el){
      el.addEventListener("click", function(){ performDeleteProjectNote(currentProjectId, el.dataset.pnDelete); });
    });
    // Notes projet libres — toggle expand/collapse
    document.querySelectorAll("[data-pn-toggle]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.dataset.pnToggle;
        if(projectNoteEditId === id) return;
        projectNoteOpenId = (projectNoteOpenId === id) ? null : id;
        render();
      });
    });
    // Notes projet libres — ouvrir édition body (+ expand)
    document.querySelectorAll("[data-pn-edit-open]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.dataset.pnEditOpen;
        projectNoteEditId = id;
        projectNoteOpenId = id;
        render();
        setTimeout(function(){
          var ta = document.querySelector('[data-pn-edit-ta="'+id+'"]');
          if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
        }, 30);
      });
    });
    // Notes projet libres — valider édition body
    document.querySelectorAll("[data-pn-edit-ok]").forEach(function(el){
      el.addEventListener("click", function(){
        var ta = document.querySelector('[data-pn-edit-ta="'+el.dataset.pnEditOk+'"]');
        if(ta) performEditProjectNoteBody(currentProjectId, el.dataset.pnEditOk, ta.value);
      });
    });
    // Notes projet libres — annuler édition (garde la note ouverte)
    document.querySelectorAll("[data-pn-edit-cancel]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.dataset.pnEditCancelId || projectNoteEditId;
        projectNoteEditId = null;
        projectNoteOpenId = id;
        render();
      });
    });
    // Notes projet libres — déplacer (select)
    document.querySelectorAll("[data-pn-move]").forEach(function(el){
      el.addEventListener("change", function(){ performMoveProjectNote(currentProjectId, el.dataset.pnMove, el.value||null); });
    });
    // Note tâche — ouvrir modal (nouvelle note)
    document.querySelectorAll("[data-note-modal-add]").forEach(function(el){
      el.addEventListener("click", function(){
        noteModal = {taskId: el.dataset.noteModalAdd, noteId: null, text: ''};
        render();
        focusNoteModalTextarea();
      });
    });
    // Note tâche — ouvrir modal (édition)
    document.querySelectorAll("[data-note-modal-edit]").forEach(function(el){
      el.addEventListener("click", function(){
        var taskId = el.dataset.noteModalTask, noteId = el.dataset.noteModalEdit;
        var found = findItemAnywhere(findProject(currentProjectId), taskId);
        var note = found && (found.item.notes||[]).filter(function(n){ return n.id===noteId; })[0];
        noteModal = {taskId: taskId, noteId: noteId, text: note ? note.text : ''};
        render();
        focusNoteModalTextarea();
      });
    });
    // Note tâche modal — fermer sans sauvegarder
    if(noteModal){
      var noteModalCloseBtn = document.getElementById("note-modal-close-btn");
      if(noteModalCloseBtn) noteModalCloseBtn.addEventListener("click", function(){ noteModal = null; render(); });
      var noteModalEl = document.getElementById("note-edit-modal");
      if(noteModalEl) noteModalEl.addEventListener("click", function(e){ if(e.target === noteModalEl){ noteModal = null; render(); } });
      var noteModalSaveBtn = document.getElementById("note-modal-save-btn");
      if(noteModalSaveBtn) noteModalSaveBtn.addEventListener("click", function(){
        var ta = document.getElementById("note-modal-textarea");
        var text = ta ? ta.value : '';
        if(!text.trim()){ noteModal = null; render(); return; }
        var taskId = noteModal.taskId, noteId = noteModal.noteId;
        noteModal = null;
        if(noteId) performEditNote(currentProjectId, taskId, noteId, text);
        else performAddNote(currentProjectId, taskId, text);
      });
    }
    // Chat — save as note
    document.querySelectorAll("[data-save-note-idx]").forEach(function(el){
      el.addEventListener("click", function(){
        var cs = chatState[el.dataset.saveNoteProj];
        var msg = cs && cs.messages[parseInt(el.dataset.saveNoteIdx, 10)];
        if(!msg) return;
        performSaveChatAsNote(el.dataset.saveNoteProj, msg.text);
      });
    });
    // Chat home — icône
    var chatHomeIconBtn = document.getElementById("chat-home-icon-btn");
    if(chatHomeIconBtn) chatHomeIconBtn.addEventListener("click", function(){
      chatHomeOpen = true; render();
      setTimeout(function(){ var el = document.getElementById('chat-msgs-home'); if(el) el.scrollTop = el.scrollHeight; }, 50);
    });
    // Chat home — close
    var chatHomeCloseBtn = document.getElementById("chat-home-close-btn");
    if(chatHomeCloseBtn) chatHomeCloseBtn.addEventListener("click", function(){ chatHomeOpen = false; render(); });
    var chatModalHome = document.getElementById("chat-modal-home");
    if(chatModalHome) chatModalHome.addEventListener("click", function(e){ if(e.target === chatModalHome){ chatHomeOpen = false; render(); } });
    // Chat home — send
    var chatHomeSendBtn = document.getElementById("chat-home-send-btn");
    var chatHomeInput = document.getElementById("chat-home-input");
    if(chatHomeSendBtn) chatHomeSendBtn.addEventListener("click", function(){
      if(!chatHomeInput || !chatHomeInput.value.trim()) return;
      var text = chatHomeInput.value; chatHomeInput.value = '';
      performHomeChatSend(text);
    });
    if(chatHomeInput) chatHomeInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); if(chatHomeSendBtn) chatHomeSendBtn.click(); }
      if(e.key === "Escape"){ chatHomeOpen = false; render(); }
    });
    // Auto-scroll chat si modal ouvert
    setTimeout(function(){
      var el = document.getElementById('chat-msgs-'+currentProjectId);
      if(el) el.scrollTop = el.scrollHeight;
      var el2 = document.getElementById('chat-msgs-home');
      if(el2) el2.scrollTop = el2.scrollHeight;
    }, 20);

  }

  var resizeTimer = null;
  window.addEventListener("resize", function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ if(!currentProjectId) layoutHomeTreemap(); }, 150);
  });

  /* ---------- swipe detection (home ↔ task list) ---------- */
  // capture:true = reçoit l'événement avant les enfants (tiles, scrolls, etc.)
  // touchmove lock = distingue swipe H vs V avant le touchend
  var swipeStartX = null, swipeStartY = null, swipeLocked = null;
  window.addEventListener('touchstart', function(e){
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    swipeLocked = null;
  }, {passive: true, capture: true});
  window.addEventListener('touchmove', function(e){
    if(swipeStartX === null || swipeLocked) return;
    var mdx = Math.abs(e.touches[0].clientX - swipeStartX);
    var mdy = Math.abs(e.touches[0].clientY - swipeStartY);
    if(mdx > 8 || mdy > 8) swipeLocked = mdx >= mdy ? 'h' : 'v';
  }, {passive: true, capture: true});
  window.addEventListener('touchend', function(e){
    if(swipeStartX === null) return;
    var dx = e.changedTouches[0].clientX - swipeStartX;
    var locked = swipeLocked;
    swipeStartX = null; swipeStartY = null; swipeLocked = null;
    if(locked !== 'h') return; // swipe vertical ou ambigu → ignorer
    if(!currentProjectId && !taskListOpen && dx < -80 && state.projects.length > 0){
      taskListOpen = true;
      render();
      requestAnimationFrame(function(){
        var tl = document.getElementById('tasklist-screen');
        if(tl) tl.classList.add('open');
      });
    } else if(!currentProjectId && taskListOpen && dx > 80){
      var tl = document.getElementById('tasklist-screen');
      if(tl){
        tl.classList.remove('open');
        setTimeout(function(){ taskListOpen = false; render(); }, 280);
      }
    }
  }, {passive: true, capture: true});

  /* ---------- séquence de démarrage ---------- */

  // Enchaînement : config Supabase → jetons OAuth éventuels dans l'URL →
  // session existante → données. Tant que ce n'est pas résolu on affiche
  // un écran neutre, pour ne jamais faire clignoter le formulaire de
  // connexion devant un utilisateur déjà authentifié.
  function bootAfterAuth(){
    authBusy = false; authError = ""; authInfo = "";
    render();
    load();
    // Rafraîchit le profil en arrière-plan : après un OAuth, le fragment
    // d'URL ne contient pas l'email, seulement les jetons.
    if(!session || !session.user){
      fetchCurrentUser().then(function(user){
        if(user && session){ session.user = user; saveSession(session); render(); }
      });
    }
  }

  function boot(){
    document.getElementById("app").innerHTML =
      '<div class="auth-boot"><div class="loading-spinner"></div></div>';

    fetch("/api/config")
      .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error("config")); })
      .then(function(cfg){
        supa.url = cfg.supabaseUrl;
        supa.anon = cfg.supabaseAnonKey;
        if(cfg.providers) supa.providers = cfg.providers;
        authReady = true;

        var fromOAuth = consumeOAuthRedirect();
        if(fromOAuth === "recovery"){ renderAuth(); return; } // écran "nouveau mot de passe"
        if(!fromOAuth) session = loadSession();

        if(!session){ renderAuth(); return; }

        // Session en mémoire : on la valide avant d'afficher quoi que ce soit.
        return ensureToken().then(function(token){
          if(!token){ saveSession(null); renderAuth(); return; }
          bootAfterAuth();
        });
      })
      .catch(function(){
        document.getElementById("app").innerHTML =
          '<div class="auth-screen"><div class="auth-box">'+
            '<div class="auth-logo">🗂️</div>'+
            '<div class="auth-title">Service indisponible</div>'+
            '<div class="auth-sub">La configuration du serveur n\'a pas pu être chargée. '+
            'Vérifie ta connexion et recharge la page.</div>'+
            '<button class="auth-submit" onclick="location.reload()" style="margin-top:20px;">Recharger</button>'+
          '</div></div>';
      });
  }

  boot();
})();
</script>
