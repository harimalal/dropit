<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dropit — Toutes tes idées. Un plan. Des résultats.</title>
<script>
  // Un visiteur déjà connecté (session valide en localStorage) passe direct
  // à l'app plutôt que de revoir la page marketing à chaque visite.
  (function(){
    try {
      var raw = localStorage.getItem("dropit-session");
      if(!raw) return;
      var s = JSON.parse(raw);
      if(s && s.access_token && Date.now() < s.expires_at){
        window.location.replace("app.html");
      }
    } catch(e){}
  })();
</script>
<style>
  :root{
    --canvas:#F8F8F9; --ink:#2B2420; --ink-soft:#7A7168; --line:#EFEBE6;
    --accent:#BF5B44; --cta:#9CECCB; --cta-hover:#7FE0B5;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:var(--font);background:#fff;color:var(--ink);
    height:100vh;height:100svh;position:relative;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- Carrousel plein écran ---------- */
  .carousel-viewport{position:absolute;inset:0;overflow:hidden;background:#fff;}
  .carousel-track{display:flex;height:100%;transition:transform .45s cubic-bezier(.25,.9,.35,1);touch-action:pan-y;}
  .slide{flex:0 0 100%;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .slide img{width:100%;height:100%;object-fit:contain;object-position:top center;display:block;}

  /* ---------- Nav flèches ---------- */
  .nav-arrow{
    position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 6px 16px rgba(43,36,32,.16);
    display:flex;align-items:center;justify-content:center;color:var(--ink);z-index:5;
  }
  .nav-arrow:disabled{opacity:0;pointer-events:none;}
  .nav-arrow.prev{left:10px;}
  .nav-arrow.next{right:10px;}
  .nav-arrow .icon{width:15px;height:15px;}

  /* ---------- Overlay CTA (par-dessus l'image, en bas) ---------- */
  .cta-overlay{
    position:absolute;left:0;right:0;bottom:0;z-index:6;
    padding:40px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(248,248,249,0) 0%, rgba(248,248,249,.85) 45%, var(--canvas) 75%);
    display:flex;flex-direction:column;align-items:center;gap:8px;
    transition:padding-top .2s ease;
  }
  /* Le 1er visuel a son propre bouton "Télécharger" intégré à l'image :
     l'overlay doit le recouvrir entièrement, pas juste l'atténuer. */
  .cta-overlay.cover-badge{
    padding-top:126px;
    background:linear-gradient(180deg, rgba(248,248,249,0) 0%, var(--canvas) 26%, var(--canvas) 100%);
  }
  .dots{display:flex;justify-content:center;gap:7px;margin-bottom:2px;}
  .dot{width:6px;height:6px;border-radius:50%;background:rgba(43,36,32,.22);border:none;padding:0;transition:width .25s ease, background .25s ease;}
  .dot.active{width:18px;border-radius:4px;background:var(--accent);}
  .cta-btn{
    display:block;width:100%;max-width:340px;border:none;border-radius:14px;
    padding:14px 28px;font-size:15px;font-weight:800;background:var(--cta);color:var(--ink);cursor:pointer;
    box-shadow:0 12px 26px rgba(43,36,32,.2);transition:transform .15s ease, background .15s ease;
    text-decoration:none;text-align:center;
  }
  .cta-btn:hover{background:var(--cta-hover);transform:translateY(-2px);}
  .cta-secondary{font-size:13px;font-weight:700;color:var(--ink-soft);text-decoration:underline;padding:4px;}

  /* ---------- Boutons de téléchargement app (Android dispo, Apple à venir) ---------- */
  .dl-row{display:flex;gap:10px;width:100%;max-width:340px;margin-top:2px;}
  .dl-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:12px;padding:11px 10px;font-size:13px;font-weight:800;
    text-decoration:none;white-space:nowrap;transition:transform .15s ease, background .15s ease;
  }
  .dl-btn .dl-icon{width:16px;height:16px;flex-shrink:0;}
  .dl-btn.android{background:#161616;color:#fff;box-shadow:0 10px 22px rgba(43,36,32,.22);}
  .dl-btn.android:hover{background:#000;transform:translateY(-2px);}
  .dl-btn.apple{background:var(--line);color:var(--ink-faint,#A79E93);cursor:default;pointer-events:none;}
</style>
</head>
<body>

<div class="carousel-viewport">
  <button class="nav-arrow prev" id="prev-btn" aria-label="Précédent">
    <svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="nav-arrow next" id="next-btn" aria-label="Suivant">
    <svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M8 4l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="carousel-track" id="track">
    <div class="slide"><img src="landing-assets/slide-1-cover-full.jpg" alt="Toutes tes idées, tes envies, tes projets prennent vie ici"></div>
    <div class="slide"><img src="landing-assets/slide-2-hero.jpg" alt="Toutes tes idées. Un plan. Des résultats."></div>
    <div class="slide"><img src="landing-assets/slide-3-dropzone.jpg" alt="Drop Zone — ton espace de décharge mentale en 1 clic"></div>
    <div class="slide"><img src="landing-assets/slide-4-projet.jpg" alt="Des projets concrets et bien structurés"></div>
    <div class="slide"><img src="landing-assets/slide-5-priorites.jpg" alt="Des priorités claires qui te font avancer"></div>
    <div class="slide"><img src="landing-assets/slide-6-aujourdhui.jpg" alt="Une journée claire et une vision d'ensemble"></div>
    <div class="slide"><img src="landing-assets/slide-7-chat.jpg" alt="Chat IA"></div>
  </div>

  <div class="cta-overlay" id="cta-overlay">
    <div class="dots" id="dots"></div>
    <a class="cta-btn" href="app.html">Essayer Drop●It</a>
    <a class="cta-secondary" href="app.html">Se connecter</a>
    <div class="dl-row">
      <!-- Passe par notre propre page plutôt que le lien GitHub direct : un
           clic vers github.com faisait clignoter la page (sombre) de GitHub
           le temps de la redirection vers le stockage — pas rassurant. Cette
           page reste sur notre domaine et déclenche le téléchargement dans
           un iframe caché, avec notre propre barre de progression. -->
      <a class="dl-btn android" href="telechargement-android.html">
        <svg class="dl-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.6 9.48l1.84-3.18a.5.5 0 10-.87-.5l-1.86 3.22a9.44 9.44 0 00-7.42 0L7.43 5.8a.5.5 0 10-.87.5L8.4 9.48A8.9 8.9 0 004 17h16a8.9 8.9 0 00-2.4-7.52zM9 14a1 1 0 110-2 1 1 0 010 2zm6 0a1 1 0 110-2 1 1 0 010 2z"/>
        </svg>
        Android
      </a>
      <span class="dl-btn apple" aria-disabled="true">
        <svg class="dl-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16.365 1.43c0 1.14-.44 2.06-1.31 2.78-.87.72-1.9 1.1-2.96 1.02-.02-1.1.44-2.08 1.28-2.8.85-.75 1.94-1.16 2.99-1zM20.5 17.2c-.5 1.16-1.1 2.28-1.9 3.35-1.05 1.4-2.15 2.8-3.85 2.83-1.65.03-2.2-.98-4.1-.98-1.9 0-2.5.95-4.05.99-1.7.04-3-1.5-4.05-2.9C.5 17.6-.6 12.7 1.65 9.35c1.1-1.65 3-2.7 5.05-2.73 1.65-.03 3.2 1.1 4.2 1.1s2.7-1.36 4.55-1.16c.8.03 3.05.32 4.5 2.45-1.2.7-2.75 2.35-2.9 4.85-.2 2.75 2.4 3.7 2.45 3.35z"/>
        </svg>
        Apple (bientôt)
      </span>
    </div>
  </div>
</div>

<script>
  var track = document.getElementById('track');
  var slides = track.children;
  var dotsWrap = document.getElementById('dots');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var ctaOverlay = document.getElementById('cta-overlay');
  var index = 0;
  var total = slides.length;

  for(var i=0; i<total; i++){
    var d = document.createElement('button');
    d.className = 'dot' + (i===0 ? ' active' : '');
    d.addEventListener('click', (function(idx){ return function(){ goTo(idx); }; })(i));
    dotsWrap.appendChild(d);
  }
  var dots = dotsWrap.children;

  function update(){
    track.style.transform = 'translateX(-' + (index*100) + '%)';
    for(var i=0; i<dots.length; i++) dots[i].classList.toggle('active', i===index);
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === total-1;
    ctaOverlay.classList.toggle('cover-badge', index === 0);
  }
  function goTo(i){ index = Math.max(0, Math.min(total-1, i)); update(); }

  prevBtn.addEventListener('click', function(){ goTo(index-1); });
  nextBtn.addEventListener('click', function(){ goTo(index+1); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight') goTo(index+1);
    if(e.key === 'ArrowLeft') goTo(index-1);
  });

  // Swipe tactile
  var startX = null, startY = null, dragging = false;
  track.addEventListener('touchstart', function(e){
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; dragging = true;
  }, {passive:true});
  track.addEventListener('touchmove', function(e){
    if(!dragging) return;
    var dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
    if(Math.abs(dx) > Math.abs(dy)) e.preventDefault();
  }, {passive:false});
  track.addEventListener('touchend', function(e){
    if(!dragging) return;
    dragging = false;
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0) goTo(index+1); else goTo(index-1);
    }
  });

  update();
</script>

</body>
</html>
