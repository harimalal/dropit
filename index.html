<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dropit</title>
<style>
  :root{
    /* Neutres — fond neutre très clair (v13, analyse directe de l'image de référence : ni blanc pur, ni beige) */
    --canvas:#F8F8F9;
    --canvas-card:#FFFFFF;
    --ink:#2B2420;
    --ink-soft:#7A7168;
    --ink-faint:#A79E93;
    --line:#EFEBE6;
    --grid-line:rgba(43,36,32,0.035);

    /* Chrome — boutons génériques, top bars, écrans auth (inchangé) */
    --accent:#BF5B44;
    --accent-soft:#F3E2DC;

    /* Chrome IA — barres de saisie IA uniquement (accueil, catégorie/tâches/projet, task list) */
    --ia-accent:#3F8A5C;
    --ia-accent-soft:#E3EFE6;

    /* Statut — porte l'anneau du treemap, indépendant de la couleur de projet */
    --status-actif:#3F8A5C;
    --status-actif-soft:#E3EFE6;
    --status-ralentit:#C48A2E;
    --status-ralentit-soft:#F5EBD8;
    --status-pause:#A79E93;
    --status-pause-soft:#EFEAE3;
    --status-accompli:#BF5B44;
    --status-accompli-soft:#F3E2DC;

    /* Projet — 8 teintes, une base par teinte → voile 15% (carte, recalibré v13 sur la référence) + voile 28% (badge plat) + solide (checkbox) */
    --proj-terracotta-card:#FAE8E4; --proj-terracotta-badge:#F5D4CD; --proj-terracotta-solid:#D25C41;
    --proj-corail-card:#FAE4E9;     --proj-corail-badge:#F5CDD7;     --proj-corail-solid:#D24165;
    --proj-ambre-card:#FAF1E4;      --proj-ambre-badge:#F5E4CD;      --proj-ambre-solid:#C6872F;
    --proj-emeraude-card:#E4FAF1;   --proj-emeraude-badge:#CDF5E4;   --proj-emeraude-solid:#27A571;
    --proj-sarcelle-card:#E4FAFA;   --proj-sarcelle-badge:#CDF5F5;   --proj-sarcelle-solid:#26A1A1;
    --proj-azur-card:#E4F1FA;       --proj-azur-badge:#CDE4F5;       --proj-azur-solid:#4196D2;
    --proj-indigo-card:#E6E4FA;     --proj-indigo-badge:#D0CDF5;     --proj-indigo-solid:#4D41D2;
    --proj-mure-card:#F4E4FA;       --proj-mure-badge:#EBCDF5;       --proj-mure-solid:#AE41D2;

    /* Badge "effet verre" — voile translucide (alpha 0.55) + reflet en dégradé, SANS backdrop-filter
       (le flou d'arrière-plan produisait un halo gris-beige aux coins arrondis — bug de rendu connu) */
    --proj-terracotta-glass:rgba(221,102,75,0.55); --proj-corail-glass:rgba(221,75,111,0.55); --proj-ambre-glass:rgba(221,160,75,0.55);
    --proj-emeraude-glass:rgba(75,221,160,0.55);   --proj-sarcelle-glass:rgba(75,221,221,0.55); --proj-azur-glass:rgba(75,160,221,0.55);
    --proj-indigo-glass:rgba(87,75,221,0.55);      --proj-mure-glass:rgba(184,75,221,0.55);

    /* Anneau du treemap — 65% (moins "pur" que le solide 100% du tour précédent, reste net) */
    --proj-terracotta-ring:#E99C8A; --proj-corail-ring:#E98AA1; --proj-ambre-ring:#E9C18A;
    --proj-emeraude-ring:#8AE9C1;   --proj-sarcelle-ring:#8AE9E9; --proj-azur-ring:#8AC1E9;
    --proj-indigo-ring:#928AE9;     --proj-mure-ring:#D18AE9;

    /* Voile carte de CATÉGORIE spécifiquement — 6% (recalibré, était trop pâle à 1.5%) */
    --proj-terracotta-card-faint:#FDF6F4; --proj-corail-card-faint:#FDF4F6; --proj-ambre-card-faint:#FDF9F4;
    --proj-emeraude-card-faint:#F4FDF9;   --proj-sarcelle-card-faint:#F4FDFD; --proj-azur-card-faint:#F4F9FD;
    --proj-indigo-card-faint:#F5F4FD;     --proj-mure-card-faint:#FBF4FD;

    /* Voile TÂCHES PRIORITAIRES — 10% (encore 50% plus léger que le 20% précédent) */
    --proj-terracotta-priority:#FCF0ED; --proj-corail-priority:#FCEDF1; --proj-ambre-priority:#FCF6ED;
    --proj-emeraude-priority:#EDFCF6;   --proj-sarcelle-priority:#EDFCFC; --proj-azur-priority:#EDF6FC;
    --proj-indigo-priority:#EEEDFC;     --proj-mure-priority:#F8EDFC;

    /* Voile PROCHAINE ACTION — 14% (encore 50% plus léger que le 28% du badge, réutilisé jusqu'ici) */
    --proj-terracotta-next:#FAEAE6; --proj-corail-next:#FAE6EB; --proj-ambre-next:#FAF2E6;
    --proj-emeraude-next:#E6FAF2;   --proj-sarcelle-next:#E6FAFA; --proj-azur-next:#E6F2FA;
    --proj-indigo-next:#E7E6FA;     --proj-mure-next:#F5E6FA;

    /* Voile bouton "C'est fait" — 50% (texte passe en --ink, le blanc n'y tient plus le contraste) */
    --proj-terracotta-btn:#E8AEA0; --proj-corail-btn:#E8A0B2; --proj-ambre-btn:#E2C397;
    --proj-emeraude-btn:#93D2B8;   --proj-sarcelle-btn:#92D0D0; --proj-azur-btn:#A0CAE8;
    --proj-indigo-btn:#A6A0E8;     --proj-mure-btn:#D6A0E8;

    /* Rayons */
    --radius:12px;
    --radius-lg:18px;
    --radius-sm:10px;

    /* Relief léger (v5) */
    --shadow-card:0 2px 10px rgba(43,36,32,.07);

    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:var(--font-display);color:var(--ink);background-color:var(--canvas);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:26px 26px;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .btn{
    border:1px solid var(--line);background:var(--canvas-card);border-radius:10px;padding:9px 15px;
    font-size:13.5px;font-weight:600;color:var(--ink);transition:background .12s ease, border-color .12s ease;
  }
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#A34936;}
  .btn-ghost{border-color:transparent;background:transparent;padding:9px 10px;}
  .btn-ghost:hover{background:var(--accent-soft);}
  .btn-danger{color:#9C4632;}

  /* HOME TREEMAP — design system v5 */
  .home-container{position:fixed;inset:0;background:var(--canvas);overflow:hidden;display:flex;flex-direction:column;}
  .home-greeting{
    flex-shrink:0;padding:calc(16px + env(safe-area-inset-top)) 20px 8px;
    font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--ink);
  }
  #home-treemap-zone{flex:1;position:relative;min-height:0;overflow:hidden;}
  .home-treemap-inner{position:relative;width:100%;}
  .tile{
    position:absolute;border-radius:var(--radius-lg);padding:2.5px;box-sizing:border-box;
    /* anneau conic-gradient conservé : encode statut (couleur) ET progression (longueur d'arc) —
       fonctionnalité existante, seul son épaisseur diminue (padding 4px->2.5px, plus fin, moins "diagramme") */
    background:conic-gradient(var(--ring-color,var(--line)) calc(var(--pct,0)*1%), var(--line) 0);
  }
  @media (prefers-reduced-motion:no-preference){.tile{transition:filter .12s ease;}}
  .tile:hover{filter:brightness(0.98);}
  .tile-body{
    height:100%;width:100%;border-radius:16px;background:var(--tile-card-bg,var(--canvas-card));
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    overflow:hidden;padding:14px;box-shadow:var(--shadow-card);
  }
  .tile-emoji{
    line-height:1;width:44px;height:44px;border-radius:var(--radius-sm);font-size:31px;
    /* Effet verre fiable : voile translucide + reflet en dégradé, sans backdrop-filter
       (le flou produisait un halo gris-beige aux coins arrondis — bug de rendu écarté) */
    background:
      linear-gradient(135deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 40%, rgba(255,255,255,0) 65%),
      var(--tile-badge-glass,var(--accent-soft));
    border:none;box-shadow:none;overflow:hidden;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .tile-title{font-weight:700;letter-spacing:-0.01em;line-height:1.25;color:var(--ink);margin-top:8px;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
    width:100%;word-break:break-word;overflow-wrap:break-word;}
  .tile-meta{margin-top:8px;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);font-weight:600;}
  .tile.size-tiny .tile-body{padding:8px;}
  .tile.size-tiny .tile-emoji{width:32px;height:32px;font-size:22px;}
  .tile.size-tiny .tile-title{-webkit-line-clamp:1;margin-top:5px;font-size:12px;}
  .tile.size-tiny .tile-meta{display:none;}

  .empty-state{
    position:absolute;inset:24px;border:1px dashed var(--line);border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:6px;
    color:var(--ink-soft);font-size:14px;background:var(--canvas);padding:20px;
  }
  .empty-state b{color:var(--ink);}

  /* TOP BAR (project detail) */
  .top-bar{position:fixed;top:12px;left:12px;right:12px;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .top-back-btn{
    width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--canvas-card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 6px 16px rgba(43,36,32,0.14);
  }
  .top-back-btn:hover{border-color:var(--accent);color:var(--accent);}
  .top-back-btn .icon{width:14px;height:14px;}
  .top-delete-btn{
    width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--canvas-card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);box-shadow:0 6px 16px rgba(43,36,32,0.14);
  }
  .top-delete-btn:hover{border-color:#9C4632;color:#9C4632;}
  .top-delete-btn .icon{width:14px;height:14px;}

  /* PROJECT DETAIL */
  .detail-scroll{position:fixed;inset:0;background:var(--canvas);overflow-y:auto;}
  .detail-inner{max-width:600px;margin:0 auto;padding:50px 20px 140px;}
  .detail-header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin-bottom:12px;}
  .detail-emoji{font-size:32px;line-height:1;}
  .detail-title{font-size:19px;font-weight:800;letter-spacing:-0.01em;}
  .detail-summary{font-size:13px;color:var(--ink-soft);max-width:440px;line-height:1.4;}
  .detail-status-row{display:flex;align-items:center;gap:8px;margin-top:2px;}
  .status-dot{width:8px;height:8px;border-radius:50%;}
  .status-dot.actif{background:var(--status-actif);}
  .status-dot.ralentit{background:var(--status-ralentit);}
  .status-dot.pause{background:var(--status-pause);}
  .status-dot.accompli{background:var(--status-accompli);}
  .detail-status-text{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);letter-spacing:0.03em;}

  .progress-track{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 14px;}
  .progress-fill{height:100%;border-radius:4px;background:var(--current-proj-solid, var(--accent));}
  @media (prefers-reduced-motion:no-preference){.progress-fill{transition:width .3s ease;}}

  /* Composants colorés par l'identité du projet (--current-proj-*, posé sur .detail-scroll) — design system v5 */
  .next-action-card{
    background:var(--current-proj-next, var(--accent-soft));border:none;border-radius:var(--radius-lg);padding:16px;
    display:flex;flex-direction:column;gap:8px;margin-bottom:14px;box-shadow:var(--shadow-card);
  }
  .next-action-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--current-proj-solid, var(--accent));font-weight:700;}
  .next-action-title{font-size:17px;font-weight:700;color:var(--ink);line-height:1.35;}
  .next-action-row{display:flex;gap:10px;}
  .next-action-row .btn-primary{
    flex:1;background:var(--current-proj-btn, var(--accent));border-color:var(--current-proj-btn, var(--accent));
    color:var(--ink);
  }

  .accompli-banner{
    background:var(--current-proj-solid, var(--accent));color:#fff;border-radius:var(--radius-lg);padding:22px;text-align:center;margin-bottom:24px;
  }
  .accompli-banner .big{font-size:19px;font-weight:800;margin-bottom:6px;}
  .accompli-banner .stats{font-family:var(--font-mono);font-size:11.5px;opacity:.9;}

  .section-label{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--ink-faint);margin:20px 0 10px;
  }
  .category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .category-card{
    background:var(--current-proj-card-faint, var(--canvas-card));border:none;border-radius:var(--radius-lg);padding:14px;
    display:flex;flex-direction:column;gap:8px;text-align:left;box-shadow:var(--shadow-card);
  }
  .category-card-title{font-size:14px;font-weight:700;color:var(--ink);
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
  .category-progress-track{height:4px;border-radius:3px;background:rgba(43,36,32,.08);overflow:hidden;}
  .category-progress-fill{height:100%;border-radius:3px;background:var(--current-proj-solid, var(--accent));}
  .category-card-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);}
  .category-card.done{opacity:.6;}
  .add-category-link{
    display:inline-block;margin-top:10px;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
    background:none;border:none;padding:4px 0;
  }
  .add-category-link:hover{color:var(--accent);}

  .step-row{
    display:flex;align-items:center;gap:10px;background:var(--canvas-card);border:1px solid var(--line);
    border-radius:var(--radius);padding:11px 12px;margin-bottom:8px;
  }
  .step-check{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.6px solid var(--ink-faint);background:transparent;
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .step-check.checked{background:var(--current-proj-solid, var(--status-actif));border-color:var(--current-proj-solid, var(--status-actif));}
  .step-check .icon{width:12px;height:12px;}
  .step-title{flex:1;font-size:14px;color:var(--ink);min-width:0;}
  .step-row.done .step-title{color:var(--ink-faint);}
  .step-row.priority{background:var(--current-proj-priority, var(--accent-soft));border-color:transparent;}
  .step-row.priority .step-title{font-weight:600;}
  .step-title-input{
    flex:1;border:1px solid var(--current-proj-solid, var(--accent));border-radius:7px;padding:6px 8px;font-size:14px;
    color:var(--ink);background:var(--canvas-card);min-width:0;font-family:inherit;
    line-height:1.35;resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word;
  }
  .step-title-input:focus{outline:none;}
  /* PRIORITÉS (page projet) */
  .priority-block{margin-bottom:12px;}
  .priority-block-label{
    font-family:var(--font-mono);font-size:10px;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--current-proj-solid, var(--accent));font-weight:700;margin-bottom:8px;
  }
  .priority-block-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--current-proj-priority, var(--accent-soft));border:none;border-radius:10px;
    padding:9px 12px;margin-bottom:6px;font-size:13.5px;color:var(--ink);
  }
  .priority-block-title{min-width:0;}
  .priority-block-cat{font-size:11px;color:var(--current-proj-solid, var(--accent));flex-shrink:0;}
  .step-remove{border:none;background:none;color:var(--ink-faint);font-size:16px;line-height:1;padding:2px 4px;flex-shrink:0;}
  .step-remove:hover{color:#9C4632;}

  .add-step-row{display:flex;gap:8px;margin-top:6px;}
  .add-step-row input{
    flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;
    background:var(--canvas-card);color:var(--ink);min-width:0;
  }

  .suggest-more-btn{width:100%;margin-top:16px;}

  /* COMPOSE BAR — barre IA (accueil), accent vert dédié + sparkle dans le champ (design system v5) */
  .compose-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:42;
    background:var(--canvas-card);border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:8px;box-shadow:0 -4px 16px rgba(43,36,32,0.08);
  }
  .compose-input-wrap{
    flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;
    padding:0 15px;background:var(--canvas);min-width:0;
  }
  .compose-input-wrap .sparkle-prefix{font-size:14px;flex-shrink:0;line-height:1;}
  .compose-text-input{
    flex:1;border:none;outline:none;padding:10px 0;font-size:14px;
    background:transparent;color:var(--ink);min-width:0;
  }
  .compose-send-btn{
    flex-shrink:0;width:38px;height:38px;border-radius:50%;border:none;background:var(--ia-accent);color:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px var(--ia-accent-soft);
  }
  .compose-send-btn:hover{background:#357A50;}
  .compose-send-btn:disabled{opacity:.45;box-shadow:none;}
  .compose-send-btn .icon{width:16px;height:16px;}

  .loading-overlay{
    position:fixed;inset:0;background:rgba(43,36,32,0.5);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .loading-card{
    background:var(--canvas-card);border-radius:16px;padding:24px 28px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:10px;max-width:280px;
  }
  .loading-spinner{
    width:26px;height:26px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);
  }
  @media (prefers-reduced-motion:no-preference){.loading-spinner{animation:spin 0.8s linear infinite;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{font-size:13.5px;color:var(--ink-soft);}

  .toast{
    position:fixed;left:50%;bottom:78px;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;
    box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:55;opacity:0;pointer-events:none;
  }
  @media (prefers-reduced-motion:no-preference){.toast{transition:opacity .25s ease;}}
  .toast.show{opacity:1;}

  .reset-link{
    position:fixed;left:16px;bottom:74px;z-index:40;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);
    background:var(--canvas-card);border:1px solid var(--line);border-radius:14px;padding:7px 13px;
    box-shadow:0 6px 16px rgba(43,36,32,0.1);
  }
  .reset-link:hover{color:var(--accent);border-color:var(--accent);}

  .icon{width:15px;height:15px;display:block;}

  /* NOTES PAR TÂCHE — icône + panel */
  .note-icon-btn{
    position:relative;border:none;background:none;padding:3px 5px;
    color:var(--ink-faint);flex-shrink:0;border-radius:6px;
  }
  .note-icon-btn:hover,.note-icon-btn.has-notes{color:var(--accent);}
  .note-icon-btn .icon{width:15px;height:15px;}
  .note-badge{
    position:absolute;top:-3px;right:-2px;min-width:14px;height:14px;
    background:var(--accent);color:#fff;border-radius:7px;
    font-size:9px;font-weight:700;line-height:14px;text-align:center;padding:0 2px;
  }
  .note-panel{
    border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;
    background:var(--canvas);padding:10px 12px;margin-top:-2px;margin-bottom:8px;
  }
  .note-entry{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px;}
  .note-entry-text{flex:1;font-size:13px;color:var(--ink);line-height:1.4;white-space:pre-wrap;word-break:break-word;}
  .note-delete-btn{border:none;background:none;color:var(--ink-faint);font-size:14px;padding:0 3px;flex-shrink:0;line-height:1;}
  .note-delete-btn:hover{color:var(--accent);}
  .note-pencil-btn{border:none;background:none;color:var(--ink-faint);padding:0 3px;flex-shrink:0;line-height:1;}
  .note-pencil-btn:hover{color:var(--accent);}

<script>
(function(){
  "use strict";

  var DEVICE_ID_KEY = "dropit-device-id";
  var STATUS_LABELS = {actif:"Actif", ralentit:"Ralentit", pause:"En pause", accompli:"Accompli"};
  var showAllItems = false;

  function getOrCreateDeviceId(){
    var id = localStorage.getItem(DEVICE_ID_KEY);
    if(!id){
      id = "did-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10);
      localStorage.setItem(DEVICE_ID_KEY, id);
    }
    return id;
  }

  /* ================= AUTHENTIFICATION ================= */

  var SESSION_KEY = "dropit-session";
  var supa = {url:null, anon:null, providers:{google:true, apple:false}};
  var session = null;            // {access_token, refresh_token, expires_at, user}
  var authMode = "login";        // "login" | "signup" | "forgot"
  var authBusy = false;
  var authError = "";
  var authInfo = "";
  var authReady = false;         // config chargée + session résolue
  var accountSheetOpen = false;

  function loadSession(){
    try{
      var raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveSession(s){
    session = s;
    if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
    else localStorage.removeItem(SESSION_KEY);
  }
  function sessionFromTokenResponse(data){
    if(!data || !data.access_token) return null;
    return {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      // 60 s de marge pour ne jamais envoyer un jeton qui expire en vol
      expires_at: Date.now() + ((data.expires_in || 3600) - 60) * 1000,
      user: data.user || null
    };
  }

  function supaFetch(path, opts){
    opts = opts || {};
    return fetch(supa.url + path, {
      method: opts.method || "POST",
      headers: {"Content-Type":"application/json", "apikey": supa.anon},
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  }

  function refreshSession(){
    if(!session || !session.refresh_token) return Promise.resolve(null);
    return supaFetch("/auth/v1/token?grant_type=refresh_token", {
      body: {refresh_token: session.refresh_token}
    }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        var s = sessionFromTokenResponse(data);
        saveSession(s);
        return s;
      }).catch(function(){ return null; });
  }

  // Garantit un jeton valide avant chaque appel API.
  function ensureToken(){
    if(!session) return Promise.resolve(null);
    if(Date.now() < session.expires_at) return Promise.resolve(session.access_token);
    return refreshSession().then(function(s){ return s ? s.access_token : null; });
  }

  // Remplace fetch() pour tous les appels /api/* : injecte le jeton et
  // déconnecte proprement si le serveur répond 401.
  function apiFetch(url, opts){
    opts = opts || {};
    return ensureToken().then(function(token){
      if(!token) return Promise.reject(new Error("no-session"));
      var headers = {};
      var k;
      if(opts.headers) for(k in opts.headers) headers[k] = opts.headers[k];
      headers["Authorization"] = "Bearer " + token;
      var next = {headers: headers};
      for(k in opts) if(k !== "headers") next[k] = opts[k];
      return fetch(url, next);
    }).then(function(res){
      if(res.status === 401){ signOut(); return Promise.reject(new Error("unauthorized")); }
      return res;
    });
  }

  function authErrorMessage(data, status){
    var raw = (data && (data.error_description || data.msg || data.error || data.message)) || "";
    var s = String(raw).toLowerCase();
    if(s.indexOf("invalid login") >= 0 || s.indexOf("invalid credentials") >= 0)
      return "Email ou mot de passe incorrect.";
    if(s.indexOf("already registered") >= 0 || s.indexOf("already been registered") >= 0)
      return "Un compte existe déjà avec cet email. Connecte-toi.";
    if(s.indexOf("password") >= 0 && s.indexOf("6") >= 0)
      return "Le mot de passe doit faire au moins 6 caractères.";
    if(s.indexOf("email not confirmed") >= 0)
      return "Confirme ton email avant de te connecter — vérifie ta boîte de réception.";
    if(s.indexOf("rate limit") >= 0 || status === 429)
      return "Trop de tentatives. Réessaie dans une minute.";
    if(s.indexOf("unable to validate email") >= 0 || s.indexOf("invalid email") >= 0)
      return "Adresse email invalide.";
    return raw || "Une erreur est survenue. Réessaie.";
  }

  function performEmailAuth(email, password){
    if(authBusy) return;
    email = String(email||"").trim();
    if(!email || !password){
      authError = "Renseigne ton email et ton mot de passe."; renderAuth(); return;
    }
    if(authMode === "signup" && password.length < 6){
      authError = "Le mot de passe doit faire au moins 6 caractères."; renderAuth(); return;
    }
    authBusy = true; authError = ""; authInfo = ""; renderAuth();

    var path = authMode === "signup" ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password";
    supaFetch(path, {body: {email: email, password: password}})
      .then(function(res){
        return res.json().then(function(data){ return {ok: res.ok, status: res.status, data: data}; });
      })
      .then(function(r){
        authBusy = false;
        if(!r.ok){ authError = authErrorMessage(r.data, r.status); renderAuth(); return; }

        var s = sessionFromTokenResponse(r.data);
        if(!s){
          // Signup sans jeton : Supabase exige une confirmation par email.
          authMode = "login";
          authInfo = "Compte créé. Ouvre le lien de confirmation reçu par email, puis connecte-toi.";
          renderAuth();
          return;
        }
        saveSession(s);
        bootAfterAuth();
      })
      .catch(function(){
        authBusy = false;
        authError = "Connexion au serveur impossible. Vérifie ta connexion internet.";
        renderAuth();
      });
  }

  function performOAuth(provider){
    if(!supa.url) return;
    var redirect = window.location.origin + window.location.pathname;
    window.location.href = supa.url + "/auth/v1/authorize?provider=" + provider +
      "&redirect_to=" + encodeURIComponent(redirect);
  }

  function performPasswordReset(email){
    if(authBusy) return;
    email = String(email||"").trim();
    if(!email){ authError = "Renseigne ton email."; renderAuth(); return; }
    authBusy = true; authError = ""; authInfo = ""; renderAuth();
    supaFetch("/auth/v1/recover", {
      body: {email: email, redirect_to: window.location.origin + window.location.pathname}
    }).then(function(){
      authBusy = false; authMode = "login";
      authInfo = "Si un compte existe pour cet email, un lien de réinitialisation vient d'être envoyé.";
      renderAuth();
    }).catch(function(){
      authBusy = false; authError = "Envoi impossible. Réessaie."; renderAuth();
    });
  }

  function signOut(){
    var token = session && session.access_token;
    if(token && supa.url){
      fetch(supa.url + "/auth/v1/logout", {
        method: "POST",
        headers: {"apikey": supa.anon, "Authorization": "Bearer " + token}
      }).catch(function(){});
    }
    saveSession(null);
    state = {projects: []};
    currentProjectId = null; currentCategoryId = null;
    taskListOpen = false; accountSheetOpen = false;
    chatState = {}; tlSelectedProjects = [];
    authMode = "login"; authError = ""; authInfo = "";
    renderAuth();
  }

  var recoverySession = null; // session tirée du lien "mot de passe oublié", en attente du nouveau mot de passe

  // Récupère les jetons renvoyés dans le fragment d'URL (#access_token=...)
  // puis nettoie la barre d'adresse. Le lien de réinitialisation renvoie
  // type=recovery : dans ce cas il ne faut PAS connecter directement
  // l'utilisateur (bug précédent), mais lui faire choisir un nouveau mot
  // de passe avant d'entrer dans l'app.
  function consumeOAuthRedirect(){
    var hash = window.location.hash || "";
    if(hash.indexOf("access_token=") < 0){
      if(hash.indexOf("error=") >= 0){
        var ep = new URLSearchParams(hash.slice(1));
        authError = ep.get("error_description") || "Connexion annulée.";
        history.replaceState(null, "", window.location.pathname);
      }
      return false;
    }
    var params = new URLSearchParams(hash.slice(1));
    var isRecovery = params.get("type") === "recovery";
    var s = sessionFromTokenResponse({
      access_token: params.get("access_token"),
      refresh_token: params.get("refresh_token"),
      expires_in: parseInt(params.get("expires_in") || "3600", 10)
    });
    history.replaceState(null, "", window.location.pathname);
    if(!s) return false;
    if(isRecovery){
      recoverySession = s;
      authMode = "newpassword";
      return "recovery";
    }
    saveSession(s);
    return true;
  }

  function performSetNewPassword(newPassword){
    if(authBusy) return;
    if(!recoverySession){ authError = "Lien expiré. Redemande une réinitialisation."; renderAuth(); return; }
    if(!newPassword || newPassword.length < 6){
      authError = "Le mot de passe doit faire au moins 6 caractères."; renderAuth(); return;
    }
    authBusy = true; authError = ""; authInfo = ""; renderAuth();
    fetch(supa.url + "/auth/v1/user", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "apikey": supa.anon,
        "Authorization": "Bearer " + recoverySession.access_token
      },
      body: JSON.stringify({password: newPassword})
    }).then(function(res){
      return res.json().then(function(data){ return {ok: res.ok, status: res.status, data: data}; });
    }).then(function(r){
      authBusy = false;
      if(!r.ok){ authError = authErrorMessage(r.data, r.status); renderAuth(); return; }
      // Le jeton de récupération devient un jeton de session valide une fois
      // le mot de passe posé : pas besoin de forcer une reconnexion.
      saveSession(recoverySession);
      recoverySession = null;
      bootAfterAuth();
      showToast("Mot de passe mis à jour");
    }).catch(function(){
      authBusy = false;
      authError = "Connexion au serveur impossible. Réessaie.";
      renderAuth();
    });
  }

  function fetchCurrentUser(){
    return ensureToken().then(function(token){
      if(!token) return null;
      return fetch(supa.url + "/auth/v1/user", {
        headers: {"apikey": supa.anon, "Authorization": "Bearer " + token}
      }).then(function(r){ return r.ok ? r.json() : null; });
    }).catch(function(){ return null; });
  }

  /* ================= FIN AUTHENTIFICATION ================= */

  var state = {projects: []};
  var currentProjectId = null; // null = home
  var currentCategoryId = null; // set when viewing a single category's checklist
  var generating = false;
  var composeText = "";
  var chatState = {};
  var chatProjectOpen = false;
  var chatHomeOpen = false;
  var noteOpenId = null;
  var noteModal = null; // {taskId, noteId (null = nouvelle note), text}
  var editingItemId = null; // tâche en édition inline (appui court sur le titre)
  var projectNoteEditId = null;
  var projectNoteOpenId = null;
  var taskListOpen = false;
  var tlSelectedProjects = []; // [] = tous les projets
  var TL_COLORS = ['#BF5B44','#3F8A5C','#5B7DBF','#C48A2E','#8B5BBF','#5BBFB5','#BF8A5B'];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function nowIso(){ return new Date().toISOString(); }

  /* ---------- couleur de projet (design system v5) ----------
     Assignation déterministe : même id de projet = même couleur à chaque rendu,
     jamais aléatoire. Hash simple -> index 0-7 sur les 8 teintes du token set. */
  var PROJECT_COLOR_NAMES = ["terracotta","corail","ambre","emeraude","sarcelle","azur","indigo","mure"];
  function projectColorName(projectId){
    var s = String(projectId || "");
    var h = 0;
    for(var i=0; i<s.length; i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
    return PROJECT_COLOR_NAMES[h % PROJECT_COLOR_NAMES.length];
  }
  function projectColorVars(projectId){
    var name = projectColorName(projectId);
    return {
      card:      "var(--proj-"+name+"-card)",
      cardFaint: "var(--proj-"+name+"-card-faint)",
      badge:     "var(--proj-"+name+"-badge)",
      solid:     "var(--proj-"+name+"-solid)",
      priority:  "var(--proj-"+name+"-priority)",
      btn:       "var(--proj-"+name+"-btn)",
      next:      "var(--proj-"+name+"-next)",
      glass:     "var(--proj-"+name+"-glass)",
      ring:      "var(--proj-"+name+"-ring)"
    };
  }
  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function makeProject(overrides){
    var base = {
      id: uid(), title:"", emoji:"✨", summary:"", categories:[],
      projectNotes: [],
      createdAt: nowIso(), updatedAt: nowIso()
    };
    overrides = overrides || {};
    for(var k in overrides){ base[k] = overrides[k]; }
    return base;
  }
  function makeCategory(title, itemTitles){
    return {
      id: uid(), title: String(title||"").trim() || "À faire",
      items: (itemTitles||[]).map(makeItem).filter(function(it){return it.title;}),
      catNotes: [],
      createdAt: nowIso(), updatedAt: nowIso()
    };
  }
  function makeItem(title){
    return {id: uid(), title:String(title||"").trim(), done:false, createdAt: nowIso(), notes:[]};
  }
  function normalizeItem(raw){
    var notes;
    if(Array.isArray(raw.notes)){
      notes = raw.notes.map(function(n){ return {id:n.id||uid(), text:n.text||"", createdAt:n.createdAt||nowIso()}; });
    } else if(raw.note && String(raw.note).trim()){
      notes = [{id:uid(), text:String(raw.note).trim(), createdAt:raw.createdAt||nowIso()}];
    } else {
      notes = [];
    }
    return {
      id:raw.id||uid(), title:raw.title||"", done:!!raw.done, createdAt:raw.createdAt||nowIso(),
      notes: notes
    };
  }
  function normalizeCategory(raw){
    var catNotes = Array.isArray(raw.catNotes) ? raw.catNotes.map(function(n){
      return {id:n.id||uid(), title:n.title||"", createdAt:n.createdAt||nowIso()};
    }) : [];
    return {
      id: raw.id || uid(), title: raw.title || "À faire",
      items: (raw.items||[]).map(normalizeItem),
      catNotes: catNotes,
      createdAt: raw.createdAt || nowIso(), updatedAt: raw.updatedAt || nowIso()
    };
  }
  function normalizeProject(raw){
    var categories;
    if(Array.isArray(raw.categories)){
      categories = raw.categories.map(normalizeCategory);
    } else if(Array.isArray(raw.steps)){
      categories = [{
        id: uid(), title: "À faire",
        items: raw.steps.map(normalizeItem),
        catNotes: [],
        createdAt: raw.createdAt || nowIso(), updatedAt: raw.updatedAt || nowIso()
      }];
    } else {
      categories = [];
    }
    var projectNotes = Array.isArray(raw.projectNotes) ? raw.projectNotes.map(function(n){
      return {id:n.id||uid(), title:n.title||"", body:n.body||"", catId:n.catId||null, createdAt:n.createdAt||nowIso()};
    }) : [];
    if(!raw.projectNotes){
      categories.forEach(function(cat){
        if(cat.catNotes && cat.catNotes.length){
          cat.catNotes.forEach(function(n){
            projectNotes.push({id:n.id||uid(), title:n.title||"", body:"", catId:cat.id, createdAt:n.createdAt||nowIso()});
          });
        }
        cat.catNotes = [];
      });
    }
    return {
      id: raw.id || uid(),
      title: raw.title || "Projet",
      emoji: raw.emoji || "✨",
      summary: raw.summary || "",
      dna: raw.dna || "",
      categories: categories,
      projectNotes: projectNotes,
      createdAt: raw.createdAt || nowIso(),
      updatedAt: raw.updatedAt || nowIso()
    };
  }

  function allItems(p){
    var out = [];
    p.categories.forEach(function(cat){ cat.items.forEach(function(it){ out.push(it); }); });
    return out;
  }
  function progressPct(p){
    var items = allItems(p);
    if(!items.length) return 0;
    var done = items.filter(function(it){return it.done;}).length;
    return Math.round((done/items.length)*100);
  }
  function isAccompli(p){
    var items = allItems(p);
    return items.length>0 && items.every(function(it){return it.done;});
  }
  function activityStatus(p){
    if(isAccompli(p)) return "accompli";
    var days = (Date.now() - new Date(p.updatedAt).getTime()) / 86400000;
    if(days < 2) return "actif";
    if(days < 7) return "ralentit";
    return "pause";
  }
  function nextActionItem(p){
    for(var ci=0; ci<p.categories.length; ci++){
      var cat = p.categories[ci];
      for(var ii=0; ii<cat.items.length; ii++){
        if(!cat.items[ii].done) return {item:cat.items[ii], category:cat};
      }
    }
    return null;
  }
  function priorityItems(p){
    var result = [];
    for(var ci=0; ci<p.categories.length && result.length<3; ci++){
      var cat = p.categories[ci];
      for(var ii=0; ii<cat.items.length && result.length<3; ii++){
        if(!cat.items[ii].done) result.push({item:cat.items[ii], category:cat});
      }
    }
    return result;
  }
  function findItemAnywhere(p, itemId){
    for(var i=0;i<p.categories.length;i++){
      var cat = p.categories[i];
      for(var j=0;j<cat.items.length;j++){
        if(cat.items[j].id === itemId) return {category:cat, item:cat.items[j]};
      }
    }
    return null;
  }
  function findCategory(p, categoryId){
    return p.categories.filter(function(c){ return c.id === categoryId; })[0] || null;
  }
  function findProject(id){
    return state.projects.filter(function(p){ return p.id === id; })[0] || null;
  }

    });

  /* ---------- persistence ---------- */

  function load(){
    // device_id transmis uniquement pour la reprise des projets créés
    // avant l'authentification ; le serveur scope tout sur le compte.
    var deviceId = getOrCreateDeviceId();
    return apiFetch("/api/projects?device_id=" + encodeURIComponent(deviceId))
      .then(function(res){ return res.json(); })
      .then(function(json){
        var parsed = json.data || {};
        if(parsed.projects && parsed.projects.length > 0){
          state = {projects: parsed.projects.map(normalizeProject)};
        } else {
          state = defaultData();
          persist();
        }
        render();
        if(json.migrated) showToast("Tes projets ont été rattachés à ton compte");
      })
      .catch(function(err){
        if(err && err.message === "unauthorized") return; // signOut a déjà pris la main
        state = defaultData();
        render();
        showToast("Chargement impossible — données locales affichées");
      });
  }

  var saveTimer = null;
  function persist(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      apiFetch("/api/projects", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({state: state})
      }).catch(function(err){
        if(err && err.message === "unauthorized") return;
        showToast("Échec de l'enregistrement");
      });
    }, 350);
  }

  /* ---------- treemap math (squarify) ---------- */

  function squarify(items, x, y, w, h, result){
    if(items.length === 0) return;
    if(items.length === 1){ result.push({item:items[0], x:x, y:y, w:w, h:h}); return; }
    function worstRatio(rowValues, length){
      var sum=0, max=-Infinity, min=Infinity;
      rowValues.forEach(function(v){ sum+=v; if(v>max)max=v; if(v<min)min=v; });
      var sq=length*length, sumsq=sum*sum;
      return Math.max((sq*max)/sumsq, sumsq/(sq*min));
    }
    var vertical = w >= h;
    var length = vertical ? h : w;
    var row = [items[0]]; var i=1;
    while(i<items.length){
      var testRow = row.concat([items[i]]);
      var cw = worstRatio(row.map(function(r){return r.value;}), length);
      var tw = worstRatio(testRow.map(function(r){return r.value;}), length);
      if(tw <= cw){ row = testRow; i++; } else break;
    }
    var sum = row.reduce(function(a,b){return a+b.value;},0);
    var thickness = sum/length; var offset=0;
    row.forEach(function(it){
      var len = it.value/thickness;
      if(vertical){ result.push({item:it, x:x, y:y+offset, w:thickness, h:len}); }
      else { result.push({item:it, x:x+offset, y:y, w:len, h:thickness}); }
      offset += len;
    });
    var remaining = items.slice(row.length);
    if(remaining.length){
      if(vertical) squarify(remaining, x+thickness, y, w-thickness, h, result);
      else squarify(remaining, x, y+thickness, w, h-thickness, result);
    }
  }
  function computeTreemap(rawItems, W, H){
    var items = rawItems.slice().sort(function(a,b){return b.value-a.value;});
    var total = items.reduce(function(a,b){return a+b.value;},0) || 1;
    var scale = (W*H)/total;
    items.forEach(function(it){ it.value = it.value*scale; });
    var result = [];
    squarify(items, 0, 0, W, H, result);
    return result;
  }
  function sizeClassFor(w,h){
    var area = w*h;
    if(area < 8500 || w < 80 || h < 62) return "size-tiny";
    if(area < 20000) return "size-small";
    if(area < 42000) return "size-medium";
    return "size-large";
  }
  function titleFontSizeFor(w,h){
    var s = Math.sqrt(w*h);
    var fs = 11 + (s-70) * (22-11) / (547-70);
    return Math.round(Math.max(11, Math.min(22, fs)) * 10) / 10;
  }

  var TREEMAP_UNIT_AREA = 3400; // px² "naturels" par point de poids (tâches + catégories)
  var TREEMAP_MIN_HEIGHT = 130;

  function layoutHomeTreemap(){
    var zone = document.getElementById("home-treemap-zone");
    if(!zone || state.projects.length === 0) return;
    // La zone est flex:1 dans .home-container (flex column) : sa hauteur exclut déjà
    // automatiquement la salutation, pas besoin de la soustraire manuellement.
    var composeBar = document.getElementById("compose-bar");
    var composeBarClearance = (composeBar ? composeBar.offsetHeight : 60) + 12;
    var W = zone.clientWidth, viewportH = zone.clientHeight - composeBarClearance;
    if(W < 40 || viewportH < 40) return;

    var items = state.projects.map(function(p){
      return {id:p.id, project:p, value: Math.max(1, allItems(p).length + p.categories.length)};
    });
    var totalWeight = items.reduce(function(s,x){ return s + x.value; }, 0);
    var naturalHeight = (totalWeight * TREEMAP_UNIT_AREA) / W;
    var treemapH = Math.min(viewportH, Math.max(TREEMAP_MIN_HEIGHT, naturalHeight));

    var rects = computeTreemap(items, W, treemapH);

    var gutter = 3;

    var html = rects.map(function(r){
      var p = r.item.project;
      var x=r.x+gutter, y=r.y+gutter, w=Math.max(0,r.w-gutter*2), h=Math.max(0,r.h-gutter*2);
      var sizeClass = sizeClassFor(w,h);
      var titleFontSize = titleFontSizeFor(w,h);
      var pct = progressPct(p);
      var status = activityStatus(p);
      var showMeta = sizeClass !== "size-tiny";
      var pc = projectColorVars(p.id);
      return ''+
      '<div class="tile '+sizeClass+'" data-project-id="'+p.id+'" '+
        'style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;--pct:'+pct+';--ring-color:'+pc.ring+';'+
          '--tile-card-bg:'+pc.card+';--tile-badge-glass:'+pc.glass+';" '+
        'role="button" tabindex="0">'+
        '<div class="tile-body">'+
          '<div class="tile-emoji" style="font-size:'+(sizeClass==='size-tiny'?22:31)+'px;">'+p.emoji+'</div>'+
          '<div class="tile-title" style="font-size:'+titleFontSize+'px;">'+escapeHtml(p.title)+'</div>'+
          (showMeta ? '<div class="tile-meta">'+pct+'%</div>' : '')+
        '</div>'+
      '</div>';
    }).join("");
    zone.innerHTML = '<div class="home-treemap-inner" style="height:'+Math.ceil(treemapH)+'px;">'+html+'</div>';

    zone.querySelectorAll("[data-project-id]").forEach(function(el){
      el.addEventListener("click", function(){
        currentProjectId = el.dataset.projectId;
        showAllItems = false;
        render();
      });
      el.addEventListener("keydown", function(e){
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); el.click(); }
      });
    });
  }

  function buildFlatTasks(){
    var tasks = [];
    state.projects.forEach(function(p, pi){
      // filtre par projets sélectionnés
      if(tlSelectedProjects.length > 0 && tlSelectedProjects.indexOf(p.id) < 0) return;
      var undone = 0;
      p.categories.forEach(function(cat){
        cat.items.forEach(function(it){
          if(it.done || undone >= 3) return; // seulement top 3 non faites
          var pri = undone === 0 ? 'p1' : undone === 1 ? 'p2' : 'p3';
          undone++;
          tasks.push({item:it, project:p, category:cat, priority:pri, pi:pi});
        });
      });
    });
    return tasks;
  }

    var p = tlTargetProject();
    if(!p || !state.projects.length) return '';

  function performTlSuggest(){
    var p = tlTargetProject();
    if(!p || generating) return;
    var input = document.getElementById('tl-compose-input');
    var text = input ? input.value.trim() : '';
    var doneT  = allItems(p).filter(function(it){return it.done;}).map(function(it){return it.title;});
    var undoneT = allItems(p).filter(function(it){return !it.done;}).map(function(it){return it.title;});
    var ctx = 'Projet : '+p.title+(p.summary?' — '+p.summary:'')+
      '\nTâches faites : '+JSON.stringify(doneT)+
      '\nTâches restantes : '+JSON.stringify(undoneT);
    var prompt;
    if(!text){
      prompt = ctx+'\n\n'+
        'Propose 2 à 4 nouvelles tâches concrètes et courtes (5-10 mots) qui font LOGIQUEMENT avancer ce projet. '+
        'Déduis depuis ce qui est déjà fait et ce qui reste. Ne répète aucune tâche existante.\n'+
        'Réponds UNIQUEMENT avec un tableau JSON : ["tâche 1","tâche 2"]';
    } else {
      prompt = ctx+'\n\nTexte de l\'utilisateur : "'+text+'"\n\n'+
        'Transforme ce texte en 1 à 5 tâches concrètes et distinctes pour ce projet.\n'+
        'Règles strictes :\n'+
        '- Liste de choses → une tâche active par élément, reformulée\n'+
        '- Question → tâches qui y répondent concrètement\n'+
        '- Instructions ou étapes → une tâche par étape\n'+
        '- Ne jamais recopier mot pour mot ; formuler en verbe d\'action court\n'+
        'Réponds UNIQUEMENT avec un tableau JSON : ["tâche 1","tâche 2"]';
    }
    generating = true;
    if(input) input.disabled = true;
    var btn = document.getElementById('tl-suggest-btn');
    if(btn) btn.disabled = true;
    apiFetch("/api/ai",{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:400,messages:[{role:'user',content:[{type:'text',text:prompt}]}]})
    }).then(function(r){return r.json();}).then(function(data){
      generating = false;
      var out = (data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n');
      var items = JSON.parse(out.replace(/```json|```/g,'').trim());
      if(!Array.isArray(items)||!items.length) throw new Error();
      if(!p.categories.length) p.categories.push(makeCategory('À faire',[]));
      var cat = p.categories[0];
      items.slice(0,5).forEach(function(t){ if(t&&t.trim()) cat.items.push(makeItem(t.trim())); });
      p.updatedAt = nowIso();
      persist();
      if(input) input.value = '';
      render();
      showToast(items.length+' tâche'+(items.length>1?'s':'')+' ajoutée'+(items.length>1?'s':''));
    }).catch(function(){
      generating = false;
      if(input) input.disabled = false;
      var b2 = document.getElementById('tl-suggest-btn');
      if(b2) b2.disabled = false;
      showToast('Suggestion indisponible');
    });
  }

  function tlCheckAndRefresh(projId, itemId){
    var p = findProject(projId);
    if(!p) return;
    var found = findItemAnywhere(p, itemId);
    if(!found) return;
    found.item.done = true;
    p.updatedAt = nowIso();
    persist();
    // Animation : slide droite → re-render → slide gauche
    var tl = document.getElementById('tasklist-screen');
    if(!tl){ render(); return; }
    tl.style.transition = 'transform .17s ease-in';
    tl.style.transform = 'translateX(105%)';
    setTimeout(function(){
      render();
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          var tl2 = document.getElementById('tasklist-screen');
          if(!tl2) return;
          tl2.style.transition = 'none';
          tl2.style.transform = 'translateX(105%)';
          requestAnimationFrame(function(){
            tl2.style.transition = 'transform .22s ease-out';
            tl2.style.transform = 'translateX(0)';
          });
        });
      });
    }, 170);
  }

  function parseAiText(text){
    return String(text||'').split('\n').map(function(line){
      if(!line.trim()) return '<div style="height:5px"></div>';
      var safe = escapeHtml(line);
      safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if(/^### /.test(line)) return '<div class="ai-h3">'+safe.slice(4)+'</div>';
      if(/^## /.test(line))  return '<div class="ai-h2">'+safe.slice(3)+'</div>';
      if(/^# /.test(line))   return '<div class="ai-h1">'+safe.slice(2)+'</div>';
      if(/^[-•] /.test(line)) return '<div class="ai-li"><span class="ai-bullet">·</span><span>'+safe.slice(2)+'</span></div>';
      return '<div class="ai-p">'+safe+'</div>';
    }).join('');
  }

  /* ---------- AI generation ---------- */

  function generateProject(intention){
    var promptText = ""+
      "Tu es le moteur d'un produit qui transforme une intention en projet concret et actionnable.\n\n"+
      "Intention de l'utilisateur : \"" + intention + "\"\n\n"+
      "Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour, sans balises markdown, exactement sous cette forme :\n"+
      '{"title":"titre court (3-5 mots)","emoji":"un seul emoji représentatif","summary":"une phrase naturelle qui résume ce qu\'il y a à faire",'+
      '"categories":[{"title":"nom de la catégorie","items":["élément 1","élément 2","..."]}]}'+
      "\n\nRegroupe les actions par aspect logique et distinct du projet (par exemple pour un déménagement : achats & aménagement, administratif, organisation, budget — "+
      "mais adapte entièrement les catégories au type de projet réel, un voyage ou un anniversaire n'auront pas du tout les mêmes). "+
      "Si le projet est simple et n'a qu'un seul aspect, une seule catégorie suffit. Génère entre 1 et 5 catégories pertinentes, chacune avec 3 à 7 éléments concrets et courts (5 à 10 mots).\n"+
      "Ordonne les catégories et leurs éléments dans l'ordre logique où ils doivent être traités : le tout premier élément de la première catégorie doit être la prochaine action la plus utile à faire maintenant.";

    return Promise.resolve().then(function(){
      return apiFetch("/api/ai", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 800,
          messages: [{role:"user", content:[{type:"text", text:promptText}]}]
        })
      });
    }).then(function(res){ return res.json(); }).then(function(data){
      var textOut = (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
      var clean = textOut.replace(/```json|```/g,"").trim();
      return JSON.parse(clean);
    });
  }

    var remainingTitles = cat.items.filter(function(it){return !it.done;}).map(function(it){return it.title;});
    var promptText = ""+
      "Projet : "+p.title+" — "+p.summary+"\n"+
      "Catégorie : "+cat.title+"\n"+
      "Éléments déjà faits dans cette catégorie : "+JSON.stringify(doneTitles)+"\n"+
      "Éléments restants dans cette catégorie : "+JSON.stringify(remainingTitles)+"\n\n"+
      "Propose 1 à 3 nouveaux éléments concrets et courts qui manquent dans CETTE catégorie spécifiquement, sans répéter ceux déjà listés.\n"+
      'Réponds UNIQUEMENT avec un tableau JSON de chaînes, sans texte autour, sans balises markdown : ["élément a","élément b"]';

    return Promise.resolve().then(function(){
      return apiFetch("/api/ai", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          model: "claude-haiku-4-5-20251001",
          max_tokens: 300,
          messages: [{role:"user", content:[{type:"text", text:promptText}]}]
        })
      });
    }).then(function(res){ return res.json(); }).then(function(data){
      var textOut = (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
      var clean = textOut.replace(/```json|```/g,"").trim();
      return JSON.parse(clean);
    });
  }

  function generateProjectSuggestion(p){
    var categoriesSummary = p.categories.map(function(cat){
      return {id:cat.id, title:cat.title, items: cat.items.map(function(it){ return {title:it.title, done:it.done}; })};
    });
    var promptText = ""+
      "Projet : "+p.title+" — "+p.summary+"\n"+
      "État actuel du projet, catégorie par catégorie (JSON) : "+JSON.stringify(categoriesSummary)+"\n\n"+
      "Propose la suite la plus utile pour faire avancer ce projet, en tenant vraiment compte de ce qui est déjà fait :\n"+
      "- Si une catégorie existante a encore des éléments non faits ou manque visiblement d'un élément important, tu peux ajouter 1 à 3 nouveaux éléments à CETTE catégorie.\n"+
      "- Si toutes les catégories existantes sont terminées ou presque, propose plutôt une NOUVELLE catégorie pertinente avec ses propres éléments.\n"+
      "- Ne propose jamais un élément qui recoupe une catégorie déjà entièrement terminée.\n\n"+
      "Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour, sans balises markdown, sous l'une de ces deux formes exactes :\n"+
      '{"type":"add_items","categoryId":"<id d\'une catégorie ci-dessus>","items":["élément 1","élément 2"]}\n'+
      '{"type":"new_category","category":{"title":"...","items":["élément 1","élément 2"]}}';

    return Promise.resolve().then(function(){
      return apiFetch("/api/ai", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          model: "claude-haiku-4-5-20251001",

          messages: [{role:"user", content:[{type:"text", text:promptText}]}]
        })
      });
    }).then(function(res){ return res.json(); }).then(function(data){
      var textOut = (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
      var clean = textOut.replace(/```json|```/g,"").trim();
      return JSON.parse(clean);
    });
  }


  function generateChatResponse(p, messages){
    var tasks = [];
    p.categories.forEach(function(cat){
      cat.items.forEach(function(it){
        var noteSummary = (it.notes&&it.notes.length) ? it.notes.map(function(n){return n.text;}).join(' / ') : '';
        tasks.push((p.categories.length > 1 ? cat.title+' / ' : '')+it.title+
          (noteSummary ? ' → '+noteSummary : '')+(it.done?' (fait)':''));
      });
    });
    var systemText = "Tu es l'assistant de ce projet. Utilise des titres (# ou ##), du gras (**mot**) "+
      "et des tirets (- item) quand c'est utile pour la lisibilité. Sois concis et opérationnel. "+
      "Pas d'introduction, pas de formule de politesse.\n\n"+
      "PROJET : \""+p.title+"\" — "+(p.dna||p.summary||"")+"\n"+
      "TÂCHES :\n"+tasks.join('\n');
    var hist = messages.slice(-20);
    while(hist.length && hist[0].role !== 'user') hist = hist.slice(1);
    var apiMessages = hist.map(function(m){
      return {role:m.role==='user'?'user':'assistant', content:[{type:"text",text:m.text}]};
    });
    return apiFetch("/api/ai",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001", max_tokens:600, system:systemText, messages:apiMessages})
    }).then(function(res){return res.json();}).then(function(data){
      return (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n").trim();
    });
  }

  function generateProjectDNA(p){
    var taskSummary = [];
    var hasNotes = false;
    p.categories.forEach(function(cat){
      cat.items.forEach(function(it){
        var noteTexts = (it.notes&&it.notes.length) ? it.notes.map(function(n){return n.text;}).join(' / ') : '';
        var line = (it.done?'✓ ':'• ')+it.title+(noteTexts?' → '+noteTexts:'');
        taskSummary.push(line);
        if(noteTexts) hasNotes = true;
      });
    });
    if(!hasNotes) return Promise.resolve(null);
    var promptText = "Projet : \""+p.title+"\"\nTâches :\n"+taskSummary.join('\n')+"\n\n"+
      "En une phrase directe (15 mots max), décris l'état actuel du projet et la prochaine priorité. "+
      "Commence par ce qui est concret. Exemple : \"Budget fixé à 500€, reste à confirmer la date et le lieu.\" "+
      "Réponds UNIQUEMENT avec la phrase, sans guillemets, sans intro.";
    return apiFetch("/api/ai",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001", max_tokens:60, messages:[{role:"user",content:[{type:"text",text:promptText}]}]})
    }).then(function(res){return res.json();}).then(function(data){
      var text = (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("").trim();
      return text || null;
    });
  }

  function performSaveChatAsNote(projectId, text){
    var p = findProject(projectId);
    if(!p || !text.trim()) return;
    if(!p.projectNotes) p.projectNotes = [];
    var catId = currentCategoryId || null;
    var firstLine = '';
    var lines = text.split('\n');
    for(var i=0; i<lines.length; i++){
      var l = lines[i].trim().replace(/^#+\s*/,'').replace(/\*\*/g,'').replace(/^[-•]\s*/,'');
      if(l){ firstLine = l; break; }
    }
    var title = firstLine.slice(0,65) + (firstLine.length>65 ? '…' : '');
    var newNote = {id:uid(), title:title, body:text.trim(), catId:catId, createdAt:nowIso()};
    p.projectNotes.push(newNote);
    projectNoteOpenId = newNote.id;
    p.updatedAt = nowIso();
    persist(); render();
    showToast("Note enregistrée");
  }

  function performCreateFromIntention(){
    var intention = composeText.trim();
    if(!intention || generating) return;
    generating = true;
    render();

    generateProject(intention).then(function(result){
      generating = false;
      var categories = (Array.isArray(result.categories) ? result.categories : [])
        .map(function(c){ return makeCategory(c.title, c.items); })
        .filter(function(c){ return c.items.length > 0; });
      if(categories.length === 0){
        categories = [makeCategory("À faire", ["Préciser les premières décisions","Identifier qui est impliqué"])];
      }
      var p = makeProject({
        title: (result.title || intention).slice(0,60),
        emoji: result.emoji || "✨",
        summary: result.summary || "",
        categories: categories
      });
      state.projects.push(p);
      composeText = "";
      currentProjectId = p.id;
      persist(); render();
    }).catch(function(){
      generating = false;
      var p = makeProject({
        title: intention.slice(0,60),
        emoji: "✨",
        summary: "Projet créé — complète les étapes ci-dessous.",
        categories: [makeCategory("À faire", ["Préciser les premières décisions","Identifier qui est impliqué","Définir une première échéance"])]
      });
      state.projects.push(p);
      composeText = "";
      currentProjectId = p.id;
      persist(); render();
      showToast("IA indisponible — projet créé avec des étapes de départ");
    });
  }

  function performSuggestForCategory(p, cat){
    generating = true;
    render();
    generateCategorySuggestion(p, cat).then(function(result){
      generating = false;
      var arr = Array.isArray(result) ? result : [];
      arr.slice(0,3).forEach(function(title){ if(title) cat.items.push(makeItem(title)); });
      cat.updatedAt = nowIso(); p.updatedAt = nowIso();
      persist(); render();
      showToast(arr.length ? "Nouveaux éléments ajoutés" : "Rien à ajouter pour l'instant");
    }).catch(function(){
      generating = false;
      showToast("Suggestion indisponible pour l'instant");
    });
  }

  function performSuggestForProject(p){
    generating = true;
    render();
    generateProjectSuggestion(p).then(function(result){
      generating = false;
      if(result && result.type === "add_items" && result.categoryId){
        var cat = findCategory(p, result.categoryId);
        var items = Array.isArray(result.items) ? result.items : [];
        if(cat){
          items.slice(0,3).forEach(function(title){ if(title) cat.items.push(makeItem(title)); });
          cat.updatedAt = nowIso();
        } else if(items.length){
          p.categories.push(makeCategory("Suite", items));
        }
      } else if(result && result.type === "new_category" && result.category){
        var newCat = makeCategory(result.category.title, result.category.items);
        if(newCat.items.length) p.categories.push(newCat);
      }
      p.updatedAt = nowIso();
      persist(); render();
      showToast("La suite du projet a été ajoutée");
    }).catch(function(){
      generating = false;
      showToast("Suggestion indisponible pour l'instant");
    });
  }
