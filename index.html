<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dropit</title>
<style>
  :root{
    --canvas:#FAF6F1;
    --canvas-card:#FFFDFB;
    --ink:#2B2420;
    --ink-soft:#7A7168;
    --ink-faint:#A79E93;
    --line:#E8DFD3;
    --grid-line:rgba(43,36,32,0.05);
    --accent:#BF5B44;
    --accent-soft:#F3E2DC;
    --status-actif:#3F8A5C;
    --status-actif-soft:#E3EFE6;
    --status-ralentit:#C48A2E;
    --status-ralentit-soft:#F5EBD8;
    --status-pause:#A79E93;
    --status-pause-soft:#EFEAE3;
    --status-accompli:#BF5B44;
    --status-accompli-soft:#F3E2DC;
    --radius:14px;
    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:var(--font-display);color:var(--ink);background-color:var(--canvas);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:26px 26px;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .btn{
    border:1px solid var(--line);background:var(--canvas-card);border-radius:10px;padding:9px 15px;
    font-size:13.5px;font-weight:600;color:var(--ink);transition:background .12s ease, border-color .12s ease;
  }
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#A34936;}
  .btn-ghost{border-color:transparent;background:transparent;padding:9px 10px;}
  .btn-ghost:hover{background:var(--accent-soft);}
  .btn-danger{color:#9C4632;}

  /* HOME TREEMAP */
  .home-container{position:fixed;inset:0;background:var(--line);overflow:hidden;}
  .tile{
    position:absolute;border-radius:16px;padding:4px;
    background:conic-gradient(var(--ring-color,var(--line)) calc(var(--pct,0)*1%), var(--line) 0);
  }
  @media (prefers-reduced-motion:no-preference){.tile{transition:filter .12s ease;}}
  .tile:hover{filter:brightness(0.98);}
  .tile-body{
    height:100%;width:100%;border-radius:12px;background:var(--canvas-card);
    display:flex;flex-direction:column;overflow:hidden;padding:14px;
  }
  .tile-emoji{line-height:1;}
  .tile-title{font-weight:800;letter-spacing:-0.01em;line-height:1.2;color:var(--ink);margin-top:6px;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
  .tile-meta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;
    font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);}
  .tile-status-word{font-weight:700;letter-spacing:0.04em;text-transform:uppercase;}
  .tile-status-word.actif{color:var(--status-actif);}
  .tile-status-word.ralentit{color:var(--status-ralentit);}
  .tile-status-word.pause{color:var(--status-pause);}
  .tile-status-word.accompli{color:var(--status-accompli);}
  .tile.size-tiny .tile-body{padding:8px;justify-content:center;align-items:center;text-align:center;}
  .tile.size-tiny .tile-title{-webkit-line-clamp:1;margin-top:2px;}
  .tile.size-tiny .tile-meta{display:none;}

  .empty-state{
    position:absolute;inset:24px;border:1px dashed var(--line);border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:6px;
    color:var(--ink-soft);font-size:14px;background:var(--canvas);padding:20px;
  }
  .empty-state b{color:var(--ink);}

  /* TOP BAR (project detail) */
  .top-bar{position:fixed;top:12px;left:12px;right:12px;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .top-back-btn{
    width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--canvas-card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 6px 16px rgba(43,36,32,0.14);
  }
  .top-back-btn:hover{border-color:var(--accent);color:var(--accent);}
  .top-back-btn .icon{width:14px;height:14px;}
  .top-delete-btn{
    width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--canvas-card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);box-shadow:0 6px 16px rgba(43,36,32,0.14);
  }
  .top-delete-btn:hover{border-color:#9C4632;color:#9C4632;}
  .top-delete-btn .icon{width:14px;height:14px;}

  /* PROJECT DETAIL */
  .detail-scroll{position:fixed;inset:0;background:var(--canvas);overflow-y:auto;}
  .detail-inner{max-width:600px;margin:0 auto;padding:64px 20px 140px;}
  .detail-header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:22px;}
  .detail-emoji{font-size:44px;line-height:1;}
  .detail-title{font-size:22px;font-weight:800;letter-spacing:-0.01em;}
  .detail-summary{font-size:13.5px;color:var(--ink-soft);max-width:440px;line-height:1.5;}
  .detail-status-row{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .status-dot{width:8px;height:8px;border-radius:50%;}
  .status-dot.actif{background:var(--status-actif);}
  .status-dot.ralentit{background:var(--status-ralentit);}
  .status-dot.pause{background:var(--status-pause);}
  .status-dot.accompli{background:var(--status-accompli);}
  .detail-status-text{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);letter-spacing:0.03em;}

  .progress-track{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin:14px 0 26px;}
  .progress-fill{height:100%;border-radius:4px;background:var(--accent);}
  @media (prefers-reduced-motion:no-preference){.progress-fill{transition:width .3s ease;}}

  .next-action-card{
    background:var(--accent-soft);border:1px solid var(--accent);border-radius:16px;padding:18px;
    display:flex;flex-direction:column;gap:12px;margin-bottom:24px;
  }
  .next-action-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent);font-weight:700;}
  .next-action-title{font-size:17px;font-weight:700;color:var(--ink);line-height:1.35;}
  .next-action-row{display:flex;gap:10px;}
  .next-action-row .btn-primary{flex:1;}

  .accompli-banner{
    background:var(--accent);color:#fff;border-radius:16px;padding:22px;text-align:center;margin-bottom:24px;
  }
  .accompli-banner .big{font-size:19px;font-weight:800;margin-bottom:6px;}
  .accompli-banner .stats{font-family:var(--font-mono);font-size:11.5px;opacity:.9;}

  .section-label{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--ink-faint);margin:20px 0 10px;
  }
  .category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .category-card{
    background:var(--canvas-card);border:1px solid var(--line);border-radius:14px;padding:14px;
    display:flex;flex-direction:column;gap:8px;text-align:left;
  }
  .category-card-title{font-size:14px;font-weight:700;color:var(--ink);
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
  .category-progress-track{height:4px;border-radius:3px;background:var(--line);overflow:hidden;}
  .category-progress-fill{height:100%;border-radius:3px;background:var(--accent);}
  .category-card-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);}
  .category-card.done{opacity:.6;}
  .add-category-link{
    display:inline-block;margin-top:10px;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
    background:none;border:none;padding:4px 0;
  }
  .add-category-link:hover{color:var(--accent);}

  .step-row{
    display:flex;align-items:center;gap:10px;background:var(--canvas-card);border:1px solid var(--line);
    border-radius:10px;padding:11px 12px;margin-bottom:8px;
  }
  .step-check{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.6px solid var(--ink-faint);background:transparent;
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .step-check.checked{background:var(--status-actif);border-color:var(--status-actif);}
  .step-check .icon{width:12px;height:12px;}
  .step-title{flex:1;font-size:14px;color:var(--ink);min-width:0;}
  .step-row.done .step-title{text-decoration:line-through;color:var(--ink-faint);}
  .step-remove{border:none;background:none;color:var(--ink-faint);font-size:16px;line-height:1;padding:2px 4px;flex-shrink:0;}
  .step-remove:hover{color:#9C4632;}

  .add-step-row{display:flex;gap:8px;margin-top:6px;}
  .add-step-row input{
    flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;
    background:var(--canvas-card);color:var(--ink);min-width:0;
  }

  .suggest-more-btn{width:100%;margin-top:16px;}

  /* COMPOSE BAR */
  .compose-bar{
    position:fixed;left:12px;right:12px;bottom:14px;z-index:42;
    background:var(--canvas-card);border:1px solid var(--line);border-radius:20px;
    padding:8px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px rgba(43,36,32,0.18);
  }
  .compose-text-input{
    flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 15px;font-size:14px;
    background:var(--canvas);color:var(--ink);min-width:0;
  }
  .compose-send-btn{
    flex-shrink:0;width:38px;height:38px;border-radius:50%;border:none;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .compose-send-btn:hover{background:#A34936;}
  .compose-send-btn:disabled{opacity:.45;}
  .compose-send-btn .icon{width:16px;height:16px;}

  .loading-overlay{
    position:fixed;inset:0;background:rgba(43,36,32,0.5);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .loading-card{
    background:var(--canvas-card);border-radius:16px;padding:24px 28px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:10px;max-width:280px;
  }
  .loading-spinner{
    width:26px;height:26px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);
  }
  @media (prefers-reduced-motion:no-preference){.loading-spinner{animation:spin 0.8s linear infinite;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{font-size:13.5px;color:var(--ink-soft);}

  .toast{
    position:fixed;left:50%;bottom:78px;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;
    box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:55;opacity:0;pointer-events:none;
  }
  @media (prefers-reduced-motion:no-preference){.toast{transition:opacity .25s ease;}}
  .toast.show{opacity:1;}

  .reset-link{
    position:fixed;left:16px;bottom:74px;z-index:40;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);
    background:var(--canvas-card);border:1px solid var(--line);border-radius:14px;padding:7px 13px;
    box-shadow:0 6px 16px rgba(43,36,32,0.1);
  }
  .reset-link:hover{color:var(--accent);border-color:var(--accent);}

  .icon{width:15px;height:15px;display:block;}

  /* RESEARCH PANEL */
  .research-icon-btn{
    border:none;background:none;padding:3px 6px;color:var(--ink-faint);
    font-size:13px;line-height:1;flex-shrink:0;border-radius:6px;
  }
  .research-icon-btn:hover{background:var(--accent-soft);color:var(--accent);}
  .research-icon-btn.active{color:var(--accent);}
  .research-panel{
    border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;
    background:var(--canvas);padding:12px 14px;margin-top:-2px;margin-bottom:8px;
  }
  .research-label{
    font-family:var(--font-mono);font-size:10px;letter-spacing:0.05em;
    text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
  }
  .research-loading{font-size:13px;color:var(--ink-faint);display:flex;align-items:center;gap:8px;}
  .research-option{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px;cursor:pointer;}
  .research-option input[type=checkbox]{flex-shrink:0;margin-top:3px;accent-color:var(--accent);width:14px;height:14px;}
  .research-option-text{font-size:13.5px;color:var(--ink);line-height:1.4;}

  /* VOIR LA SUITE */
  .voir-suite-link{
    display:inline-block;margin:4px 0 10px;font-family:var(--font-mono);font-size:11px;
    color:var(--ink-faint);background:none;border:none;padding:0;
  }
  .voir-suite-link:hover{color:var(--accent);}

  /* RECLASSER */
  .reclassify-btn{width:100%;margin-top:8px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var DEVICE_ID_KEY = "dropit-device-id";
  var STATUS_LABELS = {actif:"Actif", ralentit:"Ralentit", pause:"En pause", accompli:"Accompli"};
  var showAllItems = false;

  function getOrCreateDeviceId(){
    var id = localStorage.getItem(DEVICE_ID_KEY);
    if(!id){
      id = "did-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10);
      localStorage.setItem(DEVICE_ID_KEY, id);
    }
    return id;
  }

  var state = {projects: []};
  var currentProjectId = null; // null = home
  var currentCategoryId = null; // set when viewing a single category's checklist
  var generating = false;
  var composeText = "";

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function nowIso(){ return new Date().toISOString(); }
  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function makeProject(overrides){
    var base = {
      id: uid(), title:"", emoji:"✨", summary:"", categories:[],
      createdAt: nowIso(), updatedAt: nowIso()
    };
    overrides = overrides || {};
    for(var k in overrides){ base[k] = overrides[k]; }
    return base;
  }
  function makeCategory(title, itemTitles){
    return {
      id: uid(), title: String(title||"").trim() || "À faire",
      items: (itemTitles||[]).map(makeItem).filter(function(it){return it.title;}),
      createdAt: nowIso(), updatedAt: nowIso()
    };
  }
  function makeItem(title){
    return {id: uid(), title:String(title||"").trim(), done:false, createdAt: nowIso()};
  }
  function normalizeItem(raw){
    return {
      id:raw.id||uid(), title:raw.title||"", done:!!raw.done, createdAt:raw.createdAt||nowIso(),
      research: raw.research || null
    };
  }
  function normalizeCategory(raw){
    return {
      id: raw.id || uid(), title: raw.title || "À faire",
      items: (raw.items||[]).map(normalizeItem),
      createdAt: raw.createdAt || nowIso(), updatedAt: raw.updatedAt || nowIso()
    };
  }
  function normalizeProject(raw){
    var categories;
    if(Array.isArray(raw.categories)){
      categories = raw.categories.map(normalizeCategory);
    } else if(Array.isArray(raw.steps)){
      // migration from the flat v0 shape: wrap old steps into a single category
      categories = [{
        id: uid(), title: "À faire",
        items: raw.steps.map(normalizeItem),
        createdAt: raw.createdAt || nowIso(), updatedAt: raw.updatedAt || nowIso()
      }];
    } else {
      categories = [];
    }
    return {
      id: raw.id || uid(),
      title: raw.title || "Projet",
      emoji: raw.emoji || "✨",
      summary: raw.summary || "",
      categories: categories,
      createdAt: raw.createdAt || nowIso(),
      updatedAt: raw.updatedAt || nowIso()
    };
  }

  function allItems(p){
    var out = [];
    p.categories.forEach(function(cat){ cat.items.forEach(function(it){ out.push(it); }); });
    return out;
  }
  function progressPct(p){
    var items = allItems(p);
    if(!items.length) return 0;
    var done = items.filter(function(it){return it.done;}).length;
    return Math.round((done/items.length)*100);
  }
  function isAccompli(p){
    var items = allItems(p);
    return items.length>0 && items.every(function(it){return it.done;});
  }
  function activityStatus(p){
    if(isAccompli(p)) return "accompli";
    var days = (Date.now() - new Date(p.updatedAt).getTime()) / 86400000;
    if(days < 2) return "actif";
    if(days < 7) return "ralentit";
    return "pause";
  }
  function nextActionItem(p){
    for(var ci=0; ci<p.categories.length; ci++){
      var cat = p.categories[ci];
      for(var ii=0; ii<cat.items.length; ii++){
        if(!cat.items[ii].done) return {item:cat.items[ii], category:cat};
      }
    }
    return null;
  }
  function findItemAnywhere(p, itemId){
    for(var i=0;i<p.categories.length;i++){
      var cat = p.categories[i];
      for(var j=0;j<cat.items.length;j++){
        if(cat.items[j].id === itemId) return {category:cat, item:cat.items[j]};
      }
    }
    return null;
  }
  function findCategory(p, categoryId){
    return p.categories.filter(function(c){ return c.id === categoryId; })[0] || null;
  }
  function findProject(id){
    return state.projects.filter(function(p){ return p.id === id; })[0] || null;
  }

  /* ---------- default sample data ---------- */

  function defaultData(){
    var bali = makeProject({
      title:"Bali cet été", emoji:"🌴",
      summary:"Vous avez commencé à organiser le voyage — reste l'hébergement et le budget.",
      categories:[
        makeCategory("Dates & transport", ["Choisir les dates de départ","Réserver les billets d'avion"]),
        makeCategory("Sur place", ["Trouver un hébergement","Lister les activités sur place"]),
        makeCategory("Budget", ["Définir le budget global"])
      ]
    });
    bali.categories[0].items.forEach(function(it){ it.done = true; });
    bali.updatedAt = nowIso();

    var julie = makeProject({
      title:"Anniversaire de Julie", emoji:"🎂",
      summary:"Presque prêt — reste le gâteau et la décoration.",
      categories:[
        makeCategory("Organisation", ["Fixer la date et le lieu","Faire la liste des invités","Envoyer les invitations"]),
        makeCategory("Préparatifs", ["Commander le gâteau","Prévoir la décoration"])
      ]
    });
    julie.categories[0].items.forEach(function(it){ it.done = true; });
    var d1 = new Date(); d1.setDate(d1.getDate()-6);
    julie.updatedAt = d1.toISOString();

    var demenagement = makeProject({
      title:"Déménagement", emoji:"📦",
      summary:"Les achats sont faits — reste l'administratif et l'organisation.",
      categories:[
        makeCategory("Achats & aménagement", ["Acheter un canapé","Acheter une table et des chaises","Acheter de la vaisselle","Commander des cartons"]),
        makeCategory("Administratif", ["Changer d'adresse","Résilier les anciens contrats (eau, électricité)","Souscrire les nouveaux contrats","Prévenir l'employeur et les organismes"]),
        makeCategory("Organisation", ["Réserver un camion de déménagement","Demander de l'aide pour le jour J","Planifier l'emballage des cartons"]),
        makeCategory("Budget", ["Estimer le coût total du déménagement"])
      ]
    });
    demenagement.categories[0].items.forEach(function(it){ it.done = true; });
    var d2 = new Date(); d2.setDate(d2.getDate()-1);
    demenagement.updatedAt = d2.toISOString();

    return {projects: [bali, julie, demenagement]};
  }

  /* ---------- persistence ---------- */

  function load(){
    var deviceId = getOrCreateDeviceId();
    fetch("/api/projects?device_id=" + encodeURIComponent(deviceId))
      .then(function(res){ return res.json(); })
      .then(function(json){
        var parsed = json.data || {};
        if(parsed.projects && parsed.projects.length > 0){
          state = {projects: parsed.projects.map(normalizeProject)};
        } else {
          state = defaultData();
          persist();
        }
        render();
      })
      .catch(function(){ state = defaultData(); render(); });
  }

  var saveTimer = null;
  function persist(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      var deviceId = getOrCreateDeviceId();
      fetch("/api/projects", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({device_id: deviceId, state: state})
      }).catch(function(){ showToast("Échec de l'enregistrement"); });
    }, 350);
  }

  /* ---------- treemap math (squarify) ---------- */

  function squarify(items, x, y, w, h, result){
    if(items.length === 0) return;
    if(items.length === 1){ result.push({item:items[0], x:x, y:y, w:w, h:h}); return; }
    function worstRatio(rowValues, length){
      var sum=0, max=-Infinity, min=Infinity;
      rowValues.forEach(function(v){ sum+=v; if(v>max)max=v; if(v<min)min=v; });
      var sq=length*length, sumsq=sum*sum;
      return Math.max((sq*max)/sumsq, sumsq/(sq*min));
    }
    var vertical = w >= h;
    var length = vertical ? h : w;
    var row = [items[0]]; var i=1;
    while(i<items.length){
      var testRow = row.concat([items[i]]);
      var cw = worstRatio(row.map(function(r){return r.value;}), length);
      var tw = worstRatio(testRow.map(function(r){return r.value;}), length);
      if(tw <= cw){ row = testRow; i++; } else break;
    }
    var sum = row.reduce(function(a,b){return a+b.value;},0);
    var thickness = sum/length; var offset=0;
    row.forEach(function(it){
      var len = it.value/thickness;
      if(vertical){ result.push({item:it, x:x, y:y+offset, w:thickness, h:len}); }
      else { result.push({item:it, x:x+offset, y:y, w:len, h:thickness}); }
      offset += len;
    });
    var remaining = items.slice(row.length);
    if(remaining.length){
      if(vertical) squarify(remaining, x+thickness, y, w-thickness, h, result);
      else squarify(remaining, x, y+thickness, w, h-thickness, result);
    }
  }
  function computeTreemap(rawItems, W, H){
    var items = rawItems.slice().sort(function(a,b){return b.value-a.value;});
    var total = items.reduce(function(a,b){return a+b.value;},0) || 1;
    var scale = (W*H)/total;
    items.forEach(function(it){ it.value = it.value*scale; });
    var result = [];
    squarify(items, 0, 0, W, H, result);
    return result;
  }
  function sizeClassFor(w,h){
    var area = w*h;
    if(area < 8500 || w < 80 || h < 62) return "size-tiny";
    if(area < 20000) return "size-small";
    if(area < 42000) return "size-medium";
    return "size-large";
  }
  function titleFontSizeFor(w,h){
    var s = Math.sqrt(w*h);
    var fs = 11 + (s-70) * (22-11) / (547-70);
    return Math.round(Math.max(11, Math.min(22, fs)) * 10) / 10;
  }

  function layoutHomeTreemap(){
    var container = document.getElementById("home-container");
    if(!container || state.projects.length === 0) return;
    var width = container.clientWidth, height = container.clientHeight;
    if(width < 40 || height < 40) return;

    var items = state.projects.map(function(p){
      return {id:p.id, project:p, value: Math.max(1, allItems(p).length)};
    });
    var rects = computeTreemap(items, width, height);
    var gutter = 3;

    var html = rects.map(function(r){
      var p = r.item.project;
      var x=r.x+gutter, y=r.y+gutter, w=Math.max(0,r.w-gutter*2), h=Math.max(0,r.h-gutter*2);
      var sizeClass = sizeClassFor(w,h);
      var titleFontSize = titleFontSizeFor(w,h);
      var pct = progressPct(p);
      var status = activityStatus(p);
      var showMeta = sizeClass !== "size-tiny";
      var items2 = allItems(p);
      var doneCount = items2.filter(function(it){return it.done;}).length;
      return ''+
      '<div class="tile '+sizeClass+'" data-project-id="'+p.id+'" '+
        'style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;--pct:'+pct+';--ring-color:var(--status-'+status+');" '+
        'role="button" tabindex="0">'+
        '<div class="tile-body">'+
          '<div class="tile-emoji" style="font-size:'+Math.max(16,titleFontSize*1.3)+'px;">'+p.emoji+'</div>'+
          '<div class="tile-title" style="font-size:'+titleFontSize+'px;">'+escapeHtml(p.title)+'</div>'+
          (showMeta ? '<div class="tile-meta">'+
            '<span class="tile-status-word '+status+'">'+STATUS_LABELS[status]+'</span>'+
            '<span>'+pct+'% · '+doneCount+'/'+items2.length+'</span>'+
          '</div>' : '')+
        '</div>'+
      '</div>';
    }).join("");
    container.innerHTML = html;

    container.querySelectorAll("[data-project-id]").forEach(function(el){
      el.addEventListener("click", function(){
        currentProjectId = el.dataset.projectId;
        showAllItems = false;
        render();
      });
      el.addEventListener("keydown", function(e){
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); el.click(); }
      });
    });
  }

  function generateProject(intention){
    var promptText = ""+
      "Tu es le moteur d'un produit qui transforme une intention en projet concret et actionnable.\n\n"+
      "Intention de l'utilisateur : \"" + intention + "\"\n\n"+
      "Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour, sans balises markdown, exactement sous cette forme :\n"+
      '{"title":"titre court (3-5 mots)","emoji":"un seul emoji représentatif","summary":"une phrase naturelle qui résume ce qu\'il y a à faire",'+
      '"categories":[{"title":"nom de la catégorie","items":["élément 1","élément 2","..."]}]}'+
      "\n\nRegroupe les actions par aspect logique et distinct du projet (par exemple pour un déménagement : achats & aménagement, administratif, organisation, budget — "+
      "mais adapte entièrement les catégories au type de projet réel, un voyage ou un anniversaire n'auront pas du tout les mêmes). "+
      "Si le projet est simple et n'a qu'un seul aspect, une seule catégorie suffit. Génère entre 1 et 5 catégories pertinentes, chacune avec 3 à 7 éléments concrets et courts (5 à 10 mots).\n"+
      "Ordonne les catégories et leurs éléments dans l'ordre logique où ils doivent être traités : le tout premier élément de la première catégorie doit être la prochaine action la plus utile à faire maintenant.";

    return Promise.resolve().then(function(){
      return fetch("/api/ai", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 800,
          messages: [{role:"user", content:[{type:"text", text:promptText}]}]
        })
      });
    }).then(function(res){ return res.json(); }).then(function(data){
      var textOut = (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
      var clean = textOut.replace(/```json|```/g,"").trim();
      return JSON.parse(clean);
    });
  }

      "2. Ce qui a le plus d'impact sur l'avancement\n"+
      "3. Ce qui est le plus simple à faire maintenant\n"+
      "Réponds UNIQUEMENT avec un tableau JSON des IDs dans le nouvel ordre, sans texte autour : [\"id1\",\"id2\"]";
    return fetch("/api/ai",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,messages:[{role:"user",content:[{type:"text",text:promptText}]}]})
    }).then(function(res){return res.json();}).then(function(data){
      var textOut=(data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
      var clean=textOut.replace(/```json|```/g,"").trim();
      return JSON.parse(clean);
    });
  }

  function performResearchForItem(projectId, itemId){
    var p = findProject(projectId);
    if(!p) return;
    var found = findItemAnywhere(p, itemId);
    if(!found) return;
    var item = found.item;
    if(item.research && item.research.loading) return;
    item.research = {options:[], open:true, loading:true, fetchedAt:null};
    render();
    generateResearch(p, item).then(function(arr){
      item.research = {
        options:(Array.isArray(arr)?arr:[]).map(function(text){return {text:String(text),checked:false};}),
        open:true, loading:false, fetchedAt:nowIso()
      };
      p.updatedAt = nowIso();
      persist(); render();
    }).catch(function(){
      item.research = null;
      showToast("Recherche indisponible pour l'instant");
      render();
    });
  }

  function performReclassify(projectId, categoryId){
    var p = findProject(projectId);
    if(!p) return;
    var cat = categoryId ? findCategory(p, categoryId) : (p.categories[0]||null);
    if(!cat) return;
    generating = true; render();
    generateReclassify(p, cat.items).then(function(orderedIds){
      generating = false;
      if(!Array.isArray(orderedIds)){render();return;}
      var done = cat.items.filter(function(it){return it.done;});
      var remaining = cat.items.filter(function(it){return !it.done;});
      var idMap = {};
      remaining.forEach(function(it){idMap[it.id]=it;});
      var reordered = orderedIds.map(function(id){return idMap[id];}).filter(Boolean);
      remaining.forEach(function(it){if(orderedIds.indexOf(it.id)===-1) reordered.push(it);});
      cat.items = reordered.concat(done);
      cat.updatedAt = nowIso(); p.updatedAt = nowIso();
      persist(); render();
      showToast("Tâches reclassées par priorité");
    }).catch(function(){
      generating = false; render();
      showToast("Reclassement indisponible pour l'instant");
    });
  }

  function performCreateFromIntention(){
    var intention = composeText.trim();
    if(!intention || generating) return;
    generating = true;
    render();

    generateProject(intention).then(function(result){
      generating = false;
      var categories = (Array.isArray(result.categories) ? result.categories : [])
        .map(function(c){ return makeCategory(c.title, c.items); })
        .filter(function(c){ return c.items.length > 0; });
      if(categories.length === 0){
        categories = [makeCategory("À faire", ["Préciser les premières décisions","Identifier qui est impliqué"])];
      }
      var p = makeProject({
        title: (result.title || intention).slice(0,60),
        emoji: result.emoji || "✨",
        summary: result.summary || "",
        categories: categories
      });
      state.projects.push(p);
      composeText = "";
      currentProjectId = p.id;
      persist(); render();
    }).catch(function(){
      generating = false;
      var p = makeProject({
        title: intention.slice(0,60),
        emoji: "✨",
        summary: "Projet créé — complète les étapes ci-dessous.",
        categories: [makeCategory("À faire", ["Préciser les premières décisions","Identifier qui est impliqué","Définir une première échéance"])]
      });
      state.projects.push(p);
      composeText = "";
      currentProjectId = p.id;
      persist(); render();
      showToast("IA indisponible — projet créé avec des étapes de départ");
    });
  }

  function performSuggestForCategory(p, cat){
    generating = true;
    render();
    generateCategorySuggestion(p, cat).then(function(result){
      generating = false;
      var arr = Array.isArray(result) ? result : [];
      arr.slice(0,3).forEach(function(title){ if(title) cat.items.push(makeItem(title)); });
      cat.updatedAt = nowIso(); p.updatedAt = nowIso();
      persist(); render();
      showToast(arr.length ? "Nouveaux éléments ajoutés" : "Rien à ajouter pour l'instant");
    }).catch(function(){
      generating = false;
      showToast("Suggestion indisponible pour l'instant");
    });
  }

  function performSuggestForProject(p){
    generating = true;
    render();
    generateProjectSuggestion(p).then(function(result){
      generating = false;
      if(result && result.type === "add_items" && result.categoryId){
        var cat = findCategory(p, result.categoryId);
        var items = Array.isArray(result.items) ? result.items : [];
        if(cat){
          items.slice(0,3).forEach(function(title){ if(title) cat.items.push(makeItem(title)); });
          cat.updatedAt = nowIso();
        } else if(items.length){
          p.categories.push(makeCategory("Suite", items));
        }
      } else if(result && result.type === "new_category" && result.category){
        var newCat = makeCategory(result.category.title, result.category.items);
        if(newCat.items.length) p.categories.push(newCat);
      }
      p.updatedAt = nowIso();
      persist(); render();
      showToast("La suite du projet a été ajoutée");
    }).catch(function(){
      generating = false;
      showToast("Suggestion indisponible pour l'instant");
    });
  }

  /* ---------- global events ---------- */

  function bindGlobalEvents(){
    var composeTextInput = document.getElementById("compose-text-input");
    if(composeTextInput){
      composeTextInput.addEventListener("input", function(e){ composeText = e.target.value; });
      composeTextInput.addEventListener("keydown", function(e){
        if(e.key === "Enter"){ e.preventDefault(); performCreateFromIntention(); }
      });
    }
    var composeSendBtn = document.getElementById("compose-send-btn");
    if(composeSendBtn && !generating) composeSendBtn.addEventListener("click", function(){ performCreateFromIntention(); });

    var resetBtn = document.getElementById("reset-sample-btn");
    if(resetBtn) resetBtn.addEventListener("click", function(){
      if(confirm("Remplacer tes projets actuels par des exemples ?")){
        state = defaultData();
        persist(); render();
      }
    });

    var backBtn = document.getElementById("detail-back-btn");
    if(backBtn) backBtn.addEventListener("click", function(){ currentProjectId = null; showAllItems = false; render(); });

    var deleteBtn = document.getElementById("detail-delete-btn");
    if(deleteBtn) deleteBtn.addEventListener("click", function(){
      var p = findProject(currentProjectId);
      if(p && confirm('Supprimer "'+p.title+'" ?')){
        state.projects = state.projects.filter(function(x){ return x.id !== p.id; });
        currentProjectId = null;
        persist(); render();
      }
    });

    document.querySelectorAll("[data-open-category]").forEach(function(el){
      el.addEventListener("click", function(){ currentCategoryId = el.dataset.openCategory; render(); });
    });
    var categoryBackBtn = document.getElementById("category-back-btn");
    if(categoryBackBtn) categoryBackBtn.addEventListener("click", function(){ currentCategoryId = null; render(); });
    var categoryDeleteBtn = document.getElementById("category-delete-btn");
    if(categoryDeleteBtn) categoryDeleteBtn.addEventListener("click", function(){
      var p = findProject(currentProjectId);
      var cat = p ? findCategory(p, currentCategoryId) : null;
      if(p && cat && confirm('Supprimer la catégorie "'+cat.title+'" ?')){
        p.categories = p.categories.filter(function(c){ return c.id !== cat.id; });
        p.updatedAt = nowIso();
        currentCategoryId = null;
        persist(); render();
      }
    });
    var addCategoryLinkBtn = document.getElementById("add-category-link-btn");
    if(addCategoryLinkBtn) addCategoryLinkBtn.addEventListener("click", function(){
      var title = prompt("Nom de la nouvelle catégorie ?");
      if(!title) return;
      var p = findProject(currentProjectId);
      if(!p) return;
      p.categories.push(makeCategory(title, []));
      p.updatedAt = nowIso();
      persist(); render();
    });

    document.querySelectorAll("[data-toggle-item]").forEach(function(el){
      el.addEventListener("click", function(){
        var p = findProject(currentProjectId);
        if(!p) return;
        var found = findItemAnywhere(p, el.dataset.toggleItem);
        if(found){ found.item.done = !found.item.done; p.updatedAt = nowIso(); persist(); render(); }
      });
    });
    document.querySelectorAll("[data-remove-item]").forEach(function(el){
      el.addEventListener("click", function(){
        var p = findProject(currentProjectId);
        if(!p) return;
        var found = findItemAnywhere(p, el.dataset.removeItem);
        if(found){
          found.category.items = found.category.items.filter(function(x){ return x.id !== el.dataset.removeItem; });
          p.updatedAt = nowIso();
          persist(); render();
        }
      });
    });

    var addItemBtn = document.getElementById("add-item-btn");
    if(addItemBtn) addItemBtn.addEventListener("click", function(){
      var input = document.getElementById("new-item-input");
      var title = input.value.trim();
      if(!title) return;
      var p = findProject(currentProjectId);
      var cat = p ? findCategory(p, addItemBtn.dataset.category) : null;
      if(!p || !cat) return;
      cat.items.push(makeItem(title));
      p.updatedAt = nowIso();
      persist(); render();
    });
    var newItemInput = document.getElementById("new-item-input");
    if(newItemInput) newItemInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); document.getElementById("add-item-btn").click(); }
    });

    var voirSuiteBtn = document.getElementById("voir-suite-btn");
    if(voirSuiteBtn) voirSuiteBtn.addEventListener("click", function(){ showAllItems = true; render(); });

    var reclassifyBtn = document.getElementById("reclassify-btn");
    if(reclassifyBtn) reclassifyBtn.addEventListener("click", function(){
      performReclassify(currentProjectId, reclassifyBtn.dataset.category);
    });

    document.querySelectorAll("[data-research-btn]").forEach(function(el){
      el.addEventListener("click", function(){
        var p = findProject(currentProjectId);
        if(!p) return;
        var found = findItemAnywhere(p, el.dataset.researchBtn);
        if(!found) return;
        var item = found.item;
        if(item.research && item.research.loading) return;
        if(item.research && item.research.open){
          item.research.open = false; render();
        } else if(item.research && item.research.options && item.research.options.length){
          item.research.open = true; render();
        } else {
          performResearchForItem(currentProjectId, item.id);
        }
      });
    });

    document.querySelectorAll("[data-research-item]").forEach(function(el){
      el.addEventListener("change", function(){
        var p = findProject(currentProjectId);
        if(!p) return;
        var found = findItemAnywhere(p, el.dataset.researchItem);
        if(!found || !found.item.research) return;
        var idx = parseInt(el.dataset.researchIdx, 10);
        found.item.research.options[idx].checked = el.checked;
        p.updatedAt = nowIso();
        persist();
      });
    });

    var suggestCategoryBtn = document.getElementById("suggest-category-btn");
    if(suggestCategoryBtn) suggestCategoryBtn.addEventListener("click", function(){
      var p = findProject(currentProjectId);
      var cat = p ? findCategory(p, suggestCategoryBtn.dataset.category) : null;
      if(p && cat) performSuggestForCategory(p, cat);
    });
    var suggestProjectBtn = document.getElementById("suggest-project-btn");
    if(suggestProjectBtn) suggestProjectBtn.addEventListener("click", function(){
      var p = findProject(currentProjectId);
      if(p) performSuggestForProject(p);
    });
  }

  var resizeTimer = null;
  window.addEventListener("resize", function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ if(!currentProjectId) layoutHomeTreemap(); }, 150);
  });

  load();
})();
</script>
