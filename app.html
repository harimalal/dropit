  /* ---------- rendering ---------- */

  /* ---------- navigation navigateur (bouton/geste retour mobile) ----------
     Chaque écran plus profond (projet, catégorie, liste) pousse une entrée d'historique.
     Les boutons retour à l'écran délèguent à history.back() : un seul endroit (popstate)
     décide comment reculer d'un niveau, que ce soit via ce bouton ou via le geste du téléphone. */
  function pushNavEntry(){
    try{ history.pushState({dropitNav:true}, '', location.href); }catch(e){}
  }

  // Glissement vers la droite commun aux écrans plein écran qui se posent par-dessus
  // l'accueil (projet, liste, agenda) : on retire "open" (l'écran glisse hors champ),
  // et seulement une fois l'animation terminée on efface l'état et on redessine —
  // sinon le nouveau render() supprimerait l'écran avant qu'il ait eu le temps de glisser.
  // `getSnapshotFn` capture la valeur exacte de l'état concerné (ex: l'id du projet en
  // cours) avant l'animation : si une nouvelle navigation change cette valeur pendant
  // les 280ms (ex: retour d'un projet puis ouverture rapide d'un autre), le clearStateFn
  // d'origine ne s'applique plus au bon écran et ne doit pas s'exécuter — sinon il
  // effacerait l'état du nouvel écran ouvert entre-temps.
  function slideScreenOutThenBack(screenId, getSnapshotFn, clearStateFn){
    var el = document.getElementById(screenId);
    if(el){
      var snapshot = getSnapshotFn();
      el.classList.remove('open');
      setTimeout(function(){
        if(getSnapshotFn() !== snapshot) return;
        clearStateFn();
        render();
      }, 280);
    } else {
      clearStateFn(); render();
    }
  }

  function goBackOneLevel(){
    if(calendarOpen){
      slideScreenOutThenBack('calendar-screen', function(){ return calendarOpen; }, function(){ calendarOpen = false; });
      return;
    }
    if(taskListOpen){
      slideScreenOutThenBack('tasklist-screen', function(){ return taskListOpen; }, function(){ taskListOpen = false; });
      return;
    }
    if(currentProjectId){
      slideScreenOutThenBack('detail-screen', function(){ return currentProjectId; },
        function(){ currentProjectId = null; projectMenuOpen = false; });
      return;
    }
    // déjà à l'accueil : rien à faire côté app, le navigateur reprend la main normalement
  }

  // render() reconstruit tout le HTML de l'app à chaque appel (coche, ajout, suppression,
  // changement d'écran...), ce qui réinitialiserait le défilement de l'écran actif à chaque
  // fois. On mémorise donc la position de chaque conteneur scrollable connu juste avant, et on
  // la réapplique juste après — une seule fois ici plutôt que dans chaque gestionnaire d'événement.
  var SCROLL_CONTAINER_IDS = ['detail-scroll','tl-scroll','cal-list'];

  // Fait glisser un écran plein écran (projet/liste/agenda) depuis la droite après
  // qu'il vient d'être (ré)inséré dans le DOM. `wasAlreadyOpen` coupe la transition
  // pour un rendu qui ne fait que rafraîchir un écran déjà ouvert (coche d'une tâche,
  // changement de filtre...) — l'animation ne doit jouer qu'à une vraie ouverture.
  function slideScreenIn(screenId, wasAlreadyOpen){
    var el = document.getElementById(screenId);
    if(!el) return;
    if(wasAlreadyOpen){
      el.style.transition = 'none';
      el.classList.add('open');
      requestAnimationFrame(function(){ el.style.transition = ''; });
    } else {
      requestAnimationFrame(function(){ el.classList.add('open'); });
    }
  }

  function render(){
    var scrollSnapshot = {};
    SCROLL_CONTAINER_IDS.forEach(function(id){
      var el = document.getElementById(id);
      if(el) scrollSnapshot[id] = el.scrollTop;
    });

    // L'accueil reste toujours la base, même quand un projet/la liste/l'agenda est
    // ouvert par-dessus : c'est ce qui permet à l'écran du dessus de glisser vers la
    // droite au retour, plutôt qu'un remplacement instantané. On retient lesquels
    // étaient déjà affichés AVANT ce rendu pour ne rejouer l'animation d'ouverture
    // que sur une vraie ouverture (pas à chaque coche de tâche ou changement de filtre).
    var tlWasOpen = !!document.getElementById('tasklist-screen');
    var detailWasOpen = !!document.getElementById('detail-screen');
    var calWasOpen = !!document.getElementById('calendar-screen');
    var project = currentProjectId ? findProject(currentProjectId) : null;

    var app = document.getElementById("app");
    app.innerHTML = renderHome();
    layoutHomeTreemap();

    if(taskListOpen) slideScreenIn('tasklist-screen', tlWasOpen);

    if(project){
      app.insertAdjacentHTML('beforeend', renderDetail(project));
      slideScreenIn('detail-screen', detailWasOpen);
      scrollStepsToCurrent();
    }

    if(calendarOpen){
      app.insertAdjacentHTML('beforeend', renderCalendarScreen());
      slideScreenIn('calendar-screen', calWasOpen);
    }

    // Fenêtre Drop Zone : un seul point d'injection, quel que soit l'écran affiché (le
    // bouton qui l'ouvre, lui, vit maintenant dans la barre de navigation de chaque écran).
    app.insertAdjacentHTML('beforeend', renderDropSheet());
    if(dropSheetOpen){
      var dsInput = document.getElementById('drop-sheet-input');
      if(dsInput) dsInput.focus();
    }
    bindGlobalEvents();
    if(generating) renderLoadingOverlay();

    SCROLL_CONTAINER_IDS.forEach(function(id){
      if(!(id in scrollSnapshot)) return;
      var el = document.getElementById(id);
      if(el) el.scrollTop = scrollSnapshot[id];
    });
  }

  var TREEMAP_UNIT_AREA = 3400; // px² "naturels" par point de poids (tâches + catégories)
  var TREEMAP_MIN_HEIGHT = 130;

  function layoutHomeTreemap(){
    var zone = document.getElementById("home-treemap-zone");
    if(!zone || state.projects.length === 0) return;
    // La zone est flex:1 dans .home-container (flex column) : sa hauteur exclut déjà
    // automatiquement la salutation, pas besoin de la soustraire manuellement.
    var composeBar = document.getElementById("compose-bar");
    var tabBar = document.getElementById("bottom-tabbar");
    var composeBarClearance = (composeBar ? composeBar.offsetHeight : 60) + (tabBar ? tabBar.offsetHeight : 58) + 12;
    var W = zone.clientWidth, viewportH = zone.clientHeight - composeBarClearance;
    if(W < 40 || viewportH < 40) return;

    var items = state.projects.map(function(p){
      return {id:p.id, project:p, value: Math.max(1, allItems(p).length + p.categories.length)};
    });
    // Rétroactif : tout projet sans photo (nouveau ou déjà existant) en déclenche la
    // récupération ici, en parallèle du calcul du treemap — jamais bloquant.
    items.forEach(function(it){ ensureProjectIcon(it.project); ensureProjectPhoto(it.project); });
    var totalWeight = items.reduce(function(s,x){ return s + x.value; }, 0);
    var naturalHeight = (totalWeight * TREEMAP_UNIT_AREA) / W;
    var treemapH = Math.min(viewportH, Math.max(TREEMAP_MIN_HEIGHT, naturalHeight));

    var rects = computeTreemap(items, W, treemapH);

    var gutter = 3;

    var html = rects.map(function(r){
      var p = r.item.project;
      var x=r.x+gutter, y=r.y+gutter, w=Math.max(0,r.w-gutter*2), h=Math.max(0,r.h-gutter*2);
      var sizeClass = sizeClassFor(w,h);
      var hasPhoto = !!(p.photo && p.photo.url);
      var titleFontSize = titleFontSizeFor(w,h,p.title,hasPhoto);
      var pct = progressPct(p);
      var status = activityStatus(p);
      // Barre de progression : pas sur les tuiles minuscules, ni sur les tuiles basses où elle ne
      // tiendrait pas sous l'icône et le titre (moins de 86 px).
      var showProgress = sizeClass !== "size-tiny" && !(sizeClass === "size-flat" && h < 86);
      var pc = projectColorVars(p.id);
      var doneClass = status === "accompli" ? " is-done" : "";
      var photoClass = hasPhoto ? " has-photo" : "";
      var iconBox = iconBoxFor(w, h, hasPhoto, sizeClass);
      // Icône sur photo : décalée du coin, sans voile sous elle.
      var iconOff = sizeClass === 'size-tiny' ? 5 : (sizeClass === 'size-flat' ? 6 : 8);
      var iconVars = hasPhoto ? '--picon-off:'+iconOff+'px;' : '';
      return ''+
      '<div class="tile '+sizeClass+doneClass+photoClass+'" data-project-id="'+p.id+'" '+
        'style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;'+
          '--tile-card-bg:'+pc.card+';--tile-badge-glass:'+pc.glass+';--tile-rgb:'+pc.rgb+';'+iconVars+'" '+
        'role="button" tabindex="0">'+
        '<div class="tile-body">'+
          (hasPhoto ? '<div class="tile-photo"></div><div class="tile-scrim"></div>' : '')+
          projectIconHtml(p, iconBox)+
          '<div class="tile-title" style="font-size:'+titleFontSize+'px;-webkit-line-clamp:'+titleMaxLinesFor(w,h)+';">'+escapeHtml(p.title)+'</div>'+
          (showProgress
            ? '<div class="tile-progress">'+
                '<div class="tile-progress-track"><div class="tile-progress-fill" style="width:'+pct+'%;"></div></div>'+
                '<span class="tile-progress-pct">'+pct+'%</span>'+
                tileChevronIcon()+
              '</div>'
            : '')+
        '</div>'+
      '</div>';
    }).join("");
    zone.innerHTML = '<div class="home-treemap-inner" style="height:'+Math.ceil(treemapH)+'px;">'+html+'</div>';

    // Photo posée via la CSSOM (style.backgroundImage), jamais interpolée dans le HTML :
    // évite tout risque d'injection même si une URL contenait un caractère inattendu.
    rects.forEach(function(r){
      var p = r.item.project;
      if(!p.photo || !p.photo.url) return;
      var photoLayer = zone.querySelector('[data-project-id="'+p.id+'"] .tile-photo');
      if(photoLayer) photoLayer.style.backgroundImage = "url('" + p.photo.url + "')";
    });

    zone.querySelectorAll("[data-project-id]").forEach(function(el){
      el.addEventListener("click", function(){
        currentProjectId = el.dataset.projectId;
        pushNavEntry();
        render();
      });
      el.addEventListener("keydown", function(e){
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); el.click(); }
      });
    });
  }

  function buildFlatTasks(){
    var tasks = [];
    state.projects.forEach(function(p, pi){
      // filtre par projets sélectionnés
      if(tlSelectedProjects.length > 0 && tlSelectedProjects.indexOf(p.id) < 0) return;
      var undone = 0;
      p.categories.forEach(function(cat){
        cat.items.forEach(function(it){
          if(it.done) return;
          // Vue multi-projets (accueil) : reste un digest plafonné à 3 tâches/projet.
          // Vue scopée à un projet (ouverte depuis ce projet) : tout s'affiche, filtrable.
          if(!tlScopedToProject && undone >= 3) return;
          var pri = undone === 0 ? 'p1' : undone === 1 ? 'p2' : undone === 2 ? 'p3' : 'reste';
          undone++;
          if(tlScopedToProject){
            if(tlCategoryFilter && cat.id !== tlCategoryFilter) return;
            if(tlPriorityFilter !== 'all' && pri !== tlPriorityFilter) return;
          }
          tasks.push({item:it, project:p, category:cat, priority:pri, pi:pi});
        });
      });
    });
    return tasks;
  }

  function renderTlRow(t, hideProjectEmoji){
    var multiCat = t.project.categories.length > 1;
    var catLabel = multiCat ? ' · ' + escapeHtml(t.category.title) : '';
    var badgeHtml = t.overdue

      : t.priority === 'p1'
      ? '<span class="tl-badge p1">P1</span>'
      : t.priority === 'p2' ? '<span class="tl-badge p2">P2</span>'
      : t.priority === 'p3' ? '<span class="tl-badge p3">P3</span>'
      : '';
    var pcRow = projectColorVars(t.project.id);
    // L'émoji projet ne sert à rien (non cliquable, toujours le même) quand la liste
    // est déjà scopée à ce seul projet — on ne l'affiche que dans les vues mixtes.
    var emojiHtml = hideProjectEmoji ? '' :
      projectIconHtml(t.project, 30);
    return '<div class="tl-row'+(t.priority==='reste'?' muted':'')+'" data-tl-nav-proj="'+t.project.id+'">'+
      '<button class="tl-check" data-tl-toggle="'+t.item.id+'" data-tl-proj="'+t.project.id+'"></button>'+
      '<div class="tl-info">'+

  /* ---------- calendrier ----------
     "Aujourd'hui" (calSelectedDate === aujourd'hui) : file vivante, pas une attente jusqu'à
     l'échéance — on avance un peu sur chaque projet actif chaque jour plutôt que de foncer sur
     un seul jusqu'à sa deadline. Ordre de base = échéance la plus courte d'abord ; rotation
     quotidienne pour que la sélection tourne d'un projet à l'autre au fil de la semaine ;
     répartition tour par tour dans le top 3 de chaque projet (un peu de chacun avant beaucoup
     d'un seul). Les échéances dépassées et non closes remontent toujours en tête, "En retard".
     Un autre jour du calendrier (navigation) : comportement inchangé, uniquement les projets
     dont l'échéance tombe exactement ce jour-là — pas de rotation, pas de fourre-tout. ---------- */
  var CAL_DAY_MAX = 5;
  function buildCalendarTasks(){
    var todayStr = todayDateStr();

    if(calSelectedDate !== todayStr){
      var dayCandidates = [];
      state.projects.forEach(function(p){
        if(!p.dueDate || isAccompli(p)) return;
        if(dateToStr(new Date(p.dueDate)) !== calSelectedDate) return;
        priorityItems(p).forEach(function(x){
          dayCandidates.push({item:x.item, category:x.category, project:p, priority:'cal'});
        });
      });
      return dayCandidates.slice(0, CAL_DAY_MAX);
    }

    var active = state.projects.filter(function(p){
      return !isAccompli(p) && priorityItems(p).length > 0;
    });
    if(!active.length) return [];

    active.sort(function(a,b){
      return dueBucketOrder(a.dueBucket) - dueBucketOrder(b.dueBucket);
    });

    // Décale le point de départ de la rotation chaque jour civil, pour que ce ne soit pas
    // toujours les mêmes projets en tête de liste d'un jour sur l'autre.
    var dayIndex = Math.floor(Date.now()/86400000);
    var offset = dayIndex % active.length;
    var rotated = active.slice(offset).concat(active.slice(0, offset));

    var pools = rotated.map(function(p){ return {project:p, items:priorityItems(p)}; });
    var ordered = [];
    for(var round=0; round<3; round++){
      pools.forEach(function(x){
        if(x.items.length > round) ordered.push({project:x.project, entry:x.items[round]});
      });
    }

    var entries = ordered.map(function(o){
      var overdue = !!(o.project.dueDate && dateToStr(new Date(o.project.dueDate)) < todayStr);
      return {item:o.entry.item, category:o.entry.category, project:o.project, priority:'cal', overdue:overdue};
    });
    entries.sort(function(a,b){ return (b.overdue?1:0) - (a.overdue?1:0); });
    return entries.slice(0, CAL_DAY_MAX);
  }

  function tlTargetProject(){
    if(tlSelectedProjects.length === 1) return findProject(tlSelectedProjects[0]);
    var actives = state.projects.filter(function(p){ return !isAccompli(p); });
    var pool = actives.length ? actives : state.projects;
    return pool.slice().sort(function(a,b){ return new Date(b.updatedAt)-new Date(a.updatedAt); })[0] || null;
  }

    // Liste ouverte depuis un projet précis : aucune raison de laisser filtrer/voir
    // les autres projets ici — la rangée de filtre devient catégorie + priorité de CE projet.
    var filterRowHtml;
    if(tlScopedToProject){

          }).join('')
        : '';
      var catAllChip = catChips
        ? '<button class="tl-text-chip'+(!tlCategoryFilter?' active':'')+'" data-tl-cat-filter="">Toutes</button>'
        : '';
      var priChips = ['all','p1','p2','p3'].map(function(pri){

          'style="--chip-badge:'+pcChip.badge+';--chip-solid:'+pcChip.solid+';">'+projectIconHtml(p, 30)+'</button>';
      }).join('');
      filterRowHtml = '<div class="tl-filter-row">'+filterLabel+filterChips+'</div>';
    } else {
      filterRowHtml = '';
    }

    var rows = tasks.length
      ? tasks.map(function(t){ return renderTlRow(t, tlScopedToProject); }).join('')
      : '<div class="tl-empty">Rien ici avec ces filtres'+(tlScopedToProject?'.':'.<br>Toutes les tâches sont faites !')+'</div>';

    return '<div class="tasklist-screen" id="tasklist-screen">'+
      '<div class="tasklist-top">'+
        '<button class="top-back-btn" id="tl-back-btn" title="Retour">'+backIcon()+'</button>'+
        '<span class="tasklist-title">'+titleHtml+'</span>'+
        '<span class="tasklist-count">'+countLabel+'</span>'+
      '</div>'+
      filterRowHtml+
      '<div class="tasklist-scroll" id="tl-scroll">'+rows+'</div>'+
      // .tasklist-screen reste dans le DOM (hors écran, left:100%) même fermé, pour
      // l'animation de glissement — ne pas y ajouter la tabbar en permanence, seulement
      // pendant que cet écran est réellement affiché, sous peine d'un second jeu de
      // boutons #tabbar-* hors-champ mais bien présent (doublon d'id + tabulation clavier).
      (taskListOpen ? renderBottomTabBar() : '')+
    '</div>';
  }

  var CAL_WEEKDAYS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  var CAL_MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

  function projectsDueOn(dateStr){
    return state.projects.filter(function(p){
      if(!p.dueDate) return false;
      var d = new Date(p.dueDate);
      return (d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())) === dateStr;
    });
  }

  // Jalons intermédiaires (projets moyen/long terme uniquement — à échéance courte,
  // le badge d'échéance seul suffit) : un point à 1 mois puis un à mi-parcours, chacun
  // avec un pourcentage de tâches attendu. Sert de "on est dans les temps ou pas".
  function dateToStr(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function projectCheckpoints(p){
    if(!p.dueDate || !p.createdAt) return [];
    if(p.dueBucket === "1w" || p.dueBucket === "2w") return [];
    var created = new Date(p.createdAt).getTime();
    var due = new Date(p.dueDate).getTime();
    if(due <= created) return [];
    var points = [];
    var oneMonthMs = 30*86400000;
    if(p.dueBucket !== "1m" && created + oneMonthMs < due){
      points.push({dateStr: dateToStr(new Date(created + oneMonthMs)), expectedPct:25});
    }
    points.push({dateStr: dateToStr(new Date(created + (due-created)/2)), expectedPct:50});
    return points;
  }
  function checkpointsDueOn(dateStr){
    var result = [];
    state.projects.forEach(function(p){
      projectCheckpoints(p).forEach(function(cp){
        if(cp.dateStr === dateStr) result.push({project:p, expectedPct:cp.expectedPct});
      });
    });
    return result;
  }

  function renderCalendarGrid(){
    var year = calViewYear, month = calViewMonth;
    var todayStr = todayDateStr();
    var firstOfMonth = new Date(year, month, 1);
    // Grille lundi-dimanche : décale l'index JS (0=dimanche) pour partir du lundi.
    var startOffset = (firstOfMonth.getDay() + 6) % 7;
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var daysInPrevMonth = new Date(year, month, 0).getDate();

    var cells = [];
    for(var i=0;i<startOffset;i++){
      cells.push({day: daysInPrevMonth - startOffset + 1 + i, otherMonth:true, dateStr:null});
    }
    for(var d=1; d<=daysInMonth; d++){
      cells.push({day:d, otherMonth:false, dateStr: year+"-"+pad2(month+1)+"-"+pad2(d)});
    }
    while(cells.length % 7 !== 0){
      cells.push({day: cells.length - startOffset - daysInMonth + 1, otherMonth:true, dateStr:null});
    }

    var cellsHtml = cells.map(function(c){
      var cls = "cal-day";
      if(c.otherMonth) cls += " other-month";
      if(c.dateStr === todayStr) cls += " today";
      if(c.dateStr && c.dateStr === calSelectedDate) cls += " selected";
      var attr = c.dateStr ? ' data-cal-day="'+c.dateStr+'"' : '';
      // Échéances qui tombent ce jour-là : anneau = avancement du projet (progressPct),
      // position = jour d'échéance. Rappel visuel direct dans la grille, sans ouvrir le projet.
      var dueProjects = c.dateStr ? projectsDueOn(c.dateStr) : [];
      var dueBadges = dueProjects.map(function(p){
        return '<span class="cal-due-badge" style="--pct:'+progressPct(p)+'%;" title="'+escapeHtml(p.title)+' — échéance, '+progressPct(p)+'% fait">'+projectGlyphHtml(p, 9)+'</span>';
      });
      // Jalons intermédiaires : verdict "dans les temps / en retard" une fois la date
      // atteinte (comparaison avec le % de tâches réellement fait), neutre avant.
      var checkpointBadges = c.dateStr ? checkpointsDueOn(c.dateStr).map(function(cp){
        var reached = c.dateStr <= todayStr;
        var actual = progressPct(cp.project);
        var status = !reached ? "upcoming" : (actual >= cp.expectedPct ? "ontrack" : "behind");
        var statusLabel = status==="ontrack" ? "dans les temps" : status==="behind" ? "en retard" : "à venir";
        return '<span class="cal-checkpoint-badge cp-'+status+'" title="'+escapeHtml(cp.project.title)+' — jalon '+cp.expectedPct+'% ('+statusLabel+', '+actual+'% fait)">'+projectGlyphHtml(cp.project, 9)+'</span>';
      }) : [];
      var allBadges = dueBadges.concat(checkpointBadges).slice(0,3);
      var dueHtml = allBadges.length ? '<span class="cal-day-dues">'+allBadges.join('')+'</span>' : '';
      return '<button class="'+cls+'"'+attr+(c.otherMonth?' disabled':'')+'>'+
        '<span class="cal-day-num">'+c.day+'</span>'+dueHtml+
      '</button>';
    }).join('');

    var rowCount = cells.length / 7;
    return '<div class="cal-top-section">'+
      '<div class="cal-nav-row">'+
        '<button class="cal-nav-btn" id="cal-prev-month" title="Mois précédent">'+backIcon()+'</button>'+
        '<span class="cal-month-label">'+CAL_MONTHS[month]+' '+year+'</span>'+
        '<button class="cal-nav-btn" id="cal-next-month" title="Mois suivant">'+nextMonthIcon()+'</button>'+
      '</div>'+
      '<div class="cal-weekdays">'+CAL_WEEKDAYS.map(function(w){ return '<span class="cal-weekday">'+w+'</span>'; }).join('')+'</div>'+
      '<div class="cal-grid" style="grid-template-rows:repeat('+rowCount+',1fr);">'+cellsHtml+'</div>'+
    '</div>';
  }

  /* Étapes du projet : les catégories quand il y en a plusieurs (elles jouent déjà ce rôle),
     sinon les tâches de l'unique catégorie — dans les deux cas, la séquence que l'utilisateur
     parcourt réellement. */
  function projectSteps(p){
    if(p.categories.length > 1){
      return p.categories.map(function(cat){
        var total = cat.items.length;
        var doneCount = cat.items.filter(function(it){ return it.done; }).length;
        return {label: cat.title, done: total > 0 && doneCount === total};
      });
    }
    var cat = p.categories[0];
    if(!cat) return [];
    return cat.items.map(function(it){ return {label: it.title, done: !!it.done}; });
  }

  function renderStepsStrip(p){
    var steps = projectSteps(p);
    // Une seule étape (ou aucune) : la barre de progression au-dessus dit déjà tout,
    // une bande d'étapes n'ajouterait qu'une pastille isolée.
    if(steps.length < 2) return '';
    var currentIdx = -1;
    for(var i=0; i<steps.length; i++){ if(!steps[i].done){ currentIdx = i; break; } }
    var n = steps.length;
    var nodes = steps.map(function(s, idx){
      var cls = s.done ? 'is-done' : (idx === currentIdx ? 'is-current' : 'is-todo');
      // Le trait à gauche d'une pastille est rempli dès que l'étape précédente est faite,
      // celui de droite dès que l'étape elle-même l'est : la ligne se remplit donc en
      // continu jusqu'à l'étape en cours.
      var leftCls = idx === 0 ? ' is-edge' : (steps[idx-1].done ? ' filled' : '');
      var rightCls = idx === n-1 ? ' is-edge' : (s.done ? ' filled' : '');
      return '<div class="step-node '+cls+'">'+
        '<div class="step-node-top">'+
          '<span class="step-link'+leftCls+'"></span>'+
          '<span class="step-dot">'+(s.done ? '✓' : (idx+1))+'</span>'+
          '<span class="step-link'+rightCls+'"></span>'+
        '</div>'+
        '<div class="step-label">'+escapeHtml(s.label)+'</div>'+
        '<div class="step-count">'+(idx+1)+'/'+n+'</div>'+
      '</div>';
    }).join('');
    return '<div class="steps-strip" id="steps-strip"><div class="steps-row">'+nodes+'</div></div>';
  }

  // Recentre la bande sur l'étape en cours après chaque rendu : sur un projet à 12 étapes,
  // celle qui compte est sinon hors champ à droite.
  function scrollStepsToCurrent(){
    var strip = document.getElementById('steps-strip');
    if(!strip) return;
    var current = strip.querySelector('.step-node.is-current');
    if(!current) return;
    strip.scrollLeft = Math.max(0, current.offsetLeft - (strip.clientWidth - current.offsetWidth)/2);
  }

  function renderDetail(p){
    var pct = progressPct(p);
    var accompli = isAccompli(p);
    var items2 = allItems(p);
    var multiCategory = p.categories.length > 1;
    var priorityList = accompli ? [] : priorityItems(p);
    var priorityIds = priorityList.map(function(x){ return x.item.id; });

    // Carrousel "Prochaine action" : parcourt le haut de la file de priorités (jusqu'à 3)
    // au lieu de n'afficher que la toute première. Index remis à zéro dès qu'on change
    // de projet, pour ne jamais rester bloqué sur une position obsolète.
    if(nextActionPreviewProjectId !== p.id){ nextActionPreviewProjectId = p.id; nextActionPreviewIndex = 0; }
    if(nextActionPreviewIndex >= priorityList.length) nextActionPreviewIndex = 0;
    var next = priorityList.length ? priorityList[nextActionPreviewIndex] : null;

    var topBarHtml = ''+
    '<div class="top-bar">'+
      '<button class="top-delete-btn" id="project-menu-btn" title="Options du projet">'+dotsMenuIcon()+'</button>'+
    '</div>';

    var headerHtml = ''+
    '<div class="detail-header">'+
      projectIconHtml(p, 56, 'detail-picon')+
      '<div class="detail-headings">'+
        '<div class="detail-title">'+escapeHtml(p.title)+'</div>'+
        (p.summary ? '<div class="detail-summary">'+escapeHtml(p.summary)+'</div>' : '')+
        (p.dna ? '<div class="project-dna">'+escapeHtml(p.dna)+'</div>' : '')+
      '</div>'+
    '</div>'+
    '<div class="detail-progress-row">'+
      '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;"></div></div>'+
      '<span class="detail-progress-pct">'+pct+'%</span>'+
    '</div>'+
    renderStepsStrip(p);

    var mainActionHtml = "";
    if(accompli){
      mainActionHtml = ''+
      '<div class="accompli-banner">'+
        '<div class="big">Vous l\'avez fait '+projectIconHtml(p, 26, 'inline-picon')+'</div>'+
        '<div class="stats">'+items2.length+' étape'+(items2.length!==1?"s":"")+' accomplie'+(items2.length!==1?"s":"")+'</div>'+
      '</div>';
    } else if(next){
      var hasMore = priorityList.length > 1;
      mainActionHtml = ''+
      '<div class="next-action-card">'+
        (hasMore ? '<button class="next-action-peek-btn prev" id="next-action-prev-btn" title="Voir la précédente">'+chevronIcon()+'</button>' : '')+
        (hasMore ? '<button class="next-action-peek-btn" id="next-action-peek-btn" title="Voir la suivante">'+chevronIcon()+'</button>' : '')+
        (multiCategory ? '<div class="next-action-category">'+escapeHtml(next.category.title)+'</div>' : '')+
        '<span class="next-action-badge">Prochaine action</span>'+
        '<div class="next-action-title">'+escapeHtml(next.item.title)+'</div>'+
        '<div class="next-action-row">'+
          '<button class="btn btn-primary" data-toggle-item="'+next.item.id+'">'+checkIcon()+' &nbsp;C\'est fait</button>'+
        '</div>'+
      '</div>';
    }

    var bodyHtml = "";
    var detailBarHtml = "";
    if(!accompli && !multiCategory){
      var cat = p.categories[0] || makeCategory("À faire", []);
      var remaining = cat.items.filter(function(it){ return !it.done; });
      var completed = cat.items.filter(function(it){ return it.done; });
      // Tout le reste du projet reste visible (plus de clic "Voir la suite" à faire) :
      // seules les tâches hors du top 3 prioritaire sont grisées (classe "muted").
      var suiteHtml = remaining.length > 1
        ? '<div class="section-label">Ensuite</div>'+
          remaining.slice(1).map(function(it){
            var isPrio = priorityIds.indexOf(it.id)>=0;
            return renderItemUnit(it, isPrio, !isPrio);
          }).join("")
        : '';
      bodyHtml = ''+
        suiteHtml+
        (completed.length ? '<div class="section-label">Terminé ('+completed.length+')</div>'+completed.map(function(it){ return renderItemUnit(it, false); }).join("") : '')+
        renderProjectNotes(p);
      detailBarHtml = renderItemBar(cat.id);
    } else if(!accompli && multiCategory){
      bodyHtml = ''+
        '<div class="section-label proj-badge-label">Catégories</div>'+
        '<div class="category-accordion">'+
          p.categories.map(function(cat){ return renderCategoryAccordionItem(p, cat, priorityIds); }).join("")+
        '</div>'+
        renderProjectNotes(p);
      // La catégorie dépliée devient la cible de la barre de saisie (ajouter une tâche
      // dedans) ; repliée, la barre sert à créer une nouvelle catégorie.
      var openCat = expandedCategoryId ? findCategory(p, expandedCategoryId) : null;
      detailBarHtml = openCat ? renderItemBar(openCat.id) : renderProjectBar(p);
    } else if(accompli && p.categories.length){
      bodyHtml = multiCategory
        ? '<div class="section-label proj-badge-label">Catégories</div><div class="category-accordion">'+
            p.categories.map(function(cat){ return renderCategoryAccordionItem(p, cat, []); }).join("")+
          '</div>'
        : (p.categories[0]||{items:[]}).items.map(function(it){ return renderItemUnit(it, false); }).join("");
      // Un projet accompli reste modifiable : la barre d'ajout ne doit pas disparaître
      // (on peut rouvrir une catégorie ou en ajouter une nouvelle même une fois terminé).
      if(multiCategory){
        var openCat = expandedCategoryId ? findCategory(p, expandedCategoryId) : null;
        detailBarHtml = openCat ? renderItemBar(openCat.id) : renderProjectBar(p);
      } else {
        detailBarHtml = renderItemBar(p.categories[0].id);
      }
    }

    var pc = projectColorVars(p.id);
    var scrollStyle = 'style="--current-proj-card:'+pc.card+';--current-proj-card-faint:'+pc.cardFaint+';--current-proj-badge:'+pc.badge+';--current-proj-solid:'+pc.solid+';--current-proj-priority:'+pc.priority+';--current-proj-btn:'+pc.btn+';--current-proj-next:'+pc.next+';"';
    return '<div class="detail-screen" id="detail-screen">'+
    topBarHtml+
    '<div class="detail-scroll" id="detail-scroll" '+scrollStyle+'>'+
      '<div class="detail-inner">'+
        headerHtml+
        mainActionHtml+
        bodyHtml+
      '</div>'+
    '</div>'+
    detailBarHtml+
    renderChatModal(p)+
    renderNoteModal()+
    renderProjectMenu(p)+
    renderBottomTabBar()+
    '<div class="toast" id="toast"></div>'+
    '</div>';
  }

  /* Catégorie en accordéon : une seule fenêtre pour parcourir un projet, plus de
     navigation vers un écran séparé. Le clic sur la carte déplie/replie les tâches
     juste en dessous, avec une légère animation d'entrée (voir .category-expanded). */
  function renderCategoryAccordionItem(p, cat, priorityIds){
    var total = cat.items.length;
    var done = cat.items.filter(function(it){return it.done;}).length;
    var pct = total ? Math.round((done/total)*100) : 0;
    var catDone = total>0 && done===total;
    var isOpen = expandedCategoryId === cat.id;

    var cardHtml = ''+
    '<button class="category-card '+(catDone?"done":"")+(isOpen?" expanded":"")+'" data-open-category="'+cat.id+'">'+
      '<div class="category-card-title">'+escapeHtml(cat.title)+'</div>'+
      '<div class="category-progress-track"><div class="category-progress-fill" style="width:'+pct+'%;"></div></div>'+
      '<div class="category-card-meta">'+done+'/'+total+'</div>'+
      '<span class="category-card-chevron">'+chevronIcon()+'</span>'+
    '</button>';

    var expandedHtml = '';
    if(isOpen){
      var remaining = cat.items.filter(function(it){ return !it.done; });
      var completed = cat.items.filter(function(it){ return it.done; });
      expandedHtml = '<div class="category-expanded">'+
        remaining.map(function(it){ return renderItemUnit(it, priorityIds.indexOf(it.id)>=0); }).join("")+
        (completed.length ? '<div class="section-label">Terminé ('+completed.length+')</div>'+completed.map(function(it){ return renderItemUnit(it, false); }).join("") : '')+
        '<button class="category-delete-inline" data-delete-category="'+cat.id+'">'+trashIcon()+' Supprimer cette catégorie</button>'+
      '</div>';
    }

    return '<div class="category-accordion-item">'+cardHtml+expandedHtml+'</div>';
  }

  function noteIcon(){
    return '<svg class="icon" viewBox="0 0 20 20" fill="none">'+
      '<rect x="3.5" y="2.5" width="11" height="15" rx="2" stroke="currentColor" stroke-width="1.4"/>'+
      '<path d="M6 7h7M6 10h7M6 13h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>'+
    '</svg>';
  }

  function renderItemNotePanel(it){
    if(noteOpenId !== it.id) return '';
    var notesHtml = (it.notes||[]).map(function(n){
      return '<div class="note-entry">'+
        '<span class="note-entry-text">'+escapeHtml(n.text)+'</span>'+
        '<button class="note-pencil-btn" data-note-modal-edit="'+n.id+'" data-note-modal-task="'+it.id+'" title="Modifier">'+pencilIcon()+'</button>'+
        '<button class="note-delete-btn" data-delete-note="'+n.id+'" data-delete-note-task="'+it.id+'">×</button>'+
      '</div>';
    }).join('');
    return '<div class="note-panel">'+

  /* ---------- Drop it : bouton de la barre de navigation + fenêtre de capture / tri ---------- */

  function dropZoneCount(){ return state.dropZone.length; }

  function renderDropBadge(d, toss){
    // Même charte que les badges de projet ailleurs dans l'app : voile de couleur en fond
    // (--proj-*-badge) + la teinte pleine (--proj-*-solid) pour le texte, jamais du blanc.
    var c = projectColorVars(d.id);
    return '<button class="drop-badge'+(toss?' toss':'')+'" data-drop-check="'+d.id+'" '+
      'style="background:'+c.badge+';color:'+c.solid+';" title="Fait">'+
      '<span class="drop-badge-check"></span>'+
      '<span class="drop-badge-label">'+escapeHtml(d.title)+'</span>'+
    '</button>';
  }

  function renderDropTriageList(){
    var count = dropZoneCount();
    return count
      ? '<div class="drop-badges" id="drop-badges">'+
          state.dropZone.map(function(d){ return renderDropBadge(d, false); }).join('')+
        '</div>'
      : '<div class="drop-triage-empty">Rien à trier — la Drop Zone est vide.</div>';
  }

  // Plusieurs barres de navigation coexistent dans le DOM (l'accueil garde la sienne sous
  // l'écran projet/liste/agenda qui se pose par-dessus) : le compteur doit être mis à jour
  // sur toutes les copies, pas seulement la première trouvée.
  function updateDropTabBadgeCount(){
    var count = state.dropZone.length;
    document.querySelectorAll('#drop-tab-btn').forEach(function(btn){
      var badge = btn.querySelector('.drop-tab-badge');
      if(count > 0){
        if(badge) badge.textContent = count;
        else btn.insertAdjacentHTML('beforeend', '<span class="drop-tab-badge">'+count+'</span>');
      } else if(badge){
        badge.remove();
      }
    });
  }

  function renderDropSheet(){
    if(!dropSheetOpen) return '';

    return '<div class="drop-sheet" id="drop-sheet">'+
      '<div class="drop-sheet-box">'+
        '<div class="drop-sheet-header">'+
          '<div class="drop-zone-brand">'+
            '<div class="drop-zone-icon">📥</div>'+
            '<div class="drop-zone-title">DROP <span>ZONE</span></div>'+
            '<div class="drop-zone-pill">Ton espace de « décharge mentale » <b>en 1 clic.</b></div>'+
          '</div>'+
          '<button class="chat-close-btn" id="drop-sheet-close-btn">×</button>'+
        '</div>'+
        '<div class="drop-sheet-body" id="drop-sheet-body">'+renderDropTriageList()+'</div>'+
        '<div class="drop-sheet-compose">'+
          '<div class="drop-sheet-input-row">'+
            '<input class="drop-sheet-input" id="drop-sheet-input" type="text" placeholder="Une idée, une tâche…" autocomplete="off">'+
            '<button class="drop-sheet-send" id="drop-sheet-send-btn" title="Envoyer">Envoyer</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function performDropCapture(){
    var input = document.getElementById('drop-sheet-input');
    var text = input ? input.value.trim() : '';
    if(!text) return;

    var entry = {id:uid(), title:text, createdAt:nowIso()};
    state.dropZone.push(entry);
    persist();
    if(input){ input.value = ''; input.focus(); }
    // Ajout léger dans le DOM (pas de render() complet) : le nouveau badge apparaît
    // avec l'animation "jeté dans la zone" (voir .drop-badge.toss) sans redessiner
    // toute la fenêtre — même logique que la sélection de projet et le cochage.
    var body = document.getElementById('drop-sheet-body');
    if(body){
      if(!document.getElementById('drop-badges')){
        body.innerHTML = '<div class="drop-badges" id="drop-badges"></div>';
      }
      var badgesEl = document.getElementById('drop-badges');
      badgesEl.insertAdjacentHTML('beforeend', renderDropBadge(entry, true));
      // Nœud inséré hors d'un render() : le rebranchement global des [data-drop-check]
      // (fait dans bindGlobalEvents, appelé seulement après un render()) ne le voit
      // jamais — on relie donc son clic directement ici.
      var newBadge = badgesEl.lastElementChild;
      if(newBadge) newBadge.addEventListener('click', function(){ performDropCheck(entry.id); });
    }
    updateDropTabBadgeCount();
    showToast('Envoyé dans la Drop Zone');
  }

  function performDropCheck(dropId){
    var foundIdx = -1;
    state.dropZone.forEach(function(d, i){ if(d.id === dropId) foundIdx = i; });
    if(foundIdx < 0) return;
    state.dropZone.splice(foundIdx, 1);
    persist();
    // Mise à jour légère (pas de render() complet) : le badge coché disparaît
    // directement, sans redessiner toute la fenêtre — même logique que pour la
    // sélection de projet, pour ne jamais faire "sauter" la fenêtre en cours d'usage.
    var badgeEl = document.querySelector('.drop-badge[data-drop-check="'+dropId+'"]');
    if(badgeEl) badgeEl.remove();
    if(!state.dropZone.length){
      var body = document.getElementById('drop-sheet-body');
      if(body) body.innerHTML = '<div class="drop-triage-empty">Rien à trier — la Drop Zone est vide.</div>';
    }
    updateDropTabBadgeCount();
  }

  function chatIcon(){
    return '<svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M3 5a2 2 0 012-2h10a2 2 0 012 2v7a2 2 0 01-2 2H8l-4 2V5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  }

  function parseAiText(text){
    return String(text||'').split('\n').map(function(line){
      if(!line.trim()) return '<div style="height:5px"></div>';
      var safe = escapeHtml(line);
      safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if(/^### /.test(line)) return '<div class="ai-h3">'+safe.slice(4)+'</div>';
      if(/^## /.test(line))  return '<div class="ai-h2">'+safe.slice(3)+'</div>';
      if(/^# /.test(line))   return '<div class="ai-h1">'+safe.slice(2)+'</div>';
      if(/^[-•] /.test(line)) return '<div class="ai-li"><span class="ai-bullet">·</span><span>'+safe.slice(2)+'</span></div>';
      return '<div class="ai-p">'+safe+'</div>';
    }).join('');
  }

  function renderItemRow(it, isPriority, isMuted){
    var noteOpen = noteOpenId === it.id;
    var noteCount = (it.notes && it.notes.length) || 0;
    var rowStyle = noteOpen ? 'border-radius:10px 10px 0 0;border-bottom-color:transparent;' : '';
    var badgeHtml = noteCount > 0 ? '<span class="note-badge">'+noteCount+'</span>' : '';
    var isEditing = editingItemId === it.id;
    var titleHtml = isEditing
      ? '<textarea class="step-title-input" data-item-title-input="'+it.id+'" rows="1">'+escapeHtml(it.title)+'</textarea>'
      : '<span class="step-title">'+escapeHtml(it.title)+'</span>';
    return ''+
    '<div class="step-row '+(it.done?"done":"")+(isPriority?" priority":"")+(isMuted?" muted":"")+'" style="'+rowStyle+'">'+
      '<button class="step-check '+(it.done?"checked":"")+'" data-toggle-item="'+it.id+'">'+(it.done?checkIcon():'')+'</button>'+
      titleHtml+
      '<button class="note-icon-btn'+(noteCount>0?' has-notes':'')+'" data-note-open="'+it.id+'" title="Notes">'+noteIcon()+badgeHtml+'</button>'+
      '<button class="step-remove" data-remove-item="'+it.id+'">×</button>'+
    '</div>'+
    renderItemNotePanel(it);

  function showToast(message){
    var t = document.getElementById("toast");

    t.textContent = message;
    requestAnimationFrame(function(){ t.classList.add("show"); });
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  /* ---------- AI generation ---------- */

  function generateProject(intention){
    var promptText = ""+
      "Tu es le moteur d'un produit qui transforme une intention en projet concret et actionnable.\n\n"+
      "Intention de l'utilisateur : \"" + intention + "\"\n\n"+
      "Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour, sans balises markdown, exactement sous cette forme :\n"+
      '{"title":"titre court (3-5 mots)","domain":"famille|voyage|maison|sport|business|creativite|apprentissage|autre","emoji":"un seul emoji représentatif du domaine choisi","icon":"UNE clé de la liste d\'icônes","summary":"une phrase naturelle qui résume ce qu\'il y a à faire",'+
      '"dueBucket":"1w|2w|1m|3m|6m|1y","categories":[{"title":"nom de la catégorie","items":["élément 1","élément 2","..."]}]}'+
      "\n\nRegroupe les actions par aspect logique et distinct du projet (par exemple pour un déménagement : achats & aménagement, administratif, organisation, budget — "+
      "mais adapte entièrement les catégories au type de projet réel, un voyage ou un anniversaire n'auront pas du tout les mêmes). "+
      "Nomme chaque catégorie avec un verbe à l'infinitif + un sujet concis, 2 à 3 mots maximum (ex : \"Préparer le budget\", \"Organiser le transport\", \"Réserver le logement\"). "+
      "Si le projet est simple et n'a qu'un seul aspect, une seule catégorie suffit. Génère entre 1 et 5 catégories pertinentes, chacune avec 3 à 7 éléments concrets et courts (5 à 10 mots).\n"+
      "Ordonne les catégories et leurs éléments dans l'ordre logique où ils doivent être traités : le tout premier élément de la première catégorie doit être la prochaine action la plus utile à faire maintenant.\n\n"+
      "Pour \"dueBucket\", exactement une des 6 valeurs 1w/2w/1m/3m/6m/1y : si l'intention mentionne un délai précis (date, événement, \"avant l'été\", \"pour dans 2 mois\"...), déduis-en la valeur la plus proche. "+
      "Sinon, estime la durée réaliste selon la charge de travail implicite du projet (nombre et taille des étapes) : une poignée de tâches simples et rapides → court terme (1w/2w) ; un projet avec plusieurs catégories et des démarches qui prennent du temps (administratif, gros achat, organisation d'événement) → moyen terme (1m/3m) ; un projet ambitieux à plusieurs phases → long terme (6m/1y).\n\n"+
      "Pour \"domain\" et \"emoji\" : choisis EXACTEMENT une des 7 valeurs de domaine listées (\"autre\" seulement si vraiment aucune ne convient), et un emoji cohérent avec ce domaine "+
      "(ex : famille→👨‍👩‍👧/👪/❤️, voyage→✈️/🧳/🌴, maison→🏠/🛋️/🌿, sport→🏃/🚴/🏋️, business→💼/📈/💰, creativite→🎨/📷/🎵, apprentissage→📚/🎓/💻 — tu peux choisir un emoji proche de ces exemples plutôt qu'un des exemples exact si plus précis). "+
      "L'icône dépend de ce domaine : ne la choisis jamais indépendamment de lui.\n\n"+
      "Pour \"icon\" : EXACTEMENT UNE clé parmi cette liste (rien d'autre), celle qui représente le mieux l'objet du projet — la même idée que l'emoji : "+iconCatalogForPrompt()+".";

    return Promise.resolve().then(function(){
      return apiFetch("/api/ai", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          model: "claude-sonnet-4-6",

    }).then(function(res){ return res.json(); }).then(function(data){
      var textOut = (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
      var clean = textOut.replace(/```json|```/g,"").trim();

  function generateChatResponse(p, messages){
    var tasks = [];
    p.categories.forEach(function(cat){
      cat.items.forEach(function(it){
        var noteSummary = (it.notes&&it.notes.length) ? it.notes.map(function(n){return n.text;}).join(' / ') : '';
        tasks.push((p.categories.length > 1 ? cat.title+' / ' : '')+it.title+
          (noteSummary ? ' → '+noteSummary : '')+(it.done?' (fait)':''));
      });
    });
    var systemText = "Tu es l'assistant de ce projet. Utilise des titres (# ou ##), du gras (**mot**) "+
      "et des tirets (- item) quand c'est utile pour la lisibilité. Sois concis et opérationnel. "+
      "Pas d'introduction, pas de formule de politesse.\n\n"+
      "PROJET : \""+p.title+"\" — "+(p.dna||p.summary||"")+"\n"+
      "TÂCHES :\n"+tasks.join('\n');
    var hist = messages.slice(-20);
    while(hist.length && hist[0].role !== 'user') hist = hist.slice(1);
    var apiMessages = hist.map(function(m){
      return {role:m.role==='user'?'user':'assistant', content:[{type:"text",text:m.text}]};
    });
    return apiFetch("/api/ai",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001", max_tokens:1800, system:systemText, messages:apiMessages})
    }).then(function(res){return res.json();}).then(function(data){
      return (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n").trim();
    });
  }

  function generateProjectDNA(p){
    var taskSummary = [];
    var hasNotes = false;
    p.categories.forEach(function(cat){
      cat.items.forEach(function(it){
        var noteTexts = (it.notes&&it.notes.length) ? it.notes.map(function(n){return n.text;}).join(' / ') : '';
        var line = (it.done?'✓ ':'• ')+it.title+(noteTexts?' → '+noteTexts:'');
        taskSummary.push(line);
        if(noteTexts) hasNotes = true;
      });
    });
    if(!hasNotes) return Promise.resolve(null);
    var promptText = "Projet : \""+p.title+"\"\nTâches :\n"+taskSummary.join('\n')+"\n\n"+
      "En une phrase directe (15 mots max), décris l'état actuel du projet et la prochaine priorité. "+
      "Commence par ce qui est concret. Exemple : \"Budget fixé à 500€, reste à confirmer la date et le lieu.\" "+
      "Réponds UNIQUEMENT avec la phrase, sans guillemets, sans intro.";
    return apiFetch("/api/ai",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001", max_tokens:60, messages:[{role:"user",content:[{type:"text",text:promptText}]}]})
    }).then(function(res){return res.json();}).then(function(data){
      var text = (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("").trim();
      return text || null;
    });
  }

  function performSaveChatAsNote(projectId, text){
    var p = findProject(projectId);
    if(!p || !text.trim()) return;
    if(!p.projectNotes) p.projectNotes = [];
    var catId = null;
    var firstLine = '';
    var lines = text.split('\n');
    for(var i=0; i<lines.length; i++){
      var l = lines[i].trim().replace(/^#+\s*/,'').replace(/\*\*/g,'').replace(/^[-•]\s*/,'');
      if(l){ firstLine = l; break; }
    }
    var title = firstLine.slice(0,65) + (firstLine.length>65 ? '…' : '');
    var newNote = {id:uid(), title:title, body:text.trim(), catId:catId, createdAt:nowIso()};
    p.projectNotes.push(newNote);
    projectNoteOpenId = newNote.id;
    p.updatedAt = nowIso();
    persist(); render();
    showToast("Note enregistrée");
  }

  function performCreateFromIntention(){
    var intention = composeText.trim();
    if(!intention || generating) return;
    generating = true;
    render();

    generateProject(intention).then(function(result){
      generating = false;
      var categories = (Array.isArray(result.categories) ? result.categories : [])
        .map(function(c){ return makeCategory(c.title, c.items); })
        .filter(function(c){ return c.items.length > 0; });
      if(categories.length === 0){
        categories = [makeCategory("À faire", ["Préciser les premières décisions","Identifier qui est impliqué"])];
      }
      // Échéance estimée par l'IA à partir de l'intention ; repli sur "1 mois" si la
      // valeur est absente ou hors de la liste attendue (réponse mal formée).
      var dueBucket = dueBucketInfo(result.dueBucket) ? result.dueBucket : "1m";
      var p = makeProject({
        title: (result.title || intention).slice(0,60),
        emoji: result.emoji || "✨",
        icon: (result.icon && ICON_CATALOG[result.icon]) ? result.icon : null,
        summary: result.summary || "",
        categories: categories,
        dueBucket: dueBucket,
        dueDate: computeDueDate(dueBucket)
      });
      state.projects.push(p);
      composeText = "";
      currentProjectId = p.id;
      pushNavEntry();
      ensureProjectPhoto(p);
      persistNow(); render();
    }).catch(function(){
      generating = false;
      var p = makeProject({
        title: intention.slice(0,60),
        emoji: "✨",
        summary: "Projet créé — complète les étapes ci-dessous.",
        categories: [makeCategory("À faire", ["Préciser les premières décisions","Identifier qui est impliqué","Définir une première échéance"])],
        dueBucket: "1m",
        dueDate: computeDueDate("1m")
      });
      state.projects.push(p);
      composeText = "";
      currentProjectId = p.id;
      pushNavEntry();
      ensureProjectPhoto(p);
      persistNow(); render();
      showToast("IA indisponible — projet créé avec des étapes de départ");
    });
  }

  function performSuggestForCategory(p, cat){
    var dfbInput = document.getElementById('dfb-input');
    var userText = dfbInput ? dfbInput.value.trim() : '';
    generating = true;
    render();
    generateCategorySuggestion(p, cat, userText).then(function(result){
      generating = false;
      var arr = Array.isArray(result) ? result : [];
      arr.slice(0,3).forEach(function(title){ if(title) cat.items.push(makeItem(title)); });
      cat.updatedAt = nowIso(); p.updatedAt = nowIso();
      persist(); render();
      showToast(arr.length ? "Nouveaux éléments ajoutés" : "Rien à ajouter pour l'instant");

  function performSuggestForProject(p){
    var dfbProjInput = document.getElementById('dfb-proj-input');
    var userText = dfbProjInput ? dfbProjInput.value.trim() : '';
    generating = true;
    render();
    generateProjectSuggestion(p, userText).then(function(result){
      generating = false;
      if(result && result.type === "add_items" && result.categoryId){
        var cat = findCategory(p, result.categoryId);
        var items = Array.isArray(result.items) ? result.items : [];
        if(cat){
          items.slice(0,3).forEach(function(title){ if(title) cat.items.push(makeItem(title)); });
          cat.updatedAt = nowIso();
        } else if(items.length){
          p.categories.push(makeCategory("Suite", items));
        }
      } else if(result && result.type === "new_category" && result.category){
        var newCat = makeCategory(result.category.title, result.category.items);
        if(newCat.items.length) p.categories.push(newCat);
      }
      p.updatedAt = nowIso();
      persist(); render();
      showToast("La suite du projet a été ajoutée");
    }).catch(function(){
      generating = false;
      showToast("Suggestion indisponible pour l'instant");
    });

  /* ---------- global events ---------- */

  // Le détail projet et l'agenda embarquent chacun leur propre copie de la bottom-tabbar
  // (voir le commentaire CSS ".detail-screen .bottom-tabbar" plus haut) pendant que celle de
  // l'accueil reste dans le DOM en dessous. getElementById renverrait alors la copie de
  // l'accueil (masquée, la première dans l'ordre du document) au lieu de celle réellement
  // affichée — les taps sur la barre visible ne faisaient donc rien. On prend la dernière
  // occurrence de l'id, qui est toujours celle de l'écran actuellement au premier plan.
  function lastById(id){
    var els = document.querySelectorAll('#'+id);
    return els.length ? els[els.length-1] : null;
  }

  function bindTabBarEvents(){
    var homeBtn = lastById('tabbar-home');
    var listBtn = lastById('tabbar-list');
    var chatBtn = lastById('tabbar-chat');
    var calBtn = lastById('tabbar-cal');

    if(homeBtn) homeBtn.addEventListener('click', function(){
      currentProjectId = null;
      expandedCategoryId = null;
      taskListOpen = false;
      tlSelectedProjects = [];
      tlScopedToProject = false;
      projectMenuOpen = false;
      calendarOpen = false;
      render();
    });

    if(listBtn && !taskListOpen) listBtn.addEventListener('click', function(){
      var filterProjectId = currentProjectId;
      currentProjectId = null;
      expandedCategoryId = null;
      calendarOpen = false;
      taskListOpen = true;
      tlScopedToProject = !!filterProjectId;
      tlSelectedProjects = filterProjectId ? [filterProjectId] : [];
      tlCategoryFilter = null;
      tlPriorityFilter = 'all';
      pushNavEntry();
      render();
    });

    if(chatBtn) chatBtn.addEventListener('click', function(){
      if(currentProjectId){
        chatProjectOpen = true;
      } else {
        chatHomeOpen = true;
      }
      render();
      setTimeout(function(){
        var id = currentProjectId ? 'chat-msgs-'+currentProjectId : 'chat-msgs-home';
        var el = document.getElementById(id);
        if(el) el.scrollTop = el.scrollHeight;
      }, 50);

  function bootAfterAuth(){

    load(); // enchaîne lui-même questionnaire / visite guidée / notice

  function boot(){
    setupNativeAuthCallback(); // no-op sur le web ; nécessaire une seule fois avant toute connexion Google/Apple
    document.getElementById("app").innerHTML =
      '<div class="auth-boot"><div class="loading-spinner"></div></div>';

    fetch("/api/config")
      .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error("config")); })
      .then(function(cfg){
        supa.url = cfg.supabaseUrl;
        supa.anon = cfg.supabaseAnonKey;
        if(cfg.providers) supa.providers = cfg.providers;
        authReady = true;

        var fromOAuth = consumeOAuthRedirect();
        if(fromOAuth === "recovery"){ renderAuth(); return; } // écran "nouveau mot de passe"
        if(!fromOAuth) session = loadSession();

        if(!session){ renderAuth(); return; }

        // Session en mémoire : on la valide avant d'afficher quoi que ce soit.
        return ensureToken().then(function(token){
          if(!token){ saveSession(null); renderAuth(); return; }
          bootAfterAuth();
        });
      })
      .catch(function(){
        document.getElementById("app").innerHTML =
          '<div class="auth-screen"><div class="auth-box">'+
            '<div class="auth-logo">🗂️</div>'+
            '<div class="auth-title">Service indisponible</div>'+
            '<div class="auth-sub">La configuration du serveur n\'a pas pu être chargée. '+
            'Vérifie ta connexion et recharge la page.</div>'+
            '<button class="auth-submit" onclick="location.reload()" style="margin-top:20px;">Recharger</button>'+
          '</div></div>';
      });
  }

  boot();
})();
</script>
<script>
// Service worker sans cache (voir /sw.js) : sert seulement la page « pas de connexion ».
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  });
}
</script>

</html>
