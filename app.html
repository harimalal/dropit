    position:fixed;inset:0;z-index:70;background:rgba(43,36,32,0.38);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .account-sheet-box{
    width:100%;max-width:620px;background:var(--canvas-card);
    border-radius:20px 20px 0 0;padding:20px 20px calc(20px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));
    box-shadow:0 -8px 32px rgba(43,36,32,0.18);
  }
  .account-email{font-size:14.5px;font-weight:700;color:var(--ink);word-break:break-all;}

  function obSlideHtml(slide, idx, activeIdx){
    var active = idx === activeIdx ? " active" : "";

    if(slide.type === "features"){
      var itemsHtml = (slide.features || []).map(function(f){
        return '<div class="ob-feature-item">'+
          '<div class="ob-feature-icon">'+f.icon+'</div>'+
          '<div class="ob-feature-text">'+f.text+'</div>'+
        '</div>';
      }).join("");
      return '<div class="ob-slide'+active+'" data-slide="'+idx+'">'+
        '<div class="ob-eyebrow">'+slide.eyebrow+'</div>'+
        '<div class="ob-title">'+slide.title+'</div>'+
        '<div class="ob-features-row">'+
          '<div class="ob-features-thumb" style="background-image:url(\''+slide.thumbImg+'\');'+
            'background-size:'+slide.thumbBgSize+';background-position:'+slide.thumbBgPos+';"></div>'+
          '<div class="ob-features-list">'+itemsHtml+'</div>'+
        '</div>'+
      '</div>';
    }

    var frameStyle = slide.frameMarginTop ? ' style="margin-top:'+slide.frameMarginTop+'px;"' : "";
    var popHtml = slide.pop
      ? '<div class="ob-pop" style="'+slide.pop.style+'">'+slide.pop.text+'</div>' : "";
    var calloutsHtml = (slide.callouts || []).map(function(c){
      return '<div class="ob-callout" style="'+c.style+'background-image:url(\''+slide.img+'\');'+
        'background-size:'+c.bgSize+';background-position:'+c.bgPos+';"></div>';
    }).join("");
    return '<div class="ob-slide'+active+'" data-slide="'+idx+'">'+
      '<div class="ob-eyebrow">'+slide.eyebrow+'</div>'+
      '<div class="ob-title">'+slide.title+'</div>'+
      '<div class="ob-shot-frame"'+frameStyle+'>'+
        '<div class="ob-shot-clip" style="height:'+slide.clipHeight+'px;">'+
          '<img src="'+slide.img+'" style="top:'+slide.imgTop+'px;">'+
        '</div>'+
        popHtml + calloutsHtml +
      '</div>'+
      '<div class="ob-body">'+slide.body+'</div>'+
    '</div>';
  }

          el.replaceWith(wrap.firstChild);
          wireOnboarding();

    });

             {id:"projet",e:"📁",l:"Par projet"}, {id:"priorite",e:"🔺",l:"Par priorité"},

  var profile = null;        // {answers, completedAt} tel que renvoyé par /api/profile
  var obqAnswers = {};
  var obqIndex = 0;
  var obqDir = 1;
  var obqAfter = null;       // ce qu'on enchaîne une fois le questionnaire fermé
  var obqSaveTimer = null;

  // L'écran "âge des enfants" n'a de sens que si la réponse précédente est oui :
  // il disparaît du parcours (et du compteur) sinon.
  function obqScreens(){
    return QUIZ.filter(function(sc){
      if(!sc.onlyIf) return true;
      return obqAnswers[sc.onlyIf.id] === sc.onlyIf.value;
    });
  }

  function obqMoodIndex(i, total){
    if(total <= 1) return PROFILE_MOODS.length - 1;
    return Math.round(i * (PROFILE_MOODS.length - 1) / (total - 1));
  }

  /* ---------- API profil ---------- */

  function loadProfile(){
    return apiFetch("/api/profile")
      .then(function(res){ return res.json(); })
      .then(function(json){ profile = json.profile || null; return profile; })
      .catch(function(){ profile = null; return null; });
  }

  function saveProfileAnswers(completed){
    var payload = {answers: obqAnswers};
    if(completed) payload.completed = true;
    return apiFetch("/api/profile", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    }).then(function(){
      profile = {answers: obqAnswers, completedAt: completed ? nowIso() : (profile && profile.completedAt) || null};
    }).catch(function(){ /* le questionnaire ne doit jamais bloquer sur le réseau */ });
  }

  // Sauvegarde intermédiaire : si l'utilisateur abandonne en cours de route,
  // ses réponses déjà données sont conservées (sans completed_at).
  function obqPersist(){
    clearTimeout(obqSaveTimer);
    obqSaveTimer = setTimeout(function(){ saveProfileAnswers(false); }, 600);
  }

  /* ---------- rendu ---------- */

  function obqUserIcon(){ return '<svg class="icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="6.6" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M3.8 16.6c0-3 2.8-4.6 6.2-4.6s6.2 1.6 6.2 4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'; }
  function obqArrowIcon(){ return '<svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 5l5 5-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function obqChevronIcon(){ return '<svg class="icon" viewBox="0 0 20 20" fill="none" style="width:16px;height:16px;flex-shrink:0;color:var(--ink-faint);"><path d="M8 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }


  function obqOptionHtml(sc, o, idx){
    var isCards = sc.k === "cards";
    var sel = obqIsPicked(sc, o.id);
    var base = "opacity:0;transform:translateY(13px);";
    if(isCards){
      return '<button class="obq-card'+(sel?" sel":"")+'" data-opt="'+escapeHtml(o.id)+'" data-enter '+
        'style="'+base+'background:'+(o.t||"#FFFFFF")+';">'+
        '<span class="obq-tick">'+checkIcon()+'</span>'+
        '<span class="obq-ce">'+o.e+'</span>'+
        '<span>'+escapeHtml(o.l)+'</span>'+
      '</button>';
    }
    // Lignes : pastille à gauche pour les écrans "box", emoji sinon.
    var showBox = sc.box ? (sc.k === "many" || sel || !o.e) : false;
    var showIcon = !!o.e && (sc.box && sc.k === "one" ? !sel : true);
    var boxCls = "obq-box" + (sc.k === "one" ? " rnd" : "") + (sel ? " on" : "");
    return '<button class="obq-row'+(sel?" sel":"")+'" data-opt="'+escapeHtml(o.id)+'" data-enter style="'+base+'">'+
      (showBox ? '<span class="'+boxCls+'">'+checkIcon()+'</span>' : '')+
      (showIcon ? '<span class="obq-ic">'+o.e+'</span>' : '')+
      '<span class="obq-lb">'+escapeHtml(o.l)+'</span>'+
    '</button>';
  }

  function obqBodyHtml(sc){
    var base = "opacity:0;transform:translateY(13px);";
    var html = '<h1 class="obq-title">'+escapeHtml(sc.title)+'</h1>';
    if(sc.sub)  html += '<p class="obq-sub">'+escapeHtml(sc.sub)+'</p>';
    if(sc.hint) html += '<p class="obq-hint">'+escapeHtml(sc.hint)+'</p>';

    if(sc.k === "intro"){
      html += '<div class="obq-chips">'+ sc.chips.map(function(c){
        return '<div class="obq-chip" data-enter style="'+base+'background:'+c.t+';"><span>'+c.e+'</span>'+escapeHtml(c.l)+'</div>';
      }).join("") +'</div>';
    } else if(sc.k === "cards"){
      html += '<div class="obq-grid">'+ sc.opts.map(function(o, i){ return obqOptionHtml(sc, o, i); }).join("") +'</div>';
      if(sc.other) html += obqOtherHtml(sc);
    } else if(sc.k === "one" || sc.k === "many"){
      html += '<div class="obq-list">'+ sc.opts.map(function(o, i){ return obqOptionHtml(sc, o, i); }).join("");
      if(sc.other) html += obqOtherHtml(sc);
      html += '</div>';
    } else if(sc.k === "field"){
      html += '<div class="obq-field" data-enter style="'+base+'">'+ obqUserIcon() +
        '<input class="obq-input" id="obq-input" placeholder="'+escapeHtml(sc.placeholder)+'" '+
        'value="'+escapeHtml(obqAnswers[sc.id] || "")+'" autocomplete="given-name"></div>';
    } else if(sc.k === "free"){
      html += '<textarea class="obq-area" id="obq-area" data-enter style="'+base+'" '+
        'placeholder="'+escapeHtml(sc.placeholder)+'">'+escapeHtml(obqAnswers[sc.id] || "")+'</textarea>';
    } else if(sc.k === "done"){
      html += '<div class="obq-ckl">'+ sc.bullets.map(function(b){
        return '<div class="obq-ck" data-enter style="'+base+'"><span class="obq-ckd">'+checkIcon()+'</span>'+escapeHtml(b)+'</div>';
      }).join("") +'</div>';
    }
    return html;
  }

  function obqOtherHtml(sc){
    return '<input class="obq-other" id="obq-other" data-enter style="opacity:0;transform:translateY(13px);" '+
      'placeholder="Autre..." value="'+escapeHtml(obqAnswers[sc.id + "_autre"] || "")+'">';
  }

  function obqFootHtml(sc){
    // Sur le premier écran, "Passer" voudrait dire deux choses : on tranche
    // pour la seule utile, quitter le questionnaire entier.
    var second = sc.last ? ''
      : sc.k === "intro" ? '<button class="obq-skip" id="obq-later">Plus tard</button>'
      : '<button class="obq-skip" id="obq-skip">Passer</button>';
    return '<button class="obq-cta" id="obq-next">'+escapeHtml(sc.cta)+ obqArrowIcon() +'</button>' + second;
  }

  function obqPaint(){
    var list = obqScreens();
    var sc = list[obqIndex];
    if(!sc) return;
    var total = list.length;

    var count = document.getElementById("obq-count");
    var fill  = document.getElementById("obq-fill");
    var mood  = document.getElementById("obq-mood");
    var quip  = document.getElementById("obq-quip");
    var back  = document.getElementById("obq-back");
    var body  = document.getElementById("obq-body");
    var foot  = document.getElementById("obq-foot");
    if(!body || !foot) return;

    if(count) count.textContent = (obqIndex + 1) + " / " + total;
    if(fill)  fill.style.width = Math.round(((obqIndex + 1) / total) * 100) + "%";
    var mi = obqMoodIndex(obqIndex, total);
    if(mood){ mood.textContent = PROFILE_MOODS[mi]; mood.style.transform = "translate(-50%,-50%) scale(.78)"; }
    if(quip) quip.textContent = PROFILE_QUIPS[mi];
    if(back) back.style.visibility = obqIndex === 0 ? "hidden" : "visible";

    body.innerHTML = obqBodyHtml(sc);
    foot.innerHTML = obqFootHtml(sc);
    body.scrollTop = 0;
    obqEnter();
  }

  // Entrée : l'écran glisse dans le sens de la navigation, puis les options
  // montent une à une (55ms d'amorce, 30ms d'écart).
  function obqEnter(){
    var body = document.getElementById("obq-body");
    var mood = document.getElementById("obq-mood");
    if(!body) return;
    var E = "cubic-bezier(.16,1,.3,1)";
    var els = body.querySelectorAll("[data-enter]");
    body.style.transition = "none";
    body.style.opacity = "0";
    body.style.transform = "translateX(" + (26 * obqDir) + "px)";
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        body.style.transition = "opacity .36s " + E + ", transform .36s " + E;
        body.style.opacity = "1";
        body.style.transform = "none";
        if(mood) mood.style.transform = "translate(-50%,-50%) scale(1)";
        for(var i = 0; i < els.length; i++){
          var d = 55 + i * 30;
          els[i].style.transition =
            "opacity .36s " + E + " " + d + "ms, transform .36s " + E + " " + d + "ms," +
            "border-color .2s ease, background .2s ease, box-shadow .2s ease";
          els[i].style.opacity = "1";
          els[i].style.transform = "none";
        }
      });
    });
  }

  /* ---------- sélection et navigation ---------- */

  function obqIsPicked(sc, id){
    var v = obqAnswers[sc.id];
    if(sc.k === "one") return v === id;
    return Array.isArray(v) && v.indexOf(id) >= 0;
  }

  function obqToggle(sc, id, el){
    if(sc.k === "one"){
      obqAnswers[sc.id] = id;
    } else {
      var cur = Array.isArray(obqAnswers[sc.id]) ? obqAnswers[sc.id].slice() : [];
      var at = cur.indexOf(id);
      if(at >= 0) cur.splice(at, 1); else cur.push(id);
      obqAnswers[sc.id] = cur;
    }
    obqPersist();
    obqRefreshSelection(sc, el);
  }

  // On ne redessine pas : un champ "Autre..." en cours de saisie perdrait
  // son texte et son focus. Les classes suffisent, les transitions CSS font
  // le reste.
  function obqRefreshSelection(sc, clicked){
    var body = document.getElementById("obq-body");
    if(!body) return;
    var nodes = body.querySelectorAll("[data-opt]");
    for(var i = 0; i < nodes.length; i++){
      var node = nodes[i];
      var sel = obqIsPicked(sc, node.getAttribute("data-opt"));
      node.classList.toggle("sel", sel);
      var box = node.querySelector(".obq-box");
      if(box) box.classList.toggle("on", sel);
    }
    // Écran à choix unique avec pastille : l'emoji laisse la place à la coche.
    if(sc.box && sc.k === "one") obqRepaintRows(sc);
  }

  function obqRepaintRows(sc){
    var body = document.getElementById("obq-body");
    var list = body && body.querySelector(".obq-list");
    if(!list) return;
    var nodes = list.querySelectorAll("[data-opt]");
    for(var i = 0; i < nodes.length && i < sc.opts.length; i++){
      var o = sc.opts[i];
      var sel = obqIsPicked(sc, o.id);
      var showBox = sc.k === "many" || sel || !o.e;
      var showIcon = !!o.e && !sel;
      var boxCls = "obq-box rnd" + (sel ? " on" : "");
      nodes[i].innerHTML =
        (showBox ? '<span class="'+boxCls+'">'+checkIcon()+'</span>' : '')+
        (showIcon ? '<span class="obq-ic">'+o.e+'</span>' : '')+
        '<span class="obq-lb">'+escapeHtml(o.l)+'</span>';
    }
  }

  // Les champs libres ne sont lus qu'au moment de quitter l'écran.
  function obqCapture(){
    var list = obqScreens();
    var sc = list[obqIndex];
    if(!sc) return;
    var input = document.getElementById("obq-input");
    var area  = document.getElementById("obq-area");
    var other = document.getElementById("obq-other");
    if(input) obqAnswers[sc.id] = input.value.trim().slice(0, 60);
    if(area)  obqAnswers[sc.id] = area.value.trim().slice(0, 300);
    if(other){
      var v = other.value.trim().slice(0, 120);
      if(v) obqAnswers[sc.id + "_autre"] = v;
      else delete obqAnswers[sc.id + "_autre"];
    }
  }

  function obqGo(d){
    var total = obqScreens().length;
    var target = obqIndex + d;
    if(target < 0) return;
    if(target > total - 1) return;
    obqDir = d > 0 ? 1 : -1;
    var body = document.getElementById("obq-body");
    if(body){
      body.style.transition = "opacity .19s ease-in, transform .19s ease-in";
      body.style.opacity = "0";
      body.style.transform = "translateX(" + (-26 * obqDir) + "px)";
    }
    setTimeout(function(){
      // La liste peut avoir changé de longueur (écran conditionnel) : on
      // recalcule l'index cible à partir de l'écran effectivement demandé.
      var list = obqScreens();
      obqIndex = Math.max(0, Math.min(target, list.length - 1));
      obqPaint();
    }, 190);
  }

  function obqNext(){
    obqCapture();
    obqPersist();
    var list = obqScreens();
    if(obqIndex >= list.length - 1){ obqFinish(); return; }
    obqGo(1);
  }

  function obqSkip(){
    var list = obqScreens();
    var sc = list[obqIndex];
    if(sc && sc.id){ delete obqAnswers[sc.id]; delete obqAnswers[sc.id + "_autre"]; }
    obqPersist();
    if(obqIndex >= list.length - 1){ obqFinish(); return; }
    obqGo(1);
  }

  function obqFinish(){
    clearTimeout(obqSaveTimer);
    saveProfileAnswers(true);
    obqClose();
  }

  function obqClose(){
    var el = document.getElementById("obq");
    if(el) el.remove();
    var after = obqAfter;
    obqAfter = null;
    if(after) after();
  }

  /* ---------- ouverture ---------- */

  function openQuestionnaire(startIndex, after){
    obqAnswers = (profile && profile.answers) ? JSON.parse(JSON.stringify(profile.answers)) : {};
    obqAfter = after || null;
    obqDir = 1;
    var list = obqScreens();
    obqIndex = Math.max(0, Math.min(startIndex || 0, list.length - 1));

    var el = document.createElement("div");
    el.className = "obq";
    el.id = "obq";
    el.innerHTML =
      '<div class="obq-top">'+
        '<button class="obq-back" id="obq-back">'+backIcon()+'</button>'+
        '<div class="obq-count" id="obq-count"></div>'+
        '<div class="obq-logo">DROP<i></i>IT</div>'+
      '</div>'+
      '<div class="obq-quip" id="obq-quip"></div>'+
      '<div class="obq-prog">'+
        '<div class="obq-bar"><div class="obq-fill" id="obq-fill" style="width:0%">'+
          '<span class="obq-mood" id="obq-mood"></span>'+
        '</div></div>'+
      '</div>'+
      '<div class="obq-body" id="obq-body"></div>'+
      '<div class="obq-foot" id="obq-foot"></div>';
    document.body.appendChild(el);

    el.addEventListener("click", function(e){
      var opt = e.target.closest ? e.target.closest("[data-opt]") : null;
      if(opt && el.contains(opt)){
        var sc = obqScreens()[obqIndex];
        if(sc) obqToggle(sc, opt.getAttribute("data-opt"), opt);
        return;
      }
      if(e.target.closest("#obq-next")){ obqNext(); return; }
      if(e.target.closest("#obq-skip")){ obqSkip(); return; }
      if(e.target.closest("#obq-later")){ obqClose(); return; }
      if(e.target.closest("#obq-back")){ obqCapture(); obqGo(-1); return; }
    });
    el.addEventListener("keydown", function(e){
      if(e.key === "Enter" && e.target.id === "obq-input"){ e.preventDefault(); obqNext(); }
    });

    obqPaint();
  }

  // Premier lancement d'un compte : questionnaire → visite guidée →
  // notice "projets d'exemple". Chaque étape appelle la suivante, jamais
  // deux fenêtres empilées.
  function startFreshAccount(){
    loadProfile().then(function(p){
      if(p && p.completedAt){
        showOnboardingIfNeeded();
        maybeShowSampleNotice();
        return;
      }
      openQuestionnaire(0, function(){
        showOnboardingIfNeeded();
        maybeShowSampleNotice();
      });
    });
  }

  /* ---------- profil : relecture et modification ---------- */

  function obqAnswerLabel(sc){
    var v = obqAnswers[sc.id];
    var extra = obqAnswers[sc.id + "_autre"];
    var text = "";
    if(sc.k === "field" || sc.k === "free"){
      text = typeof v === "string" ? v : "";
    } else if(sc.k === "one"){
      var hit = (sc.opts || []).filter(function(o){ return o.id === v; })[0];
      text = hit ? hit.l : "";
    } else {
      var ids = Array.isArray(v) ? v : [];
      text = (sc.opts || []).filter(function(o){ return ids.indexOf(o.id) >= 0; })
        .map(function(o){ return o.l; }).join(", ");
    }
    if(extra) text = text ? text + ", " + extra : extra;
    return text;
  }

  function openProfileSheet(){
    obqAnswers = (profile && profile.answers) ? JSON.parse(JSON.stringify(profile.answers)) : {};
    var list = obqScreens();
    var rows = list.map(function(sc, i){
      if(!sc.id) return "";
      var answer = obqAnswerLabel(sc);
      return '<button class="prof-row" data-screen="'+i+'">'+
        '<span><span class="prof-q">'+escapeHtml(sc.title)+'</span>'+
        '<span class="prof-a'+(answer ? "" : " empty")+'">'+escapeHtml(answer || "Pas encore répondu")+'</span></span>'+
        obqChevronIcon()+
      '</button>';
    }).join("");

    var el = document.createElement("div");
    el.className = "account-sheet";
    el.id = "profile-sheet";
    el.innerHTML = '<div class="account-sheet-box">'+
      '<div class="account-email">Mon profil</div>'+
      '<div class="prof-sub">Ce que ton IA sait de toi. Touche une réponse pour la modifier.</div>'+
      '<div class="prof-list">'+rows+'</div>'+
      '<div class="account-actions">'+
        '<button class="btn" id="profile-redo-btn">Refaire le questionnaire</button>'+
        '<button class="btn" id="profile-close-btn">Fermer</button>'+
      '</div>'+
    '</div>';
    document.body.appendChild(el);

    el.addEventListener("click", function(e){
      if(e.target === el){ el.remove(); return; }
      if(e.target.closest("#profile-close-btn")){ el.remove(); return; }
      if(e.target.closest("#profile-redo-btn")){ el.remove(); openQuestionnaire(0, openProfileSheet); return; }
      var row = e.target.closest("[data-screen]");
      if(row){
        var idx = parseInt(row.getAttribute("data-screen"), 10) || 0;
        el.remove();
        openQuestionnaire(idx, openProfileSheet);
      }
    });
  }

  function loadSession(){
    try{
      var raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveSession(s){
    session = s;
    if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
    else localStorage.removeItem(SESSION_KEY);
  }
  function sessionFromTokenResponse(data){
    if(!data || !data.access_token) return null;
    return {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      // 60 s de marge pour ne jamais envoyer un jeton qui expire en vol
      expires_at: Date.now() + ((data.expires_in || 3600) - 60) * 1000,
      user: data.user || null
    };
  }

  function supaFetch(path, opts){
    opts = opts || {};
    return fetch(supa.url + path, {
      method: opts.method || "POST",
      headers: {"Content-Type":"application/json", "apikey": supa.anon},
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  }

  function refreshSession(){
    if(!session || !session.refresh_token) return Promise.resolve(null);
    return supaFetch("/auth/v1/token?grant_type=refresh_token", {
      body: {refresh_token: session.refresh_token}
    }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        var s = sessionFromTokenResponse(data);
        saveSession(s);
        return s;
      }).catch(function(){ return null; });
  }

  // Garantit un jeton valide avant chaque appel API.
  function ensureToken(){
    if(!session) return Promise.resolve(null);
    if(Date.now() < session.expires_at) return Promise.resolve(session.access_token);
    return refreshSession().then(function(s){ return s ? s.access_token : null; });
  }

  // Remplace fetch() pour tous les appels /api/* : injecte le jeton et
  // déconnecte proprement si le serveur répond 401.
  function apiFetch(url, opts){
    opts = opts || {};
    return ensureToken().then(function(token){
      if(!token) return Promise.reject(new Error("no-session"));
      var headers = {};
      var k;
      if(opts.headers) for(k in opts.headers) headers[k] = opts.headers[k];
      headers["Authorization"] = "Bearer " + token;
      var next = {headers: headers};
      for(k in opts) if(k !== "headers") next[k] = opts[k];
      return fetch(url, next);
    }).then(function(res){
      if(res.status === 401){ signOut(); return Promise.reject(new Error("unauthorized")); }
      return res;
    });
  }

  function authErrorMessage(data, status){
    var raw = (data && (data.error_description || data.msg || data.error || data.message)) || "";
    var s = String(raw).toLowerCase();
    if(s.indexOf("invalid login") >= 0 || s.indexOf("invalid credentials") >= 0)
      return "Email ou mot de passe incorrect.";
    if(s.indexOf("already registered") >= 0 || s.indexOf("already been registered") >= 0)
      return "Un compte existe déjà avec cet email. Connecte-toi.";
    if(s.indexOf("password") >= 0 && s.indexOf("6") >= 0)
      return "Le mot de passe doit faire au moins 6 caractères.";
    if(s.indexOf("email not confirmed") >= 0)
      return "Confirme ton email avant de te connecter — vérifie ta boîte de réception.";
    if(s.indexOf("rate limit") >= 0 || status === 429)
      return "Trop de tentatives. Réessaie dans une minute.";
    if(s.indexOf("unable to validate email") >= 0 || s.indexOf("invalid email") >= 0)
      return "Adresse email invalide.";
    return raw || "Une erreur est survenue. Réessaie.";
  }

  function performEmailAuth(email, password){
    if(authBusy) return;
    email = String(email||"").trim();
    if(!email || !password){
      authError = "Renseigne ton email et ton mot de passe."; renderAuth(); return;
    }
    if(authMode === "signup" && password.length < 6){
      authError = "Le mot de passe doit faire au moins 6 caractères."; renderAuth(); return;
    }
    authBusy = true; authError = ""; authInfo = ""; renderAuth();

    var path = authMode === "signup" ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password";
    supaFetch(path, {body: {email: email, password: password}})
      .then(function(res){
        return res.json().then(function(data){ return {ok: res.ok, status: res.status, data: data}; });
      })
      .then(function(r){
        authBusy = false;
        if(!r.ok){ authError = authErrorMessage(r.data, r.status); renderAuth(); return; }

        var s = sessionFromTokenResponse(r.data);
        if(!s){
          // Signup sans jeton : Supabase exige une confirmation par email.
          authMode = "login";
          authInfo = "Compte créé. Ouvre le lien de confirmation reçu par email, puis connecte-toi.";
          renderAuth();
          return;
        }
        saveSession(s);
        bootAfterAuth();
      })
      .catch(function(){
        authBusy = false;
        authError = "Connexion au serveur impossible. Vérifie ta connexion internet.";
        renderAuth();
      });
  }

  // Vrai uniquement dans la coquille Capacitor (Android/iOS) — jamais sur le web.
  function isNativePlatform(){
    return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  }

  function performOAuth(provider){
    if(!supa.url) return;
    // Google (et Apple) refusent de s'authentifier dans une WebView embarquée :
    // dans l'app native, on ouvre donc le navigateur externe (onglet, pas la
    // WebView de l'app) et on récupère la main via le schéma dédié
    // com.dropit.app://auth-callback une fois connecté — voir setupNativeAuthCallback().
    // (Migration prévue vers un App Link https vérifié — voir AUDIT.md 2.1 —
    // mise de côté pour l'instant : elle exige un keystore Android stable et
    // une mise à jour de la liste blanche des redirect URLs Supabase, pas
    // encore faites. Ne pas changer cette valeur sans les deux à la fois.)
    var redirect = isNativePlatform()
      ? "com.dropit.app://auth-callback"
      : window.location.origin + window.location.pathname;
    var url = supa.url + "/auth/v1/authorize?provider=" + provider +
      "&redirect_to=" + encodeURIComponent(redirect);
    if(isNativePlatform() && window.Capacitor.Plugins.Browser){
      window.Capacitor.Plugins.Browser.open({url: url});
    } else {
      window.location.href = url;
    }
  }

  // Le retour du navigateur externe arrive ici (voir l'intent-filter du schéma
  // com.dropit.app dans AndroidManifest.xml), jamais via window.location.hash
  // comme sur le web — d'où ce point d'entrée séparé.
  function setupNativeAuthCallback(){
    if(!isNativePlatform() || !window.Capacitor.Plugins.App) return;
    window.Capacitor.Plugins.App.addListener("appUrlOpen", function(data){
      var url = (data && data.url) || "";
      var hashIdx = url.indexOf("#");
      var hash = hashIdx >= 0 ? url.slice(hashIdx) : "";
      if(window.Capacitor.Plugins.Browser){
        window.Capacitor.Plugins.Browser.close().catch(function(){});
      }
      var result = consumeOAuthHash(hash);
      if(result === "recovery"){ renderAuth(); return; }
      if(result === true){ bootAfterAuth(); return; }
      renderAuth();
    });
  }

  function performPasswordReset(email){
    if(authBusy) return;
    email = String(email||"").trim();
    if(!email){ authError = "Renseigne ton email."; renderAuth(); return; }
    authBusy = true; authError = ""; authInfo = ""; renderAuth();
    supaFetch("/auth/v1/recover", {
      body: {email: email, redirect_to: window.location.origin + window.location.pathname}
    }).then(function(){
      authBusy = false; authMode = "login";
      authInfo = "Si un compte existe pour cet email, un lien de réinitialisation vient d'être envoyé.";
      renderAuth();
    }).catch(function(){
      authBusy = false; authError = "Envoi impossible. Réessaie."; renderAuth();
    });
  }

  function signOut(){
    var token = session && session.access_token;
    if(token && supa.url){
      fetch(supa.url + "/auth/v1/logout", {
        method: "POST",
        headers: {"apikey": supa.anon, "Authorization": "Bearer " + token}
      }).catch(function(){});
    }
    saveSession(null);
    state = {projects: [], dropZone: []};
    currentProjectId = null; expandedCategoryId = null;
    taskListOpen = false; accountSheetOpen = false; projectMenuOpen = false;
    chatState = {}; tlSelectedProjects = []; tlScopedToProject = false;
    tlCategoryFilter = null; tlPriorityFilter = 'all';
    dropSheetOpen = false;
    authMode = "login"; authError = ""; authInfo = "";
    renderAuth();
  }

  var recoverySession = null; // session tirée du lien "mot de passe oublié", en attente du nouveau mot de passe

  // Lit un fragment "#access_token=..." (peu importe sa provenance — barre
  // d'adresse web ou URL de retour du schéma natif com.dropit.app) et pose
  // la session. Le lien de réinitialisation renvoie type=recovery : dans ce
  // cas il ne faut PAS connecter directement l'utilisateur (bug précédent),
  // mais lui faire choisir un nouveau mot de passe avant d'entrer dans l'app.
  function consumeOAuthHash(hash){
    if(hash.indexOf("access_token=") < 0){
      if(hash.indexOf("error=") >= 0){
        var ep = new URLSearchParams(hash.slice(1));
        authError = ep.get("error_description") || "Connexion annulée.";
        return "error";
      }
      return false;
    }
    var params = new URLSearchParams(hash.slice(1));
    var isRecovery = params.get("type") === "recovery";
    var s = sessionFromTokenResponse({
      access_token: params.get("access_token"),
      refresh_token: params.get("refresh_token"),
      expires_in: parseInt(params.get("expires_in") || "3600", 10)
    });
    if(!s) return false;
    if(isRecovery){
      recoverySession = s;
      authMode = "newpassword";
      return "recovery";
    }
    saveSession(s);
    return true;
  }

  // Chemin web : lit le fragment dans la barre d'adresse elle-même, puis la
  // nettoie. Le chemin natif (voir setupNativeAuthCallback) appelle
  // consumeOAuthHash() directement, sans barre d'adresse à nettoyer.
  function consumeOAuthRedirect(){
    var hash = window.location.hash || "";
    var result = consumeOAuthHash(hash);
    if(hash.indexOf("access_token=") >= 0 || hash.indexOf("error=") >= 0){
      history.replaceState(null, "", window.location.pathname);
    }
    return result === "error" ? false : result;
  }

  function performSetNewPassword(newPassword){
    if(authBusy) return;
    if(!recoverySession){ authError = "Lien expiré. Redemande une réinitialisation."; renderAuth(); return; }
    if(!newPassword || newPassword.length < 6){
      authError = "Le mot de passe doit faire au moins 6 caractères."; renderAuth(); return;
    }
    authBusy = true; authError = ""; authInfo = ""; renderAuth();
    fetch(supa.url + "/auth/v1/user", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "apikey": supa.anon,
        "Authorization": "Bearer " + recoverySession.access_token
      },
      body: JSON.stringify({password: newPassword})
    }).then(function(res){
      return res.json().then(function(data){ return {ok: res.ok, status: res.status, data: data}; });
    }).then(function(r){
      authBusy = false;
      if(!r.ok){ authError = authErrorMessage(r.data, r.status); renderAuth(); return; }
      // Le jeton de récupération devient un jeton de session valide une fois
      // le mot de passe posé : pas besoin de forcer une reconnexion.
      saveSession(recoverySession);
      recoverySession = null;
      bootAfterAuth();
      showToast("Mot de passe mis à jour");
    }).catch(function(){
      authBusy = false;
      authError = "Connexion au serveur impossible. Réessaie.";
      renderAuth();
    });
  }

  function fetchCurrentUser(){
    return ensureToken().then(function(token){
      if(!token) return null;
      return fetch(supa.url + "/auth/v1/user", {
        headers: {"apikey": supa.anon, "Authorization": "Bearer " + token}
      }).then(function(r){ return r.ok ? r.json() : null; });
    }).catch(function(){ return null; });
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function nowIso(){ return new Date().toISOString(); }
  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  function todayDateStr(){
    var d = new Date();
    return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
  }

  /* ---------- couleur de projet (design system v5) ----------
     Assignation déterministe : même id de projet = même couleur à chaque rendu,
     jamais aléatoire. Hash simple -> index 0-7 sur les 8 teintes du token set. */
  var PROJECT_COLOR_NAMES = ["terracotta","corail","ambre","emeraude","sarcelle","azur","indigo","mure"];
  function projectColorName(projectId){
    var s = String(projectId || "");
    var h = 0;
    for(var i=0; i<s.length; i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
    return PROJECT_COLOR_NAMES[h % PROJECT_COLOR_NAMES.length];
  }
  function projectColorVars(projectId){
    var name = projectColorName(projectId);
    return {
      card:      "var(--proj-"+name+"-card)",
      cardFaint: "var(--proj-"+name+"-card-faint)",
      badge:     "var(--proj-"+name+"-badge)",
      solid:     "var(--proj-"+name+"-solid)",
      priority:  "var(--proj-"+name+"-priority)",
      btn:       "var(--proj-"+name+"-btn)",
      next:      "var(--proj-"+name+"-next)",
      glass:     "var(--proj-"+name+"-glass)",
      rgb:       "var(--proj-"+name+"-rgb)",
      ink:       "var(--proj-"+name+"-ink)",
      strong:    "var(--proj-"+name+"-strong)"
    };
  }
  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  var DUE_BUCKETS = [
    {key:"1w", days:7,   label:"1 semaine"},
    {key:"2w", days:14,  label:"2 semaines"},
    {key:"1m", days:30,  label:"1 mois"},
    {key:"3m", days:90,  label:"3 mois"},
    {key:"6m", days:180, label:"6 mois"},
    {key:"1y", days:365, label:"1 an"}
  ];
  function dueBucketInfo(key){
    return DUE_BUCKETS.filter(function(b){ return b.key === key; })[0] || null;
  }
  function computeDueDate(bucketKey){
    var b = dueBucketInfo(bucketKey);
    return b ? new Date(Date.now() + b.days*86400000).toISOString() : null;
  }
  function dueBucketOrder(key){
    for(var i=0;i<DUE_BUCKETS.length;i++){ if(DUE_BUCKETS[i].key === key) return i; }
    return DUE_BUCKETS.length; // pas d'échéance définie = en dernier
  }

  function makeProject(overrides){
    var base = {
      id: uid(), title:"", emoji:"✨", icon: null, summary:"", categories:[],
      projectNotes: [], dueBucket: null, dueDate: null, photo: null,
      createdAt: nowIso(), updatedAt: nowIso()
    };
    overrides = overrides || {};
    for(var k in overrides){ base[k] = overrides[k]; }
    return base;
  }
  function makeCategory(title, itemTitles){
    return {
      id: uid(), title: String(title||"").trim() || "À faire",
      items: (itemTitles||[]).map(makeItem).filter(function(it){return it.title;}),
      catNotes: [],
      createdAt: nowIso(), updatedAt: nowIso()
    };
  }
  function makeItem(title){
    return {id: uid(), title:String(title||"").trim(), done:false, createdAt: nowIso(), notes:[]};
  }
  function normalizeItem(raw){
    var notes;
    if(Array.isArray(raw.notes)){
      notes = raw.notes.map(function(n){ return {id:n.id||uid(), text:n.text||"", createdAt:n.createdAt||nowIso()}; });
    } else if(raw.note && String(raw.note).trim()){
      notes = [{id:uid(), text:String(raw.note).trim(), createdAt:raw.createdAt||nowIso()}];
    } else {
      notes = [];
    }
    return {
      id:raw.id||uid(), title:raw.title||"", done:!!raw.done, createdAt:raw.createdAt||nowIso(),
      notes: notes
    };
  }
  function normalizeCategory(raw){
    var catNotes = Array.isArray(raw.catNotes) ? raw.catNotes.map(function(n){
      return {id:n.id||uid(), title:n.title||"", createdAt:n.createdAt||nowIso()};
    }) : [];
    return {
      id: raw.id || uid(), title: raw.title || "À faire",
      items: (raw.items||[]).map(normalizeItem),
      catNotes: catNotes,
      createdAt: raw.createdAt || nowIso(), updatedAt: raw.updatedAt || nowIso()
    };
  }
  function normalizeDropItem(raw){
    return {id: raw.id || uid(), title: raw.title || "", createdAt: raw.createdAt || nowIso()};
  }

  // Icône plate d'un projet. `emoji` reste stocké (et envoyé à l'IA comme repère) mais n'est plus
  // jamais affiché comme icône : on affiche l'icône du catalogue, choisie par l'IA (p.icon) ou,
  // pour un projet existant, déduite de son emoji. Un emoji sans équivalent tombe sur le
  // drapeau le temps que l'IA en choisisse une (voir ensureProjectIcon).
  function iconKeyForEmoji(emoji){
    var e = String(emoji || "").replace(/\uFE0F/g, "");
    if(EMOJI_TO_ICON[e]) return EMOJI_TO_ICON[e];
    // Variante à séquence (genre, couleur de peau : 🏃‍♀️) : on retente avec la base avant le joiner.
    var base = e.split("\u200D")[0];
    return EMOJI_TO_ICON[base] || null;
  }
  function projectIconKey(p){
    if(p && p.icon && ICON_CATALOG[p.icon]) return p.icon;
    return iconKeyForEmoji(p && p.emoji) || "drapeau";
  }
  function projectIconResolved(p){
    return !!(p && ((p.icon && ICON_CATALOG[p.icon]) || iconKeyForEmoji(p.emoji)));
  }
  // Rond plein à la couleur du projet, glyphe blanc. `box` = diamètre en px.
  function projectIconHtml(p, box, extraClass){
    var key = projectIconKey(p);
    return '<span class="picon'+(extraClass ? ' '+extraClass : '')+'" style="--picon-box:'+box+'px;--picon-rgb:'+projectColorVars(p.id).rgb+';--picon-ink:'+projectColorVars(p.id).ink+';--picon-strong:'+projectColorVars(p.id).strong+';" '+

  }

        id: uid(), title: "À faire",
        items: raw.steps.map(normalizeItem),
        catNotes: [],
        createdAt: raw.createdAt || nowIso(), updatedAt: raw.updatedAt || nowIso()
      }];
    } else {
      categories = [];
    }
    var projectNotes = Array.isArray(raw.projectNotes) ? raw.projectNotes.map(function(n){
      return {id:n.id||uid(), title:n.title||"", body:n.body||"", catId:n.catId||null, createdAt:n.createdAt||nowIso()};
    }) : [];
    if(!raw.projectNotes){
      categories.forEach(function(cat){
        if(cat.catNotes && cat.catNotes.length){
          cat.catNotes.forEach(function(n){
            projectNotes.push({id:n.id||uid(), title:n.title||"", body:"", catId:cat.id, createdAt:n.createdAt||nowIso()});
          });
        }
        cat.catNotes = [];
      });
    }
    var photo = normalizePhoto(raw.photo);
    return {
      id: raw.id || uid(),
      title: raw.title || "Projet",
      emoji: raw.emoji || "✨",
      summary: raw.summary || "",
      dna: raw.dna || "",
      dueBucket: raw.dueBucket || null,
      dueDate: raw.dueDate || null,
      icon: (raw.icon && ICON_CATALOG[raw.icon]) ? raw.icon : null,
      photo: photo,
      categories: categories,
      projectNotes: projectNotes,
      createdAt: raw.createdAt || nowIso(),
      updatedAt: raw.updatedAt || nowIso()
    };
  }

  // ---------- Photo engine (Chantier 8 révisé : banque Pexels, pas de génération IA) ----------
  // Taxonomie visuelle : 7 domaines fermés, chacun avec ses icônes types et des mots-clés
  // génériques. Le titre et l'icône d'un projet (exclusivement) les relient à un sujet
  // concret pour la recherche de photo ; les mots-clés du domaine ne servent que de repli
  // quand aucun sujet n'a pu être déduit. Extensible sans toucher à l'architecture : ajouter
  // une entrée suffit (ex: cuisine, bien-être...).
  var PHOTO_ICON_TAXONOMY = {
    famille: {icons:["👨‍👩‍👧","👪","❤️","🎈"], keywords:"family home warmth cozy"},
    voyage: {icons:["✈️","🧳","🌴","🗺️"], keywords:"travel vacation landscape scenic"},
    maison: {icons:["🏠","🛋️","🌿","🔧"], keywords:"home interior renovation cozy"},
    sport: {icons:["🏃","🚴","🏋️","⚽"], keywords:"fitness outdoor sport active"},
    business: {icons:["💼","📈","💰","🚀"], keywords:"business finance productivity minimal"},
    creativite: {icons:["🎨","📷","🎵","✍️"], keywords:"creative art craft inspiring"},
    apprentissage: {icons:["📚","🎓","💻","🔬"], keywords:"books study education cozy"}
  };
  // Sujet de la photo = l'OBJET que représente l'icône, dans le contexte du titre — et rien
  // d'autre (ni résumé, ni intention de départ). Les mots-clés génériques du domaine
  // (« travel vacation landscape scenic »…) ne sont PAS ajoutés devant : ils noyaient le sujet
  // et ramenaient des paysages sans rapport avec le projet. Ils ne servent que de repli.
  function cleanSubject(raw){
    return String(raw || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").trim().split(/\s+/).slice(0, 3).join(" ");
  }
  function buildPhotoQuery(result){
    var subject = cleanSubject(result && result.subject);
    if(subject) return subject;
    var domain = result && PHOTO_ICON_TAXONOMY[result.domain];
    return domain ? domain.keywords : null;
  }
  // Repli fondé sur l'icône seule (taxonomie), quand la classification n'a donné ni sujet ni
  // domaine exploitable. Comparaison sans le sélecteur de variante (U+FE0F) : « ❤️ » et « ❤ »
  // sont la même icône.
  function iconDomainQuery(emoji){
    var strip = function(e){ return String(e || "").replace(/️/g, ""); };
    var target = strip(emoji);
    var keys = Object.keys(PHOTO_ICON_TAXONOMY);
    for(var i = 0; i < keys.length; i++){
      var d = PHOTO_ICON_TAXONOMY[keys[i]];
      if(d.icons.some(function(ic){ return strip(ic) === target; })) return d.keywords;
    }
    return null;
  }
  // Une recherche par projet maximum par session : au-delà, on laisse la tuile dans son état
  // actuel (couleur + emoji) plutôt que de marteler /api/photos. Un projet sans photo est
  // retenté naturellement à la prochaine visite (cette map n'est pas persistée).
  var photoFetchAttempted = {};
  var photoSeen = {}; // projet -> identifiants Pexels déjà proposés dans cette session
  // Fait l'appel réseau sans aucune garde (utilisé aussi bien par le backfill automatique,
  // déjà gardé par l'appelant, que par regeneratePhoto() qui doit pouvoir forcer un nouvel
  // essai même si photoFetchAttempted est déjà posé).
  // `done(true|false)` (facultatif) dit si une photo a effectivement été posée : le backfill
  // automatique s'en passe (échec silencieux), le bouton "Changer la photo" en a besoin pour
  // prévenir quand rien de convenable n'a été trouvé.
  // `exclude` : identifiants Pexels à ne pas reproposer (photos déjà vues pour ce projet), pour
  // que « Changer la photo » change vraiment de photo au lieu de renvoyer toujours la première.
  function fetchProjectPhoto(p, query, done, exclude){
    query = String(query || "").trim();
    if(!p || !query){ if(done) done(false); return; }
    var url = "/api/photos?q=" + encodeURIComponent(query);
    if(exclude && exclude.length) url += "&exclude=" + exclude.join(",");
    apiFetch(url).then(function(res){
      // 404 = le serveur a cherché et rien de convenable (fond d'écran HD, en rapport avec le
      // sujet) n'existe : ce n'est pas une panne, et ça ne se réglera pas en réessayant tout de suite.
      if(res.status === 404) return {none: true};
      if(!res.ok) return Promise.reject(new Error("photo-fetch-failed"));
      return res.json();
    }).then(function(data){
      if(data && data.none){ if(done) done(false, "none"); return; }
      if(!data || !data.url){ if(done) done(false); return; }
      p.photo = {
        url: data.url, photographer: data.photographer || "", photographerUrl: data.photographerUrl || "",
        pexelsId: data.pexelsId || null, pageUrl: data.pageUrl || "", query: query, fetchedAt: nowIso()
      };
      if(data.pexelsId){
        var seen = photoSeen[p.id] || (photoSeen[p.id] = []);
        if(seen.indexOf(data.pexelsId) < 0) seen.push(data.pexelsId);
      }
      clearPhotoMiss(p);
      rememberPendingPhoto(p);
      persist();
      if(!currentProjectId) layoutHomeTreemap();
      if(done) done(true);
    }).catch(function(){
      // Échec silencieux (pas de clé Pexels encore posée, pas de résultat, réseau) :
      // le projet reste pleinement fonctionnel, la tuile garde son placeholder couleur+emoji.
      if(done) done(false);
    });
  }
  // Un seul chemin pour la création, le rattrapage des vieux projets et le bouton : la requête
  // vient toujours de l'icône et du titre, jamais du titre brut (français, donc mal compris
  // par Pexels) ni d'un texte plus long. Si la classification échoue (IA indisponible, limite
  // de débit), on ne pose PAS de photo maintenant : une photo posée sur une requête pauvre
  // ne serait jamais retentée, alors qu'un projet sans photo l'est à la prochaine visite.
  function resolvePhotoQuery(p){
    return classifyPhotoDomain(p).then(function(result){
      return buildPhotoQuery(result) || iconDomainQuery(p.emoji);
    }).catch(function(){ return null; });
  }
  /* « Aucune photo convenable » mémorisé 24 h par projet. Le filtre est strict (fond d'écran HD
     en rapport avec le sujet) : certains projets n'auront rien, et sans cette mémoire chaque
     rechargement relancerait une classification IA et une recherche Pexels pour rien, en grillant
     le quota gratuit de Pexels (200 requêtes par heure) et la limite d'appels IA. La clé inclut
     le titre et l'icône : les modifier relance une recherche tout de suite. */
  var PHOTO_MISS_TTL_MS = 24 * 3600 * 1000;
  function photoMissKey(){ return "dropit.photoMiss." + ((session && session.user && session.user.id) || "anon"); }
  function photoMissId(p){ return p.title + "|" + p.emoji; }
  function readPhotoMisses(){
    try{ var m = JSON.parse(localStorage.getItem(photoMissKey()) || "{}"); return (m && typeof m === "object") ? m : {}; }
    catch(e){ return {}; }
  }
  function writePhotoMisses(m){
    try{ if(Object.keys(m).length) localStorage.setItem(photoMissKey(), JSON.stringify(m)); else localStorage.removeItem(photoMissKey()); }
    catch(e){}
  }
  function photoMissRecent(p){
    var r = readPhotoMisses()[p.id];
    return !!(r && r.id === photoMissId(p) && (Date.now() - r.at) < PHOTO_MISS_TTL_MS);
  }
  function recordPhotoMiss(p){
    var m = readPhotoMisses();
    m[p.id] = {id: photoMissId(p), at: Date.now()};
    writePhotoMisses(m);
  }
  function clearPhotoMiss(p){
    var m = readPhotoMisses();
    if(m[p.id]){ delete m[p.id]; writePhotoMisses(m); }
  }

  /* Projet dont l'emoji n'a pas d'équivalent dans le catalogue (emoji rare, choisi avant les icônes
     plates) : l'IA choisit une icône à partir du titre et de l'emoji, une fois, et le résultat est
     sauvegardé sur le projet. En attendant, le drapeau générique s'affiche. Échec (IA indisponible,
     limite de débit) : rien n'est posé, ce sera retenté à la prochaine visite. */
  var iconFetchAttempted = {};
  function ensureProjectIcon(p){
    if(!p || projectIconResolved(p) || iconFetchAttempted[p.id]) return;
    iconFetchAttempted[p.id] = true;
    var promptText = ""+
      "Projet : \""+p.title+"\" — emoji : "+p.emoji+"\n\n"+
      "Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour : {\"icon\":\"clé\"}\n"+
      "Choisis EXACTEMENT UNE clé parmi cette liste, celle qui représente le mieux l'objet du projet : "+iconCatalogForPrompt()+".";
    apiFetch("/api/ai", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 40,
        messages: [{role:"user", content:[{type:"text", text:promptText}]}]
      })
    }).then(function(res){ return res.json(); }).then(function(data){
      var textOut = (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
      var key = JSON.parse(textOut.replace(/```json|```/g,"").trim()).icon;
      if(!key || !ICON_CATALOG[key]) return;
      p.icon = key;
      persist();
      if(!currentProjectId) layoutHomeTreemap();
    }).catch(function(){});
  }

  function ensureProjectPhoto(p){
    if(!p || p.photo || photoFetchAttempted[p.id]) return;
    photoFetchAttempted[p.id] = true;
    if(photoMissRecent(p)) return;
    resolvePhotoQuery(p).then(function(query){
      fetchProjectPhoto(p, query, function(ok, reason){
        if(!ok && reason === "none") recordPhotoMiss(p);
      });
    });
  }

  // Classification (création, rattrapage, bouton "Changer la photo") à partir du TITRE et de
  // l'ICÔNE du projet, exclusivement : ni le résumé, ni l'intention de départ. L'icône ne
  // change jamais, elle sert de référence pour que l'objet principal de la photo reste celui
  // qu'elle représente.
  function classifyPhotoDomain(p){
    var domainKeys = Object.keys(PHOTO_ICON_TAXONOMY).join("|");
    var promptText = ""+
      "Projet : \""+p.title+"\" — icône : "+p.emoji+"\n\n"+
      "Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour, sans balises markdown :\n"+
      '{"domain":"'+domainKeys+'|autre","subject":"1 à 3 mots en anglais"}'+
      "\n\nTu ne disposes QUE du titre et de l'icône : n'invente rien d'autre.\n"+
      "- \"domain\" : le domaine qui correspond à l'icône et au titre.\n"+
      "- \"subject\" : ce que la photo doit montrer, en anglais, 1 à 3 mots courants et concrets (des noms, pas d'adjectifs vagues) : "+
      "l'OBJET que représente l'icône, dans le contexte du titre. "+
      "Exemples : 🚗 + \"Vendre ma voiture\" → \"car\" ; ✈️ + \"Voyage au Japon\" → \"japan\" ; "+
      "🏋️ + \"Reprendre le sport\" → \"gym weights\" ; 🏠 + \"Rénover la cuisine\" → \"kitchen\" ; 🎂 + \"Anniversaire de Julie\" → \"birthday cake\".\n"+
      "Jamais de visage ni de portrait (aucun mot comme face/portrait/selfie/smiling/headshot) — "+
      "une silhouette, des mains, ou une forme humaine de dos ou en action restent acceptables.";

    return apiFetch("/api/ai", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 100,
        messages: [{role:"user", content:[{type:"text", text:promptText}]}]
      })
    }).then(function(res){ return res.json(); }).then(function(data){
      var textOut = (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
      var clean = textOut.replace(/```json|```/g,"").trim();
      return JSON.parse(clean);
    });
  }

  // Action manuelle "Changer la photo" (menu projet) : reclasse le projet (titre + icône)
  // puis relance la recherche avec la requête reclassée — repli silencieux sur le titre seul
  // si la classification échoue, jamais de blocage.
  // photoFetchAttempted posé tout de suite (avant tout render()) : render() relaie toujours
  // le treemap en arrière-plan même depuis l'écran projet (pour l'animation de retour), ce
  // qui pourrait sinon relancer le backfill automatique (requête = titre brut) en pleine
  // course avec la classification, et faire gagner une requête moins ciblée.
  function regeneratePhoto(p){
    if(!p) return;
    // La photo actuelle n'est plus effacée d'avance : la sélection côté serveur est stricte
    // (fond d'écran HD, sans visage, en rapport avec le sujet) et peut ne rien trouver — on
    // garderait alors un projet sans photo alors qu'il en avait une. Elle n'est remplacée que
    // si une nouvelle arrive. Les photos déjà vues pour ce projet ne sont pas reproposées.
    photoFetchAttempted[p.id] = true;
    showToast("Recherche d'une nouvelle photo…");
    var seen = (photoSeen[p.id] || []).slice();
    if(p.photo && p.photo.pexelsId && seen.indexOf(p.photo.pexelsId) < 0) seen.push(p.photo.pexelsId);
    resolvePhotoQuery(p).then(function(query){
      fetchProjectPhoto(p, query, function(ok){
        if(!ok) showToast("Aucune photo adaptée trouvée — la photo actuelle est conservée");
      }, seen.slice(-20));
    });
  }

  function allItems(p){
    var out = [];
    p.categories.forEach(function(cat){ cat.items.forEach(function(it){ out.push(it); }); });
    return out;
  }
  function progressPct(p){
    var items = allItems(p);
    if(!items.length) return 0;
    var done = items.filter(function(it){return it.done;}).length;
    return Math.round((done/items.length)*100);
  }
  function isAccompli(p){
    var items = allItems(p);
    return items.length>0 && items.every(function(it){return it.done;});
  }
  function activityStatus(p){
    if(isAccompli(p)) return "accompli";
    var days = (Date.now() - new Date(p.updatedAt).getTime()) / 86400000;
    if(days < 2) return "actif";
    if(days < 7) return "ralentit";
    return "pause";
  }
  var nextActionPreviewIndex = 0; // position dans priorityItems(p) affichée par "Prochaine action"
  var nextActionPreviewProjectId = null;
  function priorityItems(p){
    var result = [];
    for(var ci=0; ci<p.categories.length && result.length<3; ci++){
      var cat = p.categories[ci];
      for(var ii=0; ii<cat.items.length && result.length<3; ii++){
        if(!cat.items[ii].done) result.push({item:cat.items[ii], category:cat});
      }
    }
    return result;
  }
  function findItemAnywhere(p, itemId){
    for(var i=0;i<p.categories.length;i++){
      var cat = p.categories[i];
      for(var j=0;j<cat.items.length;j++){
        if(cat.items[j].id === itemId) return {category:cat, item:cat.items[j]};
      }
    }
    return null;
  }
  function findCategory(p, categoryId){
    return p.categories.filter(function(c){ return c.id === categoryId; })[0] || null;
  }
  function findProject(id){
    return state.projects.filter(function(p){ return p.id === id; })[0] || null;
  }

  /* ---------- default sample data ---------- */

  function defaultData(){
    var bali = makeProject({
      title:"Bali cet été", emoji:"🌴",
      summary:"Vous avez commencé à organiser le voyage — reste l'hébergement et le budget.",
      categories:[

        makeCategory("Budget", ["Définir le budget global"])

    });

    bali.updatedAt = nowIso();

    });
    julie.categories[0].items.forEach(function(it){ it.done = true; });

        makeCategory("Administratif", ["Changer d'adresse","Résilier les anciens contrats (eau, électricité)","Souscrire les nouveaux contrats","Prévenir l'employeur et les organismes"]),
        makeCategory("Organisation", ["Réserver un camion de déménagement","Demander de l'aide pour le jour J","Planifier l'emballage des cartons"]),
        makeCategory("Budget", ["Estimer le coût total du déménagement"])
      ]
    });
    demenagement.categories[0].items.forEach(function(it){ it.done = true; });

    return {projects: [bali, julie, demenagement], dropZone: []};
  }

  /* ---------- persistence ---------- */

  // Version de dropit_user_data sur laquelle nos modifications locales sont
  // basées : envoyée à chaque sauvegarde pour que le serveur détecte un
  // conflit multi-appareils (voir sendSaveNow) plutôt que d'écraser en silence.
  var lastKnownUpdatedAt = null;

  function load(){
    return apiFetch("/api/projects")
      .then(function(res){ return res.json(); })
      .then(function(json){
        var parsed = json.data || {};
        var dropZone = Array.isArray(parsed.dropZone) ? parsed.dropZone.map(normalizeDropItem) : [];
        var fresh = !(parsed.projects && parsed.projects.length > 0);
        lastKnownUpdatedAt = json.updatedAt || null;
        if(fresh){
          state = defaultData();
          persist();
        } else {
          state = {projects: parsed.projects.map(normalizeProject), dropZone: dropZone};
          // Une photo changée pendant une panne de sauvegarde, puis page rechargée ou compte
          // reconnecté : elle attendait dans le navigateur, on la remet et on la sauvegarde.
          if(replayPendingPhotos()) persist();
        }
        render();
        if(json.migrated) showToast("Tes projets ont été rattachés à ton compte");
        // Le parcours d'arrivée ne peut démarrer qu'ici : il faut savoir si le
        // compte est neuf, et l'appel est asynchrone.
        if(fresh) startFreshAccount(); else showOnboardingIfNeeded();
      })
      .catch(function(err){
        if(err && err.message === "unauthorized") return; // signOut a déjà pris la main
        state = defaultData();
        render();
        showOnboardingIfNeeded();
        showToast("Chargement impossible — données locales affichées");
      });
  }

  var saveTimer = null;
  var pendingSave = false;      // des changements locaux ne sont pas encore confirmés par le serveur
  var saveInFlight = false;     // une sauvegarde est en cours (une seule à la fois, voir sendSaveNow)
  var saveRetryTimer = null;
  var saveFailures = 0;         // échecs consécutifs (réseau, 429, 5xx) ; 0 = tout va bien
  var saveFailNotified = false; // un seul message par épisode d'échec, pas un par tentative
  var conflictReplayed = false; // les photos en attente n'ont été rejouées qu'une fois depuis le dernier succès

  // Un corps de requête "keepalive" (celle qui survit à la fermeture de l'onglet) est plafonné à
  // 64 Kio par les navigateurs : au-delà, fetch() échoue tout de suite ("Failed to fetch"), sans
  // jamais atteindre le serveur. Ce plafond est aussi cumulé entre toutes les requêtes keepalive
  // en vol. Un compte de 8 projets pesait déjà 67 Ko : TOUTES ses sauvegardes échouaient, pas
  // seulement celles des photos. keepalive n'est donc utilisé qu'à la fermeture de la page, et
  // seulement si le corps tient largement sous le plafond (marge pour les en-têtes).
  var KEEPALIVE_MAX_BYTES = 60000;
  var SAVE_TIMEOUT_MS = 30000;
  var SAVE_RETRY_DELAYS = [2000, 5000, 15000, 30000, 60000];

  function utf8Length(str){
    try{ return new TextEncoder().encode(str).length; }catch(e){ return str.length * 3; }
  }

  /* Photos changées mais pas encore confirmées par le serveur : gardées dans le navigateur pour
     survivre à un rechargement ou une reconnexion pendant une panne de sauvegarde, puis rejouées
     au chargement suivant. Ne concerne que la photo : c'est un champ isolé par projet, donc
     rejouable sans risque d'écraser autre chose (contrairement à un état complet). */
  function pendingPhotosKey(){
    return "dropit.pendingPhotos." + ((session && session.user && session.user.id) || "anon");
  }
  function readPendingPhotos(){
    try{
      var m = JSON.parse(localStorage.getItem(pendingPhotosKey()) || "{}");
      return (m && typeof m === "object") ? m : {};
    }catch(e){ return {}; }
  }
  function writePendingPhotos(m){
    try{
      if(Object.keys(m).length) localStorage.setItem(pendingPhotosKey(), JSON.stringify(m));
      else localStorage.removeItem(pendingPhotosKey());
    }catch(e){}
  }
  function rememberPendingPhoto(p){
    if(!p || !p.photo) return;
    var m = readPendingPhotos();
    m[p.id] = p.photo;
    writePendingPhotos(m);
  }
  // `sent` = url de photo par projet, telle qu'elle figurait dans l'état effectivement envoyé :
  // une photo changée pendant l'envoi n'est donc jamais effacée à tort de la liste en attente.
  function clearConfirmedPhotos(sent){
    var m = readPendingPhotos(), changed = false;
    Object.keys(m).forEach(function(id){
      if(m[id] && sent[id] === m[id].url){ delete m[id]; changed = true; }
    });
    if(changed) writePendingPhotos(m);
  }
  // Applique les photos en attente sur l'état tout juste chargé. Une photo plus récente déjà
  // présente sur le serveur (changée depuis un autre appareil) n'est jamais écrasée.
  function replayPendingPhotos(){
    var m = readPendingPhotos(), replayed = false;
    Object.keys(m).forEach(function(id){
      var p = state && findProject(id), pending = normalizePhoto(m[id]);
      if(!p || !pending){ delete m[id]; return; }
      if(p.photo && p.photo.url === pending.url){ delete m[id]; return; }
      if(!p.photo || String(p.photo.fetchedAt || "") < String(pending.fetchedAt || "")){
        p.photo = pending;
        replayed = true;
      }
    });
    writePendingPhotos(m);
    return replayed;
  }

  // Plusieurs mises à jour indépendantes (ex: le backfill photo de plusieurs vieux projets
  // au premier chargement de la Home, ou plusieurs onglets/appareils ouverts en même temps
  // sur le même compte) peuvent chacune déclencher leur propre persist() à quelques
  // centaines de ms d'écart : si un POST est encore en vol quand le suivant part, les deux
  // utilisent le même lastKnownUpdatedAt pas encore rafraîchi et se conflictent eux-mêmes
  // (409). D'où : une seule sauvegarde à la fois (les suivantes attendent la fin de celle en
  // cours), plusieurs tentatives sur 409, et un petit délai aléatoire avant chaque retry pour
  // que plusieurs sessions conflictées au même instant ne repartent pas exactement ensemble
  // (observé en pratique avec web + app ouverts simultanément).
  var MAX_SAVE_ATTEMPTS = 5;

  function scheduleSaveRetry(){
    clearTimeout(saveRetryTimer);
    var delay = SAVE_RETRY_DELAYS[Math.min(saveFailures - 1, SAVE_RETRY_DELAYS.length - 1)];
    saveRetryTimer = setTimeout(function(){ sendSaveNow(); }, delay);
  }

  // Fin de sauvegarde (quelle qu'en soit l'issue) : libère le verrou, et si des changements
  // sont arrivés pendant l'envoi, en lance une nouvelle.
  function finishSave(){
    saveInFlight = false;
    if(pendingSave && saveFailures === 0) persist();
  }

  function sendSaveNow(attempt, unloading){
    attempt = attempt || 0;
    if(attempt === 0 && saveInFlight && !unloading){ pendingSave = true; return; }
    clearTimeout(saveRetryTimer);
    saveInFlight = true;
    pendingSave = false;

    var sentPhotos = {};
    state.projects.forEach(function(p){ if(p.photo && p.photo.url) sentPhotos[p.id] = p.photo.url; });
    var payload = JSON.stringify({state: state, baseUpdatedAt: lastKnownUpdatedAt});
    var opts = {method: "POST", headers: {"Content-Type": "application/json"}, body: payload};
    if(unloading && utf8Length(payload) < KEEPALIVE_MAX_BYTES) opts.keepalive = true;
    // Sans délai maximal, une requête qui ne répond jamais garderait le verrou pour toujours
    // et bloquerait toutes les sauvegardes suivantes.
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timeout = ctrl ? setTimeout(function(){ ctrl.abort(); }, SAVE_TIMEOUT_MS) : null;
    if(ctrl) opts.signal = ctrl.signal;

    apiFetch("/api/projects", opts).then(function(res){
      clearTimeout(timeout);
      if(res.status === 409){
        return res.json().then(function(conflict){
          lastKnownUpdatedAt = conflict.updatedAt || null;
          if(attempt < MAX_SAVE_ATTEMPTS - 1){
            // La quasi-totalité des 409 observés en pratique viennent d'un auto-conflit
            // (ci-dessus) ou d'un autre onglet/appareil qui a sauvegardé entre-temps — pas
            // d'une vraie édition concurrente du même contenu. Plutôt que de jeter aussitôt
            // le travail local (une photo tout juste changée, par ex.) au profit de la
            // version serveur, on retente avec cette version fraîche après un court délai
            // aléatoire (200-500ms, croissant avec le nombre de tentatives). Le verrou reste
            // pris pendant l'attente : aucune autre sauvegarde ne s'intercale.
            var backoff = 200 * (attempt + 1) + Math.random() * 300;
            setTimeout(function(){ sendSaveNow(attempt + 1, unloading); }, backoff);
            return;
          }
          // Conflits répétés : conflit réel, pas de logique de fusion possible ici. Plutôt
          // que d'écraser silencieusement ce travail plus récent, on l'affiche et on prévient
          // — nos changements locaux non enregistrés sont perdus, sauf les photos, rejouées.
          var parsed = conflict.data || {};
          var dropZone = Array.isArray(parsed.dropZone) ? parsed.dropZone.map(normalizeDropItem) : [];
          state = {projects: (parsed.projects || []).map(normalizeProject), dropZone: dropZone};
          // Rejeu limité à une fois par épisode : sous un conflit qui persiste, rejouer puis
          // resauvegarder puis reconflicter en boucle saturerait la limite de débit du serveur.
          // Les photos restent alors en attente dans le navigateur pour le prochain chargement.
          var replayed = !conflictReplayed && replayPendingPhotos();
          if(replayed) conflictReplayed = true;
          render();
          showToast("Modifié sur un autre appareil — tes derniers changements n'ont pas pu être enregistrés");
          saveInFlight = false;
          if(replayed) persist();
        });
      }
      if(!res.ok){ var e = new Error("save-failed"); e.status = res.status; throw e; }
      return res.json().then(function(ok){
        lastKnownUpdatedAt = ok.updatedAt || lastKnownUpdatedAt;
        clearConfirmedPhotos(sentPhotos);
        conflictReplayed = false;
        if(saveFailures > 0){
          saveFailures = 0; saveFailNotified = false;
          showToast("Modifications enregistrées");
        }
        finishSave();
      });
    }).catch(function(err){
      clearTimeout(timeout);
      saveInFlight = false;
      if(err && err.message === "unauthorized") return;
      var status = err && err.status;
      // Réseau coupé, délai dépassé, limite de débit, panne serveur : ça passera, on réessaie
      // tout seul. Un refus définitif (400, 413…) ne se réglera pas en réessayant.
      var retryable = !status || status === 408 || status === 429 || status >= 500;
      if(!retryable){
        showToast("Enregistrement refusé par le serveur");
        return;
      }
      pendingSave = true;
      saveFailures++;
      if(!saveFailNotified){
        saveFailNotified = true;
        showToast("Enregistrement en attente — nouvelle tentative automatique");
      }
      scheduleSaveRetry();
    });
  }

  function persist(){
    pendingSave = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(sendSaveNow, 350);
  }

  // Sauvegarde immédiate, sans le debounce de 350ms : réservée aux actions rares et
  // significatives (création d'un projet) où l'utilisateur peut rafraîchir la page
  // dans la foulée — le debounce est fait pour les frappes/coches répétées, pas pour
  // laisser une fenêtre de perte sur un événement qui n'arrive qu'une fois.
  function persistNow(){
    pendingSave = true;
    clearTimeout(saveTimer);
    sendSaveNow();
  }

  // Sans ceci, une action faite dans les 350ms avant la fermeture de l'onglet
  // (ou le passage en arrière-plan sur mobile) est perdue silencieusement :
  // le debounce n'a pas eu le temps de partir. On force l'envoi immédiat dès
  // que la page devient invisible, tant qu'une sauvegarde est en attente.
  function retrySaveIfNeeded(){
    if(saveFailures > 0 || pendingSave){
      clearTimeout(saveTimer);
      sendSaveNow();
    }
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden"){
      if(pendingSave){
        clearTimeout(saveTimer);
        sendSaveNow(0, true);
      }
    } else {
      // De retour sur l'app (ou reconnecté) : on relance tout de suite ce qui était en attente
      // au lieu d'attendre la prochaine tentative programmée.
      retrySaveIfNeeded();
    }
  });
  window.addEventListener("online", retrySaveIfNeeded);
  window.addEventListener("pagehide", function(){
    if(pendingSave){
      clearTimeout(saveTimer);
      sendSaveNow(0, true);
    }
  });

  /* ---------- treemap math (squarify) ---------- */

  function squarify(items, x, y, w, h, result){
    if(items.length === 0) return;
    if(items.length === 1){ result.push({item:items[0], x:x, y:y, w:w, h:h}); return; }
    function worstRatio(rowValues, length){
      var sum=0, max=-Infinity, min=Infinity;
      rowValues.forEach(function(v){ sum+=v; if(v>max)max=v; if(v<min)min=v; });
      var sq=length*length, sumsq=sum*sum;
      return Math.max((sq*max)/sumsq, sumsq/(sq*min));
    }
    var vertical = w >= h;
    var length = vertical ? h : w;
    var row = [items[0]]; var i=1;
    while(i<items.length){
      var testRow = row.concat([items[i]]);
      var cw = worstRatio(row.map(function(r){return r.value;}), length);
      var tw = worstRatio(testRow.map(function(r){return r.value;}), length);
      if(tw <= cw){ row = testRow; i++; } else break;
    }
    var sum = row.reduce(function(a,b){return a+b.value;},0);
    var thickness = sum/length; var offset=0;
    row.forEach(function(it){
      var len = it.value/thickness;
      if(vertical){ result.push({item:it, x:x, y:y+offset, w:thickness, h:len}); }
      else { result.push({item:it, x:x+offset, y:y, w:len, h:thickness}); }
      offset += len;
    });
    var remaining = items.slice(row.length);
    if(remaining.length){
      if(vertical) squarify(remaining, x+thickness, y, w-thickness, h, result);
      else squarify(remaining, x, y+thickness, w, h-thickness, result);
    }
  }
  function computeTreemap(rawItems, W, H){
    var items = rawItems.slice().sort(function(a,b){return b.value-a.value;});
    var total = items.reduce(function(a,b){return a+b.value;},0) || 1;
    var scale = (W*H)/total;
    items.forEach(function(it){ it.value = it.value*scale; });
    var result = [];
    squarify(items, 0, 0, W, H, result);
    return result;
  }
  function sizeClassFor(w,h){
    var area = w*h;
    if(area < 8500 || w < 80 || h < 62) return "size-tiny";
    // Tuile basse (large mais peu haute) : la disposition complète (icône + titre sur 2 lignes +
    // barre de progression, ~120 px avec les marges) n'y tient pas et l'icône était rognée en haut.
    if(h < 124) return "size-flat";
    if(area < 20000) return "size-small";
    if(area < 42000) return "size-medium";
    return "size-large";
  }
  var _titleMeasureCtx = null;
  function measuredTextWidth(text, fontPx){
    if(!_titleMeasureCtx) _titleMeasureCtx = document.createElement("canvas").getContext("2d");
    _titleMeasureCtx.font = "700 " + fontPx + "px " + "-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif";
    return _titleMeasureCtx.measureText(text).width;
  }
  // Simule le retour à la ligne par mot (comme le fait réellement le navigateur) pour
  // savoir combien de lignes le titre occupe à une taille de police donnée — plus fiable
  // qu'un ratio largeur-totale/nombre-de-lignes, qui suppose un remplissage parfait alors
  // que le découpage par mot laisse toujours un peu de place perdue en fin de ligne.
  function linesNeededAt(text, fontPx, availableWidth){
    var words = text.split(/\s+/).filter(Boolean);
    if(!words.length) return 0;
    var spaceWidth = measuredTextWidth(" ", fontPx);
    var lines = 1, currentWidth = -1, tooWide = false;
    words.forEach(function(word){
      var wWidth = measuredTextWidth(word, fontPx);
      // Un mot à lui seul plus large que la largeur dispo serait coupé en plein milieu
      // (overflow-wrap:break-word sur .tile-title) : « Reprendr / e le sport ». On refuse ce
      // découpage tant que la police peut encore diminuer : titleFontSizeFor la réduit jusqu'à
      // ce que le mot tienne entier sur une ligne. Ce n'est qu'à la taille plancher (8 px), où
      // on ne peut plus rien réduire, qu'on compte le nombre de morceaux du mot coupé.
      if(wWidth > availableWidth){
        if(fontPx > 8){ tooWide = true; return; }
        if(currentWidth > 0) lines++;
        var chunks = Math.ceil(wWidth / availableWidth);
        lines += chunks - 1;
        currentWidth = wWidth - (chunks-1)*availableWidth;
        return;
      }
      if(currentWidth < 0){
        currentWidth = wWidth;
      } else if(currentWidth + spaceWidth + wWidth <= availableWidth){
        currentWidth += spaceWidth + wWidth;
      } else {
        lines++;
        currentWidth = wWidth;
      }
    });
    return tooWide ? Infinity : lines;
  }
  // Nombre de lignes du titre selon la place en hauteur : 1 sur les tuiles minuscules et sur les
  // tuiles basses (moins de 108 px), 2 dès que la hauteur le permet. Partagé par le calcul de la
  // police et par la coupure CSS (-webkit-line-clamp posé en ligne) pour qu'ils restent d'accord.
  // Diamètre du rond d'icône d'une tuile : proportionnel à sa taille (le plus petit des deux
  // côtés), et non plus par paliers. 34 % du petit côté quand l'icône est le visuel principal,
  // 24 % quand c'est un badge de coin sur une photo ; bornes pour rester lisible sur les
  // petites tuiles et tenir dans la hauteur sur les tuiles basses. Le glyphe occupe 58 % du rond.
  function iconBoxFor(w,h,hasPhoto,cls){
    var compact = cls === "size-tiny" || cls === "size-flat";
    var k = hasPhoto ? 0.24 : 0.34;
    var lo = compact ? 22 : (hasPhoto ? 20 : 26);
    var hi = compact ? 34 : (hasPhoto ? 38 : 52);
    return Math.max(lo, Math.min(hi, Math.round(Math.min(w,h) * k)));
  }
  function titleMaxLinesFor(w,h){
    var cls = sizeClassFor(w,h);
    if(cls === "size-tiny") return 1;
    if(cls === "size-flat" && h < 108) return 1;
    return 2;
  }
  function titleFontSizeFor(w,h,title,hasPhoto){
    var s = Math.sqrt(w*h);
    var fs = 11 + (s-70) * (22-11) / (547-70);
    fs = Math.max(11, Math.min(22, fs));
    // La taille ci-dessus est un plafond lisible pour la tuile, pas une garantie que le
    // titre tienne sur 2 lignes sans être coupé (le "…" du -webkit-line-clamp). On réduit
    // au besoin jusqu'à ce que le titre tienne réellement, jamais en dessous d'un plancher
    // de lisibilité — simulation réelle du retour à la ligne (Canvas measureText mot par
    // mot) plutôt qu'une estimation globale : la police est en gras et contient des
    // caractères accentués, dont la largeur varie trop pour qu'un simple ratio fixe reste
    // fiable dans tous les cas.
    var text = String(title || "");
    if(text.length > 0){
      var cls = sizeClassFor(w,h);
      var isTiny = cls === "size-tiny" || cls === "size-flat"; // marges réduites
      // Tuile "tiny" : reste à 1 ligne (l'icône seule y occupe déjà presque toute la
      // hauteur disponible, 2 lignes déborderaient) ; les autres tailles ont la place
      // pour 2 lignes, cf. -webkit-line-clamp:2 sur .tile-title.
      var maxLines = titleMaxLinesFor(w,h);
      // Marge horizontale réelle entre le bord de la tuile et le texte : le padding de
      // .tile-body (8/14px) et, en mode photo, celui du "chip" de titre (3px 8px sur
      // .tile.has-photo .tile-title) — absent sans photo, donc compté seulement si la
      // tuile en a une (sinon on rétrécit le texte pour rien).
      var bodyPadding = isTiny ? 8 : 14;
      // Puce du titre sur photo : 8 px de chaque côté (.tile.has-photo .tile-title).
      var chipPadding = hasPhoto ? 8 : 0;
      var padding = bodyPadding + chipPadding;
      var availableWidth = Math.max(20, w - padding*2);
      while(fs > 8 && linesNeededAt(text, fs, availableWidth) > maxLines){
        fs -= 0.5;
      }
      fs = Math.max(8, fs);
    }
    return Math.round(fs * 10) / 10;
  }
