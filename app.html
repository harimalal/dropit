<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover : sans lui, env(safe-area-inset-*) vaut toujours 0 —
     nécessaire pour que la barre de navigation du bas (et la barre de saisie
     juste au-dessus) réservent correctement la place de la barre de gestes
     système (SDK 36 = rendu edge-to-edge imposé par Android). N'affecte pas
     la position des boutons compte/menu du haut, laissés tels quels. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dropit</title>
<style>
  :root{
    /* Neutres — fond neutre très clair (v13, analyse directe de l'image de référence : ni blanc pur, ni beige) */
    --canvas:#F8F8F9;
    --canvas-card:#FFFFFF;
    --ink:#2B2420;
    --ink-soft:#7A7168;
    --ink-faint:#A79E93;
    --line:#EFEBE6;
    --grid-line:rgba(43,36,32,0.035);
    --tabbar-h:58px; /* hauteur de la barre de navigation fixe (accueil/liste/chat/calendrier) */

    /* Chrome — boutons génériques, top bars, écrans auth (inchangé) */
    --accent:#BF5B44;
    --accent-soft:#F3E2DC;

    /* Chrome IA — barres de saisie IA uniquement (accueil, catégorie/tâches/projet, task list) */
    --ia-accent:#3F8A5C;
    --ia-accent-soft:#E3EFE6;

    /* Statut — porte l'anneau du treemap, indépendant de la couleur de projet */
    --status-actif:#3F8A5C;
    --status-actif-soft:#E3EFE6;
    --status-ralentit:#C48A2E;
    --status-ralentit-soft:#F5EBD8;
    --status-pause:#A79E93;
    --status-pause-soft:#EFEAE3;
    --status-accompli:#BF5B44;
    --status-accompli-soft:#F3E2DC;

    /* Projet — 8 teintes, une base par teinte → voile 15% (carte, recalibré v13 sur la référence) + voile 20% (badge plat) + solide (checkbox) */
    /* Voile du badge abaissé de 28% à 20% : le texte du badge est toujours la teinte pleine
       (--proj-*-solid) posée dessus, un fond plus pâle creuse donc l'écart de contraste. */
    --proj-terracotta-card:#FAE8E4; --proj-terracotta-badge:#F8E0DB; --proj-terracotta-solid:#D25C41;
    --proj-corail-card:#FAE4E9;     --proj-corail-badge:#F8DBE2;     --proj-corail-solid:#D24165;
    --proj-ambre-card:#FAF1E4;      --proj-ambre-badge:#F8ECDB;      --proj-ambre-solid:#C6872F;
    --proj-emeraude-card:#E4FAF1;   --proj-emeraude-badge:#DBF8EC;   --proj-emeraude-solid:#27A571;
    --proj-sarcelle-card:#E4FAFA;   --proj-sarcelle-badge:#DBF8F8;   --proj-sarcelle-solid:#26A1A1;
    --proj-azur-card:#E4F1FA;       --proj-azur-badge:#DBECF8;       --proj-azur-solid:#4196D2;
    --proj-indigo-card:#E6E4FA;     --proj-indigo-badge:#DDDBF8;     --proj-indigo-solid:#4D41D2;
    --proj-mure-card:#F4E4FA;       --proj-mure-badge:#F1DBF8;       --proj-mure-solid:#AE41D2;

    /* Composantes RGB des teintes pleines ci-dessus : servent partout où il faut la teinte à une
       opacité donnée (overlay des titres, rond des icônes), qu'un hex ne permet pas.
       À garder alignées sur les solides — aucun mécanisme ne le vérifie aujourd'hui. */
    --proj-terracotta-rgb:210,92,65;  --proj-corail-rgb:210,65,101;  --proj-ambre-rgb:198,135,47;
    --proj-emeraude-rgb:39,165,113;   --proj-sarcelle-rgb:38,161,161; --proj-azur-rgb:65,150,210;
    --proj-indigo-rgb:77,65,210;      --proj-mure-rgb:174,65,210;

    /* Glyphe des icônes de projet sur surface claire : la teinte pleine assombrie (x 0,55). Le rond
       d'icône n'étant qu'à 40 % d'opacité, un glyphe blanc n'y atteindrait que 1,6 à 2,3:1 ; celui-ci
       donne 4,64:1 au pire des 8 teintes (calc-contraste.js du livrable). À garder aligné sur les solides. */
    --proj-terracotta-ink:#743324; --proj-corail-ink:#742438; --proj-ambre-ink:#6D4A1A; --proj-emeraude-ink:#155B3E;
    --proj-sarcelle-ink:#155959; --proj-azur-ink:#245274; --proj-indigo-ink:#2A2474; --proj-mure-ink:#602474;

    /* Glyphe coloré des icônes de projet dans les fenêtres autres que l'accueil : la teinte
       pleine assombrie de 25 % (x 0,75). Sur le rond pâle (18 %), 4,01:1 au pire des 8 teintes
       (ambre), alors que la teinte pleine non assombrie n'y donnerait que 2,4:1. */
    --proj-terracotta-strong:#9E4531; --proj-corail-strong:#9E314C; --proj-ambre-strong:#946523; --proj-emeraude-strong:#1D7C55;
    --proj-sarcelle-strong:#1C7979; --proj-azur-strong:#31709E; --proj-indigo-strong:#3A319E; --proj-mure-strong:#82319E;

    /* Badge "effet verre" — voile translucide (alpha 0.40) + reflet en dégradé, SANS backdrop-filter
       (le flou d'arrière-plan produisait un halo gris-beige aux coins arrondis — bug de rendu connu).
       Abaissé de 0.55 à 0.40 : sur une tuile photo le voile trop dense écrasait le texte blanc
       du titre, qui s'appuie maintenant sur le scrim + une ombre portée plutôt que sur la teinte. */
    --proj-terracotta-glass:rgba(221,102,75,0.40); --proj-corail-glass:rgba(221,75,111,0.40); --proj-ambre-glass:rgba(221,160,75,0.40);
    --proj-emeraude-glass:rgba(75,221,160,0.40);   --proj-sarcelle-glass:rgba(75,221,221,0.40); --proj-azur-glass:rgba(75,160,221,0.40);
    --proj-indigo-glass:rgba(87,75,221,0.40);      --proj-mure-glass:rgba(184,75,221,0.40);

    /* Voile carte de CATÉGORIE spécifiquement — 6% (recalibré, était trop pâle à 1.5%) */
    --proj-terracotta-card-faint:#FDF6F4; --proj-corail-card-faint:#FDF4F6; --proj-ambre-card-faint:#FDF9F4;
    --proj-emeraude-card-faint:#F4FDF9;   --proj-sarcelle-card-faint:#F4FDFD; --proj-azur-card-faint:#F4F9FD;
    --proj-indigo-card-faint:#F5F4FD;     --proj-mure-card-faint:#FBF4FD;

    /* Voile TÂCHES PRIORITAIRES — 10% (encore 50% plus léger que le 20% précédent) */
    --proj-terracotta-priority:#FCF0ED; --proj-corail-priority:#FCEDF1; --proj-ambre-priority:#FCF6ED;
    --proj-emeraude-priority:#EDFCF6;   --proj-sarcelle-priority:#EDFCFC; --proj-azur-priority:#EDF6FC;
    --proj-indigo-priority:#EEEDFC;     --proj-mure-priority:#F8EDFC;

    /* Voile PROCHAINE ACTION — 14% (encore 50% plus léger que le 28% du badge, réutilisé jusqu'ici) */
    --proj-terracotta-next:#FAEAE6; --proj-corail-next:#FAE6EB; --proj-ambre-next:#FAF2E6;
    --proj-emeraude-next:#E6FAF2;   --proj-sarcelle-next:#E6FAFA; --proj-azur-next:#E6F2FA;
    --proj-indigo-next:#E7E6FA;     --proj-mure-next:#F5E6FA;

    /* Voile bouton "C'est fait" — 50% (texte passe en --ink, le blanc n'y tient plus le contraste) */
    --proj-terracotta-btn:#E8AEA0; --proj-corail-btn:#E8A0B2; --proj-ambre-btn:#E2C397;
    --proj-emeraude-btn:#93D2B8;   --proj-sarcelle-btn:#92D0D0; --proj-azur-btn:#A0CAE8;
    --proj-indigo-btn:#A6A0E8;     --proj-mure-btn:#D6A0E8;

    /* Rayons */
    --radius:12px;
    --radius-lg:18px;
    --radius-sm:10px;

    /* Relief léger (v5) */
    --shadow-card:0 2px 10px rgba(43,36,32,.07);

    /* Violet de la Drop Zone — repris de la landing, propre à cette identité (pas une
       des 8 teintes de projet, qui sont assignées automatiquement). */
    --dropzone-violet:#5B3FE8;

    /* Rouge de notification (point et pastille du bouton Drop it) : un vrai rouge, distinct de la
       terracotta d'accent de l'app, pour qu'une notification se lise comme telle. Assombri pour
       tenir 4,5:1 avec le texte blanc de la pastille. */
    --notif-red:#D42A20;

    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  /* Dans une WebView Android standalone (app installée / PWA), le "font boosting"
     du navigateur grossit automatiquement les textes (et tout ce qui suit, en
     cascade) au-delà des tailles réellement demandées en CSS — absent d'un
     onglet Chrome classique, d'où l'écart avec la version web. */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:var(--font-display);color:var(--ink);background-color:var(--canvas);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:26px 26px;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .btn{
    border:1px solid var(--line);background:var(--canvas-card);border-radius:10px;padding:9px 15px;
    font-size:13.5px;font-weight:600;color:var(--ink);transition:background .12s ease, border-color .12s ease;
  }
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#A34936;}
  .btn-ghost{border-color:transparent;background:transparent;padding:9px 10px;}
  .btn-ghost:hover{background:var(--accent-soft);}
  .btn-danger{color:#9C4632;}

  /* HOME TREEMAP — design system v5 */
  .home-container{position:fixed;inset:0;background:var(--canvas);overflow:hidden;display:flex;flex-direction:column;}
  .home-greeting{
    flex-shrink:0;padding:calc(16px + var(--safe-area-inset-top, env(safe-area-inset-top))) 20px 8px;
    font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--ink);
  }
  #home-treemap-zone{flex:1;position:relative;min-height:0;overflow:hidden;}
  .home-treemap-inner{position:relative;width:100%;}
  /* Plus d'anneau conic-gradient autour de la tuile : la progression est désormais lue sur
     une vraie barre sous le titre (.tile-progress), plus explicite qu'un arc à décoder. */
  .tile{
    position:absolute;border-radius:var(--radius-lg);box-sizing:border-box;
  }
  @media (prefers-reduced-motion:no-preference){.tile{transition:filter .12s ease;}}
  .tile:hover{filter:brightness(0.98);}
  /* Projet accompli : rendu plus transparent que les autres pour signaler visuellement
     qu'il est terminé, sans le retirer de la mosaïque. */
  .tile.is-done{opacity:.55;}
  .tile-body{
    height:100%;width:100%;border-radius:16px;background:var(--tile-card-bg,var(--canvas-card));
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    overflow:hidden;padding:14px;box-shadow:var(--shadow-card);
    position:relative;
  }
  /* Photo = visuel principal de la tuile, sur son propre calque (derrière le scrim et le
     contenu) : le filtre de tonalité ne s'applique qu'à elle, jamais à l'icône ou au titre.
     saturate/sepia légers pour que des photos de sources très différentes gardent un rendu
     chaud et cohérent d'une tuile à l'autre, plutôt que de juxtaposer des teintes qui jurent. */
  .tile-photo{
    position:absolute;inset:0;border-radius:16px;background-size:cover;background-position:center;
    filter:saturate(.82) sepia(.1) contrast(1.03);
  }
  /* Voile du bas de tuile : c'est lui qui rend le titre blanc lisible sur une photo claire.
     Il ne couvre pas le coin de l'icône (il n'y a plus de halo sous elle, retiré à la demande). */
  .tile-scrim{
    position:absolute;inset:0;border-radius:16px;pointer-events:none;z-index:0;
    background:linear-gradient(180deg, rgba(20,14,10,0) 42%, rgba(20,14,10,.6) 100%);
  }
  .tile.has-photo .tile-body{align-items:flex-start;justify-content:flex-end;text-align:left;}
  /* Overlay du titre sur photo : un aplat uni (aucun dégradé) de la teinte du projet, à 22 %
     d'opacité, dans un rectangle aux coins arrondis de 10 px. C'est la puce d'origine, revenue
     après l'essai en dégradé, mais beaucoup plus transparente (40 % avant) et sans son reflet
     de verre : ce reflet éclaircissait le fond derrière le texte blanc, et l'ancienne version
     tombait à 1,4-2,1:1 au pire. Contraste du texte blanc, au pire des 8 teintes : 5,4:1 sur une
     photo grise, 9,7:1 sur une photo sombre (calcul dans le README du livrable) ; seule une photo
     entièrement blanche, cas irréaliste, reste faible (2,2:1). Ombre de texte légère.
     Aucun padding vertical, la respiration vient de line-height : avec un padding haut/bas,
     -webkit-line-clamp coupe au bord de la boîte de padding et laisse dépasser une lichette de
     la ligne suivante. */
  .tile.has-photo .tile-title{
    position:relative;z-index:1;color:#fff;
    padding:0 8px;line-height:1.55;border-radius:var(--radius-sm);
    background:rgba(var(--tile-rgb),.22);
    width:fit-content;max-width:100%;box-decoration-break:clone;-webkit-box-decoration-break:clone;
    text-shadow:0 1px 2px rgba(20,14,10,.35);
  }
  /* Icône plate d'un projet, sans contour ni ombre. Style par défaut = fenêtres autres que
     l'accueil (liste, filtres, fenêtre projet) : rond pâle (18 % de la teinte du projet) et glyphe
     coloré et gras — 66 % du rond, teinte assombrie de 25 %, plus un contour de même couleur qui
     épaissit ce tracé plein. Diamètre posé en ligne. Les tuiles de l'accueil ont leur propre
     style, plus bas (rond à 40 %, proportionnel à la tuile). */
  .picon{
    width:var(--picon-box,32px);height:var(--picon-box,32px);flex-shrink:0;border-radius:50%;
    background:rgba(var(--picon-rgb,176,78,56),.18);
    display:inline-flex;align-items:center;justify-content:center;
  }
  .picon svg{
    width:66%;height:66%;
    fill:var(--picon-strong,#8a3b2b);stroke:var(--picon-strong,#8a3b2b);stroke-width:1;stroke-linejoin:round;
  }
  /* Tuiles de l'accueil : rond à 40 % d'opacité (60 % de transparence), glyphe en teinte foncée
     du projet — un glyphe blanc sur un rond aussi léger n'y serait pas lisible sur les cartes
     claires (1,6 à 2,3:1). Diamètre proportionnel à la taille de la tuile. */
  .tile .picon{background:rgba(var(--picon-rgb,176,78,56),.40);margin-bottom:0;}
  .tile .picon svg{width:58%;height:58%;fill:var(--picon-ink,#5a2a1e);stroke:none;}
  /* Sur une photo : glyphe blanc, sans halo ni contour ni ombre (retirés à la demande). Le
     rond à 40 % porte donc seul le contraste du glyphe : sur une photo très claire, il est
     faible. Calcul de contraste dans le README du livrable. */
  .tile.has-photo .picon{position:absolute;top:var(--picon-off,8px);right:var(--picon-off,8px);z-index:2;}
  .tile.has-photo .picon svg{fill:#fff;stroke:none;}
  .tile-title{font-weight:700;letter-spacing:-0.01em;line-height:1.25;color:var(--ink);margin-top:8px;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
    width:100%;word-break:break-word;overflow-wrap:break-word;
    /* Sans ça, le rétrécissement flex par défaut (.tile-body est display:flex) écrase le
       titre bien en dessous de ses 2 lignes autorisées dès que le contenu total de la tuile
       est un peu juste — le clamp ne servait plus à rien, le texte était coupé bien avant.
       flex-shrink:0 force le titre à garder sa hauteur voulue ; c'est titleFontSizeFor() qui
       est responsable d'éviter le débordement, pas le rétrécissement flex. */
    flex-shrink:0;}
  /* Progression de la tuile : barre + pourcentage + chevron, tous sur la même ligne sous
     le titre. La barre est posée sur du blanc opaque pour qu'un voile translucide reste
     lisible aussi bien sur une carte pâle que sur une photo.
     ATTENTION : elle utilise --proj-*-glass, dont les composantes ne sont PAS celles de
     --proj-*-solid (glass est une teinte plus claire, héritée de l'ancien badge « effet
     verre »). Elle ne reprend donc pas exactement la teinte de l'overlay du titre, qui
     utilise --tile-rgb. À unifier (voir le plan de nettoyage). */
  .tile-progress{display:flex;align-items:center;gap:6px;width:100%;margin-top:7px;flex-shrink:0;}
  .tile-progress-track{
    flex:1;min-width:0;height:5px;border-radius:3px;overflow:hidden;background:rgba(43,36,32,.10);
  }
  .tile-progress-fill{
    height:100%;border-radius:3px;
    /* Deux fois le même voile empilé sur du blanc : garde exactement la teinte du badge,
       mais assez dense (≈0.64 au lieu de 0.40) pour que la barre se lise sur la carte,
       elle-même déjà teintée de la même couleur. */
    background:
      linear-gradient(var(--tile-badge-glass,var(--accent-soft)),var(--tile-badge-glass,var(--accent-soft))),
      linear-gradient(var(--tile-badge-glass,var(--accent-soft)),var(--tile-badge-glass,var(--accent-soft))),
      #fff;
  }
  .tile-progress-pct{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--ink-soft);flex-shrink:0;}
  .tile-progress-chevron{width:11px;height:11px;flex-shrink:0;color:var(--ink-faint);}
  .tile.has-photo .tile-progress{position:relative;z-index:1;}
  .tile.has-photo .tile-progress-track{background:rgba(255,255,255,.38);}
  .tile.has-photo .tile-progress-pct{color:#fff;}
  .tile.has-photo .tile-progress-chevron{color:rgba(255,255,255,.9);}
  .tile.size-tiny .tile-body{padding:8px;}
  /* Reste à 1 ligne (pas 2 comme les autres tailles) : sur une tuile aussi petite,
     l'icône seule occupe déjà presque toute la hauteur disponible — 2 lignes de texte
     déborderaient physiquement. La taille de police s'adapte quand même pour éviter
     la troncature (voir titleFontSizeFor), juste sur une seule ligne ici. */
  .tile.size-tiny .tile-title{margin-top:3px;}
  .tile.size-tiny .tile-progress{display:none;}
  /* Tuile basse : marges réduites, titre sur une ligne, barre de progression resserrée. */
  .tile.size-flat .tile-body{padding:8px;}
  .tile.size-flat .tile-title{margin-top:4px;}
  .tile.size-flat .tile-progress{margin-top:4px;}
  .tile.has-photo .tile-title{margin-top:0;}

  .empty-state{
    position:absolute;inset:24px;border:1px dashed var(--line);border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:6px;
    color:var(--ink-soft);font-size:14px;background:var(--canvas);padding:20px;
  }
  .empty-state b{color:var(--ink);}

  /* TOP BAR (project detail)
     position:absolute plutôt que fixed : posé dans .detail-screen, qui est
     lui-même position:fixed sans transform (voir plus bas), donc un cadre de
     référence stable — un descendant "fixed" ici perdrait le suivi de la
     fenêtre visible pendant un scroll mobile (barre d'adresse qui se
     rétracte) puisqu'il ne serait plus fixé à la vraie fenêtre. */
  .top-bar{position:absolute;top:12px;left:12px;right:12px;z-index:40;display:flex;align-items:center;justify-content:flex-end;gap:8px;}
  .top-back-btn{
    width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--canvas-card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 6px 16px rgba(43,36,32,0.14);
  }
  .top-back-btn:hover{border-color:var(--accent);color:var(--accent);}
  .top-back-btn .icon{width:14px;height:14px;}
  .top-delete-btn{
    width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--canvas-card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);box-shadow:0 6px 16px rgba(43,36,32,0.14);
  }
  .top-delete-btn:hover{border-color:#9C4632;color:#9C4632;}
  .top-delete-btn .icon{width:14px;height:14px;}

  /* PROJECT DETAIL
     position:absolute (voir .top-bar juste au-dessus pour le pourquoi). */
  .detail-scroll{position:absolute;inset:0;background:var(--canvas);overflow-y:auto;}
  .detail-inner{max-width:600px;margin:0 auto;padding:50px 20px calc(90px + var(--tabbar-h) + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));}
  /* En-tête en rangée : icône du projet en badge carré à gauche, titre et sous-titre
     alignés à gauche à côté — le bloc centré précédent perdait beaucoup de hauteur en
     haut d'écran sans rien apporter à la lecture. */
  .detail-header{display:flex;flex-direction:row;align-items:center;text-align:left;gap:13px;margin-bottom:14px;}
  .detail-headings{min-width:0;display:flex;flex-direction:column;gap:3px;}
  .detail-title{font-size:19px;font-weight:800;letter-spacing:-0.01em;}
  .detail-summary{font-size:13px;color:var(--ink-soft);line-height:1.4;}

  .detail-progress-row{display:flex;align-items:center;gap:10px;margin:0 0 14px;}
  .detail-progress-row .progress-track{flex:1;min-width:0;margin:0;}
  .detail-progress-pct{
    flex-shrink:0;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--ink-soft);
  }
  .progress-track{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 14px;}
  .progress-fill{height:100%;border-radius:4px;background:var(--current-proj-solid, var(--accent));}
  @media (prefers-reduced-motion:no-preference){.progress-fill{transition:width .3s ease;}}

  /* Bande d'étapes : la ligne qui relie les pastilles EST la barre de progression —
     remplie jusqu'à l'étape en cours, vide après. Indicateur seulement (des div, pas des
     boutons) : on voit où on en est, on n'y navigue pas. Défilement horizontal pour tenir
     quel que soit le nombre d'étapes, recentré sur l'étape en cours après chaque rendu. */
  .steps-strip{margin:0 -20px 18px;padding:0 20px;overflow-x:auto;scrollbar-width:none;}
  .steps-strip::-webkit-scrollbar{display:none;}
  .steps-row{display:flex;align-items:flex-start;min-width:min-content;}
  .step-node{flex:0 0 auto;width:74px;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .step-node-top{display:flex;align-items:center;width:100%;}
  .step-link{flex:1;height:3px;background:var(--line);}
  .step-link.filled{background:var(--current-proj-solid, var(--accent));}
  .step-link.is-edge{visibility:hidden;}
  .step-dot{
    flex-shrink:0;width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;line-height:1;
    background:var(--canvas-card);border:2px solid var(--line);color:var(--ink-faint);
  }
  .step-node.is-done .step-dot{
    background:var(--current-proj-solid, var(--accent));
    border-color:var(--current-proj-solid, var(--accent));color:#fff;
  }
  .step-node.is-current .step-dot{
    background:var(--current-proj-badge, var(--accent-soft));
    border-color:var(--current-proj-solid, var(--accent));
    color:var(--current-proj-solid, var(--accent));
  }
  .step-label{
    font-size:10.5px;font-weight:700;line-height:1.25;text-align:center;color:var(--ink-faint);
    width:100%;word-break:break-word;overflow-wrap:break-word;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  }
  .step-node.is-done .step-label{color:var(--ink-soft);}
  .step-node.is-current .step-label{color:var(--ink);}
  .step-count{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-faint);}

  /* Composants colorés par l'identité du projet (--current-proj-*, posé sur .detail-scroll) — design system v5 */
  .next-action-card{
    background:var(--current-proj-next, var(--accent-soft));border:none;border-radius:var(--radius-lg);padding:16px 30px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin:14px 0;
    box-shadow:var(--shadow-card);position:relative;
  }
  .next-action-category{font-size:11.5px;font-style:italic;color:var(--current-proj-solid, var(--accent));opacity:.85;}
  .next-action-badge{
    display:inline-block;background:#fff;color:var(--current-proj-solid, var(--accent));font-family:var(--font-mono);
    font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;
    padding:4px 12px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  /* Bouton carrousel : rond blanc flottant à cheval sur le bord droit de l'encart, centré
     verticalement, pour parcourir les prochaines tâches (jusqu'à 3) sans les valider — plus
     visible qu'un simple chevron inline. Icône tournée à -90° car chevronIcon() pointe vers
     le bas par défaut (une fois tournée, elle pointe vers la droite, sens de la navigation). */
  .next-action-peek-btn{
    position:absolute;top:50%;right:-17px;transform:translateY(-50%);
    width:34px;height:34px;border-radius:50%;background:#fff;border:none;
    display:flex;align-items:center;justify-content:center;color:var(--current-proj-solid, var(--accent));
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .next-action-peek-btn:hover{box-shadow:0 3px 10px rgba(0,0,0,.24);}
  .next-action-peek-btn .icon{width:17px;height:17px;transform:rotate(-90deg);}
  .next-action-peek-btn.prev{left:-17px;right:auto;}
  .next-action-peek-btn.prev .icon{transform:rotate(90deg);}
  .next-action-title{font-size:18px;font-weight:700;color:var(--ink);line-height:1.35;}
  .next-action-row{display:flex;gap:10px;width:100%;}
  .next-action-row .btn-primary{
    flex:1;background:var(--current-proj-btn, var(--accent));border-color:var(--current-proj-btn, var(--accent));
    color:var(--ink);
  }

  .accompli-banner{
    background:var(--current-proj-solid, var(--accent));color:#fff;border-radius:var(--radius-lg);padding:22px;text-align:center;margin-bottom:24px;
  }
  .accompli-banner .big{font-size:19px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .accompli-banner .stats{font-family:var(--font-mono);font-size:11.5px;opacity:.9;}

  .section-label{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--ink-faint);margin:20px 0 10px;
  }
  /* Libellés de section repris en badge : fond blanc, texte dans la couleur du
     projet (--current-proj-solid, posée sur .detail-scroll par renderDetail) —
     utilisé pour "Catégories" (.section-label) et "Notes" (.proj-notes-label). */
  .proj-badge-label{
    display:inline-flex;align-items:center;
    background:#fff;color:var(--current-proj-solid, var(--ink-faint));
    padding:5px 11px;border-radius:20px;
    box-shadow:0 1px 3px rgba(43,36,32,.08);
  }
  /* Accordéon des catégories — une seule fenêtre pour parcourir un projet : la carte
     de catégorie prend toute la largeur, un clic déplie ses tâches juste en dessous. */
  .category-accordion{display:flex;flex-direction:column;gap:10px;}
  .category-accordion-item{
    background:var(--current-proj-card-faint, var(--canvas-card));border-radius:var(--radius-lg);
    overflow:hidden;box-shadow:var(--shadow-card);
  }
  .category-card{
    width:100%;background:none;border:none;padding:14px;
    display:flex;align-items:center;gap:10px;text-align:left;
  }
  .category-card-title{
    flex:1;min-width:0;font-size:16.5px;font-weight:700;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .category-progress-track{width:56px;flex-shrink:0;height:4px;border-radius:3px;background:rgba(43,36,32,.08);overflow:hidden;}
  .category-progress-fill{height:100%;border-radius:3px;background:var(--current-proj-solid, var(--accent));}
  .category-card-meta{flex-shrink:0;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);}
  .category-card-chevron{flex-shrink:0;display:flex;color:var(--ink-faint);transition:transform .2s ease;}
  .category-card-chevron .icon{width:14px;height:14px;}
  .category-card.expanded .category-card-chevron{transform:rotate(180deg);}
  .category-card.done{opacity:.6;}
  .category-expanded{padding:0 14px 14px;animation:categoryExpand .45s ease-out;}
  @keyframes categoryExpand{
    0%{opacity:0;transform:translateY(-6px);}
    100%{opacity:1;transform:translateY(0);}
  }
  .category-delete-inline{
    display:flex;align-items:center;gap:6px;margin-top:10px;padding:8px 0;border:none;background:none;
    font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
  }
  .category-delete-inline:hover{color:#9C4632;}
  .category-delete-inline .icon{width:13px;height:13px;}
  .add-category-link{
    display:inline-block;margin-top:10px;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
    background:none;border:none;padding:4px 0;
  }
  .add-category-link:hover{color:var(--accent);}

  .step-row{
    display:flex;align-items:center;gap:10px;background:var(--canvas-card);border:1px solid var(--line);
    border-radius:var(--radius);padding:11px 12px;margin-bottom:8px;
  }
  .step-check{
    flex-shrink:0;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-faint);background:transparent;
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .step-check.checked{background:var(--current-proj-solid, var(--status-actif));border-color:var(--current-proj-solid, var(--status-actif));}
  .step-check .icon{width:10px;height:10px;}
  .step-title{flex:1;font-size:14px;color:var(--ink);min-width:0;}
  .step-row.done .step-title{color:var(--ink-faint);}
  .step-row.priority{background:var(--current-proj-priority, var(--accent-soft));border-color:transparent;}
  .step-row.priority .step-title{font-weight:600;}
  .step-row.muted .step-title{color:var(--ink-faint);}
  .step-row.muted .step-check{border-color:var(--line);}
  .step-title-input{
    flex:1;border:1px solid var(--current-proj-solid, var(--accent));border-radius:7px;padding:6px 8px;font-size:14px;
    color:var(--ink);background:var(--canvas-card);min-width:0;font-family:inherit;
    line-height:1.35;resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word;
  }
  .step-title-input:focus{outline:none;}
  .step-remove{border:none;background:none;color:var(--ink-faint);font-size:16px;line-height:1;padding:2px 4px;flex-shrink:0;}
  .step-remove:hover{color:#9C4632;}

  .add-step-row{display:flex;gap:8px;margin-top:6px;}
  .add-step-row input{
    flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;
    background:var(--canvas-card);color:var(--ink);min-width:0;
  }

  .suggest-more-btn{width:100%;margin-top:16px;}

  /* COMPOSE BAR — barre IA (accueil), accent vert dédié + sparkle dans le champ (design system v5)
     bottom ajoute var(--safe-area-inset-bottom, env(safe-area-inset-bottom)) : .bottom-tabbar juste en dessous
     grandit de ce même montant (voir plus bas), donc sans ça un vide apparaît
     entre les deux barres, large exactement de la zone de gestes système.
     Padding remis à plat (10px) : le décalage de position suffit déjà. */
  .compose-bar{
    position:fixed;left:0;right:0;bottom:calc(var(--tabbar-h) + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));z-index:42;
    background:var(--canvas-card);border-top:1px solid var(--line);
    padding:10px 12px;
    display:flex;align-items:center;gap:8px;box-shadow:0 -4px 16px rgba(43,36,32,0.08);
  }
  .compose-input-wrap{
    flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;
    padding:0 15px;background:var(--canvas);min-width:0;
  }
  .compose-input-wrap .sparkle-prefix{font-size:14px;flex-shrink:0;line-height:1;}
  .compose-text-input{
    flex:1;border:none;outline:none;padding:10px 0;font-size:14px;
    background:transparent;color:var(--ink);min-width:0;
  }
  .compose-send-btn{
    flex-shrink:0;width:38px;height:38px;border-radius:50%;border:none;background:var(--ia-accent);color:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px var(--ia-accent-soft);
  }
  .compose-send-btn:hover{background:#357A50;}
  .compose-send-btn:disabled{opacity:.45;box-shadow:none;}
  .compose-send-btn .icon{width:16px;height:16px;}

  .loading-overlay{
    position:fixed;inset:0;background:rgba(43,36,32,0.5);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .loading-card{
    background:var(--canvas-card);border-radius:16px;padding:24px 28px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:10px;max-width:280px;
  }
  .loading-spinner{
    width:26px;height:26px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);
  }
  @media (prefers-reduced-motion:no-preference){.loading-spinner{animation:spin 0.8s linear infinite;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{font-size:13.5px;color:var(--ink-soft);}

  .toast{
    position:fixed;left:50%;bottom:calc(78px + var(--tabbar-h));transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;
    box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:55;opacity:0;pointer-events:none;
  }
  @media (prefers-reduced-motion:no-preference){.toast{transition:opacity .25s ease;}}
  .toast.show{opacity:1;}

  .reset-link{
    position:fixed;left:16px;bottom:calc(74px + var(--tabbar-h));z-index:40;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);
    background:var(--canvas-card);border:1px solid var(--line);border-radius:14px;padding:7px 13px;
    box-shadow:0 6px 16px rgba(43,36,32,0.1);
  }
  .reset-link:hover{color:var(--accent);border-color:var(--accent);}

  .icon{width:15px;height:15px;display:block;}

  /* NOTES PAR TÂCHE — icône + panel */
  .note-icon-btn{
    position:relative;border:none;background:none;padding:3px 5px;
    color:var(--ink-faint);flex-shrink:0;border-radius:6px;
  }
  .note-icon-btn:hover,.note-icon-btn.has-notes{color:var(--accent);}
  .note-icon-btn .icon{width:15px;height:15px;}
  .note-badge{
    position:absolute;top:-3px;right:-2px;min-width:14px;height:14px;
    background:var(--accent);color:#fff;border-radius:7px;
    font-size:9px;font-weight:700;line-height:14px;text-align:center;padding:0 2px;
  }
  .note-panel{
    border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;
    background:var(--canvas);padding:10px 12px;margin-top:-2px;margin-bottom:8px;
  }
  .note-entry{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px;}
  .note-entry-text{flex:1;font-size:13px;color:var(--ink);line-height:1.4;white-space:pre-wrap;word-break:break-word;}
  .note-delete-btn{border:none;background:none;color:var(--ink-faint);font-size:14px;padding:0 3px;flex-shrink:0;line-height:1;}
  .note-delete-btn:hover{color:var(--accent);}
  .note-pencil-btn{border:none;background:none;color:var(--ink-faint);padding:0 3px;flex-shrink:0;line-height:1;}
  .note-pencil-btn:hover{color:var(--accent);}
  .note-edit-area{width:100%;box-sizing:border-box;border:1px solid var(--accent);border-radius:8px;padding:7px 9px;font-size:13px;background:var(--canvas-card);color:var(--ink);resize:vertical;min-height:44px;font-family:inherit;}
  .note-edit-area:focus{outline:none;}
  .note-edit-actions{display:flex;gap:6px;margin-top:5px;}
  .note-edit-ok{border:none;background:var(--accent);color:#fff;border-radius:7px;padding:4px 12px;font-size:12px;font-weight:600;}
  .note-edit-cancel{border:1px solid var(--line);background:transparent;color:var(--ink-faint);border-radius:7px;padding:4px 10px;font-size:12px;}
  .note-add-area{
    width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:13px;background:var(--canvas-card);color:var(--ink);
    resize:vertical;min-height:52px;font-family:inherit;
  }
  .note-add-area:focus{outline:none;border-color:var(--accent);}
  .note-add-hint{font-size:10.5px;color:var(--ink-faint);margin-top:4px;}
  .note-add-trigger{
    width:100%;box-sizing:border-box;text-align:left;border:1px dashed var(--line);border-radius:8px;
    padding:9px 10px;font-size:13px;color:var(--ink-faint);background:transparent;
  }
  .note-add-trigger:hover{border-color:var(--accent);color:var(--accent);}
  /* NOTE EDIT MODAL (tâche) — position:absolute : uniquement rendu dans
     .detail-screen (voir .top-bar plus haut pour le pourquoi), sinon un
     position:fixed resterait affiché plein écran, immobile, pendant les
     280ms où .detail-screen glisse hors champ au retour arrière. */
  .note-edit-modal{position:absolute;inset:0;z-index:55;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,36,32,0.38);}
  .note-edit-modal-box{width:100%;max-width:620px;height:94vh;background:var(--canvas-card);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 32px rgba(43,36,32,0.18);}
  .note-edit-modal-header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .note-edit-modal-title{font-size:13.5px;font-weight:700;color:var(--ink);}
  .note-edit-modal-textarea{
    flex:1;width:100%;box-sizing:border-box;border:none;background:transparent;
    padding:18px;font-size:16px;color:var(--ink);outline:none;resize:none;font-family:inherit;line-height:1.6;
  }
  .note-edit-modal-actions{border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));}
  /* NOTES LIBRES PROJET */
  .project-notes-section{margin-top:14px;}
  .proj-notes-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-top:12px;border-top:1px solid var(--line);}
  .proj-notes-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.05em;text-transform:uppercase;}
  .proj-notes-add-btn{
    border:none;cursor:pointer;flex-shrink:0;
    width:22px;height:22px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--current-proj-solid, var(--accent));color:#fff;
  }
  .proj-notes-add-btn .icon{width:12px;height:12px;}
  .proj-notes-empty{font-size:13px;color:var(--ink-faint);padding:2px 2px 4px;}
  .proj-note-row{background:var(--canvas-card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .proj-note-top{display:flex;align-items:center;gap:6px;}
  .proj-note-icon{color:var(--ink-faint);flex-shrink:0;display:flex;align-items:center;}
  .proj-note-icon .icon{width:14px;height:14px;}
  .cat-note-title{
    flex:1;border:none;background:transparent;font-size:15.5px;font-weight:600;color:var(--ink);
    padding:0;outline:none;font-family:inherit;min-width:0;
  }
  .cat-note-title::placeholder{color:var(--ink-faint);}
  .cat-note-delete{border:none;background:none;color:var(--ink-faint);font-size:16px;padding:0 2px;line-height:1;flex-shrink:0;}
  .cat-note-delete:hover{color:var(--accent);}
  .proj-note-body{font-size:13px;color:var(--ink);line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
  .proj-note-body-edit{margin-top:8px;}


  /* BARRE DE NAVIGATION FIXE — accueil / liste / chat IA / calendrier.
     Remplace l'ancien bouton flottant (FAB) qui se superposait par-dessus les cartes
     projet lors du scroll : ici la zone de tap est dédiée et jamais partagée avec le contenu. */
  /* *{box-sizing:border-box} : la hauteur grandit de var(--safe-area-inset-bottom, env(safe-area-inset-bottom))
     mais le padding-bottom du même montant préserve --tabbar-h de contenu
     réel — les icônes gardent leur place normale, simplement remontée
     au-dessus de la barre de gestes système. */
  .bottom-tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:46;
    height:calc(var(--tabbar-h) + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));
    background:var(--canvas-card);border-top:1px solid var(--line);
    display:flex;align-items:stretch;padding-bottom:var(--safe-area-inset-bottom, env(safe-area-inset-bottom));
    box-shadow:0 -2px 12px rgba(43,36,32,0.06);
  }
  /* Dans .detail-screen/.calendar-screen/.tasklist-screen, la barre est posée à l'intérieur de
     l'écran plein écran plutôt qu'à côté de .home-container — position:fixed
     y perd le suivi de la vraie fenêtre visible pendant un scroll mobile (la
     barre d'adresse qui se rétracte redimensionne la fenêtre, et un fixed
     imbriqué ne suit alors plus que la boîte de son ancêtre, pas la fenêtre
     réelle) : elle semble alors se décrocher/disparaître pendant le scroll.
     Ces écrans restent eux-mêmes position:fixed sans
     transform, donc un repère stable pour un position:absolute ici. */
  .detail-screen .bottom-tabbar,
  .calendar-screen .bottom-tabbar,
  .tasklist-screen .bottom-tabbar{ position:absolute; }
  /* Même raison : .chat-modal et .account-sheet sont partagées entre un usage
     à l'accueil (fixed, correct) et un usage imbriqué dans .detail-screen
     (chat du projet, menu du projet) — seul ce second cas doit passer en
     absolute. Sans ça, un chat/menu resterait figé plein écran, immobile,
     pendant les 280ms où .detail-screen glisse hors champ au retour arrière
     (transform déplaçait auparavant tout le sous-arbre en un bloc ; left, non). */
  .detail-screen .chat-modal,
  .detail-screen .account-sheet{ position:absolute; }
  .tabbar-item{
    flex:1;border:none;background:none;cursor:pointer;color:var(--ink-faint);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }
  .tabbar-item .icon{width:20px;height:20px;}
  .tabbar-item-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.01em;}
  .tabbar-item.active{color:var(--accent);}
  .tabbar-item:disabled{opacity:0.35;pointer-events:none;cursor:default;}

  /* CHAT MODAL — partagée entre le chat de l'accueil (id chat-modal-home,
     reste position:fixed, pas dans un écran plein écran) et celui du détail
     projet (id chat-modal, imbriqué dans .detail-screen : voir l'override
     ".detail-screen .chat-modal" plus bas, même raison que .top-bar). */
  /* bottom borné à --tabbar-h (au lieu de inset:0) : la barre de navigation fixe
     (accueil/liste/chat/calendrier) reste visible ET cliquable pendant que le chat
     est ouvert, plutôt que d'être recouverte par le fond assombri de la modale.
     z-index 63 (> 60) : #chat-modal-home (chat depuis l'accueil, pas imbriqué dans un
     écran plein écran) doit rester au-dessus de .tasklist-screen/.calendar-screen quand
     il est ouvert depuis leur tabbar — sinon la modale s'affiche sous ces écrans, invisible. */
  .chat-modal{position:fixed;left:0;right:0;top:0;bottom:calc(var(--tabbar-h) + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));z-index:63;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,36,32,0.38);}
  .chat-modal-box{width:100%;max-width:620px;height:72vh;background:var(--canvas-card);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 32px rgba(43,36,32,0.18);}
  .chat-modal-header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .chat-modal-title{font-size:13.5px;font-weight:700;color:var(--ink);}
  .chat-modal-sub{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);margin-top:1px;}
  .chat-close-btn{border:none;background:none;font-size:22px;color:var(--ink-faint);line-height:1;padding:0 2px;}
  .chat-close-btn:hover{color:var(--ink);}

  /* Bouton Drop it — au centre de la barre de navigation plutôt qu'en bouton flottant
     par-dessus le contenu. Il garde une identité de bouton (pilule pleine, relief, léger
     débord vers le haut) pour ne pas se fondre dans la rangée d'icônes autour. */
  .tabbar-drop-slot{
    flex:1.15;display:flex;align-items:center;justify-content:center;position:relative;
  }
  .drop-tab-btn{
    position:relative;display:flex;align-items:center;justify-content:center;gap:4px;
    border:1px solid var(--line);border-radius:999px;padding:10px 12px;
    background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(43,36,32,0.16);
    font-size:11.5px;font-weight:800;letter-spacing:0.02em;white-space:nowrap;
    /* Remonté au-dessus de la ligne des autres onglets : c'est ce débord qui le fait lire
       comme un bouton d'action et non comme un cinquième onglet. */
    transform:translateY(-8px);
  }
  .drop-tab-dot{width:5px;height:5px;border-radius:50%;background:var(--notif-red);flex-shrink:0;}
  .drop-tab-badge{
    position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
    background:var(--notif-red);color:#fff;font-size:10.5px;font-weight:700;line-height:18px;text-align:center;
    box-shadow:0 0 0 2px var(--canvas-card);
  }

  /* Fenêtre Drop Zone — même gabarit que la fenêtre de chat (.chat-modal-box : 72vh,
     liste scrollable en corps, saisie fixée en bas), pour une identité visuelle cohérente. */
  .drop-sheet{position:fixed;inset:0;z-index:62;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,36,32,0.38);}
  .drop-sheet-box{width:100%;max-width:620px;height:72vh;background:var(--canvas-card);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 32px rgba(43,36,32,0.18);}
  .drop-sheet-header{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
  /* En-tête repris de la landing (slide Drop Zone) : icône, titre bicolore DROP/ZONE et
     sous-titre en pilule — même identité visuelle entre la page publique et l'app. */
  .drop-zone-brand{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:100%;}
  .drop-zone-icon{font-size:30px;line-height:1;}
  .drop-zone-title{
    font-family:var(--font-display);font-size:27px;font-weight:900;letter-spacing:0.06em;
    color:var(--ink);line-height:1;text-align:center;
  }
  .drop-zone-title span{color:var(--dropzone-violet);}
  .drop-zone-pill{
    background:rgba(91,63,232,0.10);border-radius:999px;padding:5px 13px;text-align:center;
    font-size:11.5px;font-weight:600;color:var(--ink-soft);
  }
  .drop-zone-pill b{color:var(--dropzone-violet);font-weight:800;}
  .drop-sheet-header .chat-close-btn{position:absolute;right:18px;top:50%;transform:translateY(-50%);}
  .drop-sheet-body{flex:1;overflow-y:auto;padding:14px 18px;}
  .drop-sheet-compose{flex-shrink:0;padding:12px 18px calc(12px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));border-top:1px solid var(--line);}
  .drop-sheet-input-row{display:flex;align-items:center;gap:8px;}
  .drop-sheet-input{
    flex:1;border:1.4px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;
    color:var(--ink);background:var(--canvas);
  }
  .drop-sheet-send{
    flex-shrink:0;height:38px;padding:0 16px;border-radius:12px;border:none;background:var(--accent);
    color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .drop-triage-empty{font-size:13px;color:var(--ink-faint);text-align:center;padding:30px 0;}
  .drop-badges{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;}
  .drop-badge{
    display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:100%;
    border:none;border-radius:999px;padding:6px 12px 6px 8px;font-size:12.5px;font-weight:600;
  }
  /* Petite case blanche en tête de badge : signal visuel que le tap coche/retire
     l'entrée de la Drop Zone — le texte suit toujours la charte du projet
     (--proj-*-solid), jamais de blanc là ; seule cette case l'est. */
  .drop-badge-check{
    flex-shrink:0;width:14px;height:14px;border-radius:5px;background:#fff;opacity:.85;
  }
  .drop-badge-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* "Jeté" dans la Drop Zone : apparition rapide avec un léger rebond et une rotation,
     jouée automatiquement puisque le badge est un nouveau nœud DOM inséré à la volée
     (pas de render() complet — voir performDropCapture). */
  .drop-badge.toss{animation:dropToss .4s cubic-bezier(.34,1.56,.64,1);}
  @keyframes dropToss{
    0%{transform:translateY(50px) scale(.4) rotate(-12deg);opacity:0;}
    100%{transform:translateY(0) scale(1) rotate(0deg);opacity:1;}
  }
  .chat-messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .chat-empty{font-size:13px;color:var(--ink-faint);text-align:center;padding:20px 0;}
  .chat-msg-user{align-self:flex-end;max-width:86%;}
  .chat-msg-ai{align-self:flex-start;max-width:92%;}
  .chat-bubble-user{padding:10px 14px;border-radius:16px 16px 4px 16px;font-size:13.5px;line-height:1.5;background:var(--accent);color:#fff;}
  .chat-bubble-ai{padding:11px 14px;border-radius:16px 16px 16px 4px;font-size:13.5px;line-height:1.6;background:var(--canvas);border:1px solid var(--line);color:var(--ink);}
  .chat-ai-footer{display:flex;align-items:center;gap:4px;margin-top:4px;}
  .chat-copy-btn{border:none;background:none;padding:2px 6px;border-radius:5px;font-size:11px;font-family:var(--font-mono);}
  .chat-copy-btn.copy-variant{color:var(--proj-azur-solid);}
  .chat-copy-btn.copy-variant:hover{background:var(--proj-azur-badge);}
  .chat-copy-btn.note-variant{color:var(--proj-ambre-solid);}
  .chat-copy-btn.note-variant:hover{background:var(--proj-ambre-badge);}
  .chat-loading{padding:8px 16px;font-size:13px;color:var(--ink-faint);display:flex;align-items:center;gap:8px;}
  .chat-input-row{border-top:1px solid var(--line);display:flex;background:var(--canvas-card);}
  .chat-text-input{flex:1;border:none;background:transparent;padding:13px 16px;font-size:14px;color:var(--ink);outline:none;}
  .chat-send-btn{border:none;background:transparent;padding:12px 16px;color:var(--accent);font-weight:700;font-size:13px;flex-shrink:0;}
  .chat-send-btn:hover{color:#A34936;}
  .chat-send-btn:disabled{opacity:.35;}
  /* Formatage réponses IA */
  .ai-h1{font-size:17px;font-weight:800;color:var(--ink);margin:10px 0 4px;line-height:1.3;}
  .ai-h2{font-size:15px;font-weight:700;color:var(--ink);margin:8px 0 3px;line-height:1.3;}
  .ai-h3{font-size:13.5px;font-weight:700;color:var(--ink);margin:6px 0 2px;}
  .ai-p{margin:2px 0;line-height:1.6;}
  .ai-li{display:flex;gap:8px;margin:2px 0;align-items:baseline;}
  .ai-bullet{color:var(--accent);flex-shrink:0;font-weight:700;}
  /* Project DNA */
  .project-dna{font-size:12.5px;color:var(--status-actif);font-style:italic;max-width:440px;line-height:1.4;margin-top:4px;}

  /* TASK LIST SCREEN (swipe depuis home)
     Glissement animé via "left" plutôt que "transform:translateX" : un transform
     sur cet écran ferait de lui le bloc de référence de ses descendants en
     position fixed (barre de tâche, barre d'ajout) au lieu de la fenêtre —
     sur mobile, ceux-ci perdent alors le suivi automatique de la fenêtre
     visible et semblent se décrocher/disparaître pendant un scroll. */
  .tasklist-screen{
    position:fixed;top:0;bottom:0;left:100%;width:100%;z-index:60;background:var(--canvas);
    display:flex;flex-direction:column;
    transition:left .28s cubic-bezier(.4,0,.2,1);
  }
  .tasklist-screen.open{left:0;}

  /* PROJECT DETAIL SCREEN — même glissement que .tasklist-screen : posé par-dessus
     l'accueil (jamais détruit pendant que c'est ouvert), pour un retour cohérent
     partout dans l'app plutôt qu'un remplacement instantané. */
  .detail-screen{
    position:fixed;top:0;bottom:0;left:100%;width:100%;z-index:60;background:var(--canvas);
    display:flex;flex-direction:column;
    transition:left .28s cubic-bezier(.4,0,.2,1);
  }
  .detail-screen.open{left:0;}
  .tasklist-top{
    flex-shrink:0;background:var(--canvas-card);border-bottom:1px solid var(--line);
    padding:14px 16px;display:flex;align-items:center;gap:10px;
  }
  .tasklist-title{flex:1;font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink);}
  .tasklist-count{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);}
  /* Filtre projets */
  .tl-filter-row{
    flex-shrink:0;display:flex;gap:8px;padding:10px 14px;
    overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);align-items:center;
  }
  .tl-filter-row::-webkit-scrollbar{display:none;}
  .tl-proj-chip{
    flex-shrink:0;font-size:28px;width:40px;height:40px;border-radius:12px;
    border:2px solid transparent;background:var(--canvas);display:flex;align-items:center;
    justify-content:center;transition:border-color .12s,background .12s;
  }
  .tl-proj-chip.active{border-color:var(--chip-solid, var(--accent));background:var(--chip-badge, var(--accent-soft));}
  .tl-filter-label{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);white-space:nowrap;flex-shrink:0;}
  /* Filtres catégorie / priorité (liste scopée à un projet) */
  .tl-text-chip{
    flex-shrink:0;font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap;
    border:1px solid var(--line);background:var(--canvas);border-radius:14px;padding:6px 12px;
    transition:border-color .12s,background .12s,color .12s;
  }
  .tl-text-chip.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .tl-filter-sep{flex-shrink:0;width:1px;align-self:stretch;background:var(--line);margin:0 2px;}
  /* Scroll liste */
  .tasklist-scroll{flex:1;overflow-y:auto;padding-bottom:calc(30px + var(--tabbar-h) + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));}
  /* Ligne tâche */
  .tl-row{
    display:flex;align-items:center;gap:12px;padding:13px 16px;
    border-bottom:1px solid var(--grid-line);background:var(--canvas-card);cursor:pointer;
  }
  .tl-row:active{background:var(--accent-soft);}
  .tl-row.muted .tl-title{color:var(--ink-faint);}
  .tl-check{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1.8px solid var(--ink-faint);
    background:transparent;display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .tl-check .icon{width:11px;height:11px;}
  .tl-info{flex:1;min-width:0;}
  .tl-title{font-size:14px;color:var(--ink);line-height:1.35;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
  .tl-meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tl-badge{
    flex-shrink:0;font-family:var(--font-mono);font-size:9.5px;font-weight:700;
    padding:3px 7px;border-radius:6px;letter-spacing:0.04em;
  }
  .tl-badge.p1{background:var(--accent-soft);color:var(--accent);}
  .tl-badge.p2{background:var(--status-ralentit-soft);color:var(--status-ralentit);}
  .tl-badge.p3{background:var(--line);color:var(--ink-faint);}
  .tl-badge.overdue{background:rgba(156,70,50,0.12);color:#9C4632;}
  .tl-title-icon{display:inline-flex;vertical-align:middle;margin-right:8px;}
  .tl-empty{padding:48px 24px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.6;}

  /* CALENDRIER */
  .calendar-screen{
    position:fixed;top:0;bottom:0;left:100%;width:100%;z-index:60;background:var(--canvas);display:flex;flex-direction:column;
    transition:left .28s cubic-bezier(.4,0,.2,1);
  }
  .calendar-screen.open{left:0;}
  .cal-top-bar{
    flex-shrink:0;padding:calc(12px + var(--safe-area-inset-top, env(safe-area-inset-top))) 16px 4px;
    display:flex;align-items:center;gap:10px;
  }
  .cal-top-title{flex:1;font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink);}
  .cal-top-section{flex:0 0 34%;min-height:0;display:flex;flex-direction:column;}
  .cal-nav-row{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:6px 16px 8px;}
  .cal-nav-btn{
    width:32px;height:32px;flex-shrink:0;border-radius:50%;border:1px solid var(--line);
    background:var(--canvas-card);color:var(--ink);display:flex;align-items:center;justify-content:center;
  }
  .cal-nav-btn:hover{border-color:var(--accent);color:var(--accent);}
  .cal-nav-btn .icon{width:13px;height:13px;}
  .cal-month-label{font-size:14px;font-weight:700;color:var(--ink);text-transform:capitalize;}
  .cal-weekdays{flex-shrink:0;display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px;}
  .cal-weekday{text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);padding:4px 0;}
  .cal-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 12px 10px;}
  .cal-day{
    border:none;background:none;border-radius:10px;min-height:0;padding:2px 0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:13px;color:var(--ink);
  }
  .cal-day.other-month{color:var(--ink-faint);opacity:.4;}
  .cal-day.today .cal-day-num{font-weight:800;color:var(--accent);text-decoration:underline;text-underline-offset:3px;}
  .cal-day.selected{background:var(--accent-soft);color:var(--accent);font-weight:700;}
  .cal-day-num{line-height:1;}
  .cal-day-dues{display:flex;gap:2px;line-height:1;}
  .cal-due-badge{
    width:14px;height:14px;flex-shrink:0;border-radius:50%;font-size:8.5px;
    display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--ia-accent) var(--pct,0%), var(--line) 0);
  }
  /* Jalons intermédiaires — verdict binaire (dans les temps / en retard),
     traitement volontairement différent de l'anneau proportionnel des échéances. */
  .cal-checkpoint-badge{
    width:14px;height:14px;flex-shrink:0;border-radius:50%;font-size:8.5px;
    display:flex;align-items:center;justify-content:center;
  }
  .cal-checkpoint-badge.cp-ontrack{background:var(--ia-accent-soft);box-shadow:inset 0 0 0 1.5px var(--ia-accent);}
  .cal-checkpoint-badge.cp-behind{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);}
  .cal-checkpoint-badge.cp-upcoming{background:var(--line);box-shadow:inset 0 0 0 1.5px var(--ink-faint);}
  .cal-day-list-label{
    flex-shrink:0;padding:12px 16px 6px;font-family:var(--font-mono);font-size:10px;
    letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-faint);border-top:1px solid var(--line);
  }
  .cal-list{flex:1;overflow-y:auto;padding-bottom:calc(16px + var(--tabbar-h));}
  .cal-empty{padding:40px 24px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.6;}
  /* Barre de saisie dans la task list — même gabarit que .detail-fixed-bar : position:absolute
     posée juste au-dessus de la bottom-tabbar (ajoutée sous cette barre pour que le tab "Liste"
     reste accessible), plutôt qu'un enfant flex en bas d'écran sans barre de nav en dessous. */
  /* BARRE FIXE DÉTAIL (catégorie/tâches & projet) — barre IA, accent vert dédié (design system v5) */
  /* position:absolute (voir .top-bar plus haut pour le pourquoi).
     bottom + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)) et padding remis à plat : même
     raison que .compose-bar plus haut. */
  .detail-fixed-bar{
    position:absolute;left:0;right:0;bottom:calc(var(--tabbar-h) + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));z-index:42;
    background:var(--canvas-card);border-top:1px solid var(--line);
    padding:10px 12px;
    display:flex;align-items:center;gap:8px;box-shadow:0 -4px 16px rgba(43,36,32,0.08);
  }
  .dfb-input-wrap{
    flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;
    padding:0 15px;background:var(--canvas);min-width:0;
  }
  .dfb-input-wrap:focus-within{border-color:var(--ia-accent);}
  .dfb-input-wrap .sparkle-prefix{font-size:14px;flex-shrink:0;line-height:1;}
  .dfb-input{
    flex:1;border:none;outline:none;padding:10px 0;font-size:14px;
    background:transparent;color:var(--ink);min-width:0;
  }
  .dfb-btn{
    flex-shrink:0;width:38px;height:38px;border-radius:50%;border:none;
    display:flex;align-items:center;justify-content:center;
  }
  .dfb-btn.primary{background:var(--ia-accent);color:#fff;box-shadow:0 0 0 5px var(--ia-accent-soft);}
  .dfb-btn.primary:hover{background:#357A50;}
  .dfb-btn.secondary{background:var(--canvas-card);border:1px solid var(--line);color:var(--ink);}
  .dfb-btn.secondary:hover{border-color:var(--ia-accent);color:var(--ia-accent);}
  .dfb-btn:disabled{opacity:.35;box-shadow:none;}
  .dfb-btn .icon{width:16px;height:16px;}

  /* ÉCRAN D'AUTHENTIFICATION */
  .auth-screen{
    position:fixed;inset:0;z-index:100;background:var(--canvas);
    overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:24px 20px;
  }
  .auth-box{width:100%;max-width:360px;position:relative;z-index:2;}
  .auth-logo{text-align:center;font-size:34px;line-height:1;margin-bottom:10px;}
  .auth-title{font-size:22px;font-weight:800;letter-spacing:-.02em;text-align:center;color:var(--ink);}
  .auth-sub{font-size:13.5px;color:var(--ink-soft);text-align:center;margin-top:6px;line-height:1.5;}
  .auth-form{margin-top:22px;display:flex;flex-direction:column;gap:9px;}

  /* --- Branding écran auth (design system v14) : logo pilule + tagline brute + icônes flottantes --- */
  .auth-logo-pill{
    display:inline-flex;align-items:center;gap:2px;padding:12px 26px;border-radius:999px;margin:0 auto;
    background:var(--canvas-card);box-shadow:0 10px 28px rgba(43,36,32,.12);border:1px solid var(--line);
  }
  .auth-brand-row{text-align:center;}
  .auth-logo-pill .word{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
  .auth-logo-pill .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin:0 5px;flex-shrink:0;}
  .auth-tagline{
    margin:16px auto 0;max-width:280px;font-size:13.5px;font-weight:700;color:#000;
    line-height:1.55;text-align:center;
  }
  .auth-float-icon{
    position:absolute;width:46px;height:46px;border-radius:14px;z-index:1;
    display:flex;align-items:center;justify-content:center;font-size:22px;
    box-shadow:0 8px 20px rgba(43,36,32,.14);
    animation:auth-floaty 4.5s ease-in-out infinite;
  }
  @media (prefers-reduced-motion:reduce){.auth-float-icon{animation:none;}}
  @keyframes auth-floaty{
    0%,100%{transform:translateY(0px) rotate(0deg);}
    50%{transform:translateY(-9px) rotate(-3deg);}
  }
  .auth-badge-count{
    position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;
    background:#E6493F;color:#fff;font-size:10px;font-weight:800;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
    box-shadow:0 2px 6px rgba(230,73,63,.5);font-family:var(--font-mono);
  }
  .auth-fi-label{
    position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;
    font-size:9.5px;font-weight:600;color:var(--ink);white-space:nowrap;
    background:var(--canvas-card);padding:3px 8px;border-radius:7px;box-shadow:0 3px 8px rgba(43,36,32,.10);
  }
  /* Positions : groupe haut (2 lignes) au-dessus du bloc centré, groupe bas (2 lignes) ancré au bas
     du viewport (bottom:) pour rester correct quelle que soit la hauteur d'écran réelle */
  .afi-1{top:18px;left:14px;background:rgba(210,65,101,.16);color:#D24165;animation-delay:0s;}
  .afi-2{top:18px;right:14px;background:rgba(65,150,210,.16);color:#4196D2;animation-delay:.6s;}
  .afi-3{top:126px;left:18px;background:rgba(77,65,210,.16);color:#4D41D2;animation-delay:1.2s;}
  .afi-4{top:126px;right:18px;background:rgba(198,135,47,.16);color:#C6872F;animation-delay:1.8s;}
  .afi-5{bottom:250px;left:22px;background:rgba(39,165,113,.16);color:#27A571;animation-delay:2.4s;}
  .afi-6{bottom:250px;left:50%;margin-left:-23px;background:rgba(38,161,161,.16);color:#26A1A1;animation-delay:3s;}
  .afi-7{bottom:250px;right:22px;background:rgba(210,102,75,.16);color:#D25C41;animation-delay:.3s;}
  .afi-8{bottom:130px;left:48px;background:rgba(174,65,210,.16);color:#AE41D2;animation-delay:1.5s;}
  .afi-9{bottom:130px;right:48px;background:rgba(65,150,210,.16);color:#4196D2;animation-delay:2.1s;}
  @media (max-height:680px){
    .afi-5,.afi-6,.afi-7,.afi-8,.afi-9{display:none;} /* écrans courts : on garde seulement le groupe du haut */
  }
  .auth-input{
    width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:11px;
    padding:13px 15px;font-size:16px;background:var(--canvas-card);color:var(--ink);
  }
  .auth-input:focus{outline:none;border-color:var(--accent);}
  .auth-submit{
    width:100%;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:700;
    background:#9CECCB;color:var(--ink);margin-top:3px;
  }
  .auth-submit:hover{background:#7FE0B5;}
  .auth-submit:disabled{opacity:.5;}
  .auth-divider{
    display:flex;align-items:center;gap:10px;margin:18px 0 14px;
    font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;
  }
  .auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .auth-oauth-btn{
    width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;
    background:var(--canvas-card);color:var(--ink);font-size:14.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:9px;
  }
  .auth-oauth-btn:hover{border-color:var(--accent);}
  .auth-oauth-btn svg{width:18px;height:18px;flex-shrink:0;}
  .auth-switch{
    text-align:center;margin-top:18px;font-size:13.5px;color:var(--ink-soft);
  }
  .auth-link{
    background:none;border:none;color:var(--accent);font-size:13.5px;font-weight:600;
    padding:2px 4px;text-decoration:underline;
  }
  .auth-msg{
    border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.5;margin-top:14px;
  }
  .auth-msg.error{background:#FBEAE5;color:#9C4632;border:1px solid #E9C4B8;}
  .auth-msg.info{background:var(--status-actif-soft);color:var(--status-actif);border:1px solid #BFD9C8;}
  .auth-legal{
    text-align:center;font-size:11px;color:var(--ink-faint);margin-top:20px;line-height:1.5;
  }
  .auth-boot{
    position:fixed;inset:0;z-index:100;background:var(--canvas);
    display:flex;align-items:center;justify-content:center;
  }

  /* --- Onboarding première connexion : popup modal (pas plein écran) --- */
  .onboarding-screen{
    position:fixed;inset:0;z-index:300;background:rgba(43,36,32,.55);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .onboarding-modal{
    width:100%;max-width:380px;height:min(680px, 92vh);background:var(--canvas);border-radius:24px;
    overflow:hidden;display:flex;flex-direction:column;position:relative;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
  }
  .ob-modal-header{flex-shrink:0;padding:18px 24px 2px;display:flex;align-items:center;justify-content:center;position:relative;}
  .ob-modal-logo{display:inline-flex;align-items:center;font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
  .ob-modal-logo .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin:0 4px;flex-shrink:0;}
  .ob-skip{
    position:absolute;top:16px;right:16px;z-index:5;
    font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);background:var(--canvas-card);
    border:1px solid var(--line);border-radius:20px;padding:6px 14px;
  }
  .ob-slides{flex:1;position:relative;overflow:hidden;min-height:0;}
  .ob-slide{
    position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .3s ease;
    pointer-events:none;padding:10px 24px 0;overflow-y:auto;
  }
  .ob-slide.active{opacity:1;pointer-events:auto;}
  .ob-eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ob-color, var(--accent));font-weight:700;margin-bottom:6px;text-align:center;}
  .ob-title{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.22;text-align:center;}
  .ob-shot-frame{width:266px;margin:24px auto 0;position:relative;flex-shrink:0;}
  .ob-shot-clip{
    width:266px;border-radius:22px;overflow:hidden;position:relative;
    box-shadow:0 16px 40px rgba(43,36,32,.18);border:6px solid #1a1a1a;background:#fff;
  }
  .ob-shot-clip img{width:266px;display:block;position:absolute;left:0;}
  .ob-callout{
    position:absolute;background-repeat:no-repeat;background-color:#fff;
    box-shadow:0 16px 34px rgba(43,36,32,.3), 0 0 0 3px #fff, 0 0 0 5px rgba(43,36,32,.08);z-index:4;
  }
  .ob-pop{
    position:absolute;background:var(--ob-color, var(--accent));color:#fff;font-size:10.5px;font-weight:700;
    padding:6px 10px;border-radius:999px;box-shadow:0 8px 18px rgba(43,36,32,.3);
    white-space:nowrap;z-index:3;transform:rotate(-3deg);
  }
  .ob-body{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:14px auto 24px;text-align:center;padding:0 4px;max-width:320px;}
  .ob-footer{flex-shrink:0;padding:14px 24px calc(14px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));max-width:420px;width:100%;margin:0 auto;box-sizing:border-box;}
  .ob-dots{display:flex;justify-content:center;gap:6px;margin-bottom:14px;}
  .ob-dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s,width .2s;}
  .ob-dot.active{background:var(--ob-color, var(--accent));width:20px;border-radius:4px;}
  .ob-next{
    width:100%;border:2px solid var(--ob-color, var(--accent));border-radius:12px;padding:14px;
    font-size:15px;font-weight:800;background:#fff;color:var(--ob-color, var(--accent));
  }
  .ob-tagline{font-size:14px;font-weight:700;color:var(--ink);text-align:center;margin-top:10px;line-height:1.45;max-width:300px;margin-left:auto;margin-right:auto;}
  .ob-features-row{display:flex;gap:18px;align-items:center;margin-top:30px;}
  .ob-features-thumb{width:120px;height:140px;border-radius:16px;flex-shrink:0;box-shadow:0 10px 24px rgba(43,36,32,.16);background-repeat:no-repeat;}
  .ob-features-list{flex:1;display:flex;flex-direction:column;gap:14px;}
  .ob-feature-item{display:flex;gap:9px;align-items:flex-start;}
  .ob-feature-icon{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .ob-feature-text{font-size:12.5px;color:var(--ink);line-height:1.4;font-weight:600;padding-top:3px;}

  /* --- Notice "projets d'exemple" (nouveaux comptes) : popup modal, une seule fois --- */
  .sample-notice-screen{
    position:fixed;inset:0;z-index:310;background:rgba(43,36,32,.55);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .sample-notice-modal{
    width:100%;max-width:340px;background:var(--canvas);border-radius:22px;
    padding:30px 26px calc(22px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
  }
  .sample-notice-emoji{font-size:28px;letter-spacing:6px;margin-bottom:16px;}
  .sample-notice-title{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin-bottom:10px;}
  .sample-notice-body{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:22px;}
  .sample-notice-btn{
    width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;
    background:var(--ia-accent);color:#fff;
  }

  /* --- Questionnaire de personnalisation (premier lancement d'un compte) ---
     Univers visuel propre au questionnaire (bleu, fond dégradé), validé en
     maquette avant implémentation : il encadre l'arrivée, pas l'app elle-même. */
  .obq{
    position:fixed;inset:0;z-index:320;display:flex;flex-direction:column;color:#16243F;
    background:
      radial-gradient(115% 62% at 0% 0%, #FDE9F0 0%, rgba(253,233,240,0) 58%),
      radial-gradient(105% 55% at 100% 2%, #E4EEFC 0%, rgba(228,238,252,0) 52%),
      radial-gradient(130% 55% at 50% 100%, #EEF3FB 0%, rgba(238,243,251,0) 62%),
      #FFFFFF;
  }
  .obq-top{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(18px + var(--safe-area-inset-top, env(safe-area-inset-top))) 24px 0;}
  .obq-back{
    width:30px;height:30px;border-radius:50%;border:1px solid #E9EEF5;background:#FFFFFF;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#64748B;padding:0;
  }
  .obq-count{font-size:11.5px;font-weight:600;color:#94A3B8;}
  .obq-logo{margin-left:auto;display:inline-flex;align-items:center;font-size:13.5px;font-weight:800;letter-spacing:-.02em;}
  .obq-logo i{width:6px;height:6px;border-radius:50%;background:#EF5D4E;margin:0 4px;font-style:normal;}
  /* La phrase passe avant la barre : sur un écran bas, barre + emoji
     grignotaient la place du titre juste en dessous, au point de le rogner
     (bug remonté). La faire passer au-dessus libère cette place, jamais en
     dessous d'un titre. */
  .obq-quip{flex-shrink:0;margin:14px 26px 0;font-size:11.5px;font-weight:600;color:#94A3B8;
            text-align:center;line-height:1.35;}
  .obq-prog{flex-shrink:0;margin:12px 24px 0;}
  .obq-bar{position:relative;height:4px;border-radius:999px;background:#E8EEF6;}
  .obq-fill{position:relative;height:100%;border-radius:999px;background:linear-gradient(90deg,#3B82F6,#2563EB);
            transition:width .5s cubic-bezier(.65,0,.35,1);}
  /* L'emoji chevauche la pointe de la barre remplie : ancré en % de la
     largeur du fill, il glisse avec elle pendant la même transition, sans
     JS dédié à son déplacement. */
  .obq-mood{position:absolute;top:50%;left:100%;font-size:18px;line-height:1;transform-origin:center;
            transition:transform .34s cubic-bezier(.34,1.56,.64,1);}
  .obq-body{flex:1;min-height:0;overflow-y:auto;padding:20px 24px 4px;text-align:center;
            display:flex;flex-direction:column;
            /* "safe" évite qu'un écran chargé (beaucoup d'options) rogne le
               haut du contenu de façon inatteignable au scroll — la vraie
               cause du bug, pas la position de la phrase. Navigateur qui
               ignore "safe" : replie sur le haut, jamais pire qu'avant. */
            justify-content:flex-start;justify-content:safe center;}
  .obq-title{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin:0;text-wrap:balance;}
  .obq-sub{font-size:13px;font-weight:500;line-height:1.5;color:#64748B;margin:9px auto 0;max-width:30ch;}
  .obq-hint{font-size:11.5px;font-weight:600;color:#94A3B8;margin:7px 0 0;}
  .obq-list{display:flex;flex-direction:column;gap:8px;margin-top:20px;text-align:left;}
  .obq-row{
    display:flex;align-items:center;gap:12px;width:100%;background:#FFFFFF;border:1.5px solid #E9EEF5;
    border-radius:14px;padding:0 14px;min-height:52px;color:#16243F;font-size:14px;font-weight:600;
    text-align:left;box-shadow:0 1px 2px rgba(22,36,63,.04),0 6px 16px rgba(22,36,63,.05);
  }
  .obq-row.sel{background:#F3F8FF;border-color:#3B82F6;box-shadow:0 1px 2px rgba(37,99,235,.08),0 8px 20px rgba(37,99,235,.13);}
  .obq-ic{
    width:34px;height:34px;border-radius:11px;background:#F3F6FB;flex-shrink:0;line-height:1;font-size:16px;
    display:flex;align-items:center;justify-content:center;transition:background .2s ease;
  }
  .obq-row.sel .obq-ic{background:#DBEAFE;}
  .obq-lb{flex:1;min-width:0;line-height:1.3;}
  .obq-box{
    width:22px;height:22px;border-radius:7px;border:1.8px solid #CBD5E1;background:#FFFFFF;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#FFFFFF;
    transition:background .18s ease,border-color .18s ease,transform .24s cubic-bezier(.34,1.56,.64,1);
  }
  .obq-box.rnd{border-radius:50%;}
  .obq-box.on{background:#3B82F6;border-color:#3B82F6;transform:scale(1.07);}
  .obq-box .icon{width:12px;height:12px;opacity:0;transition:opacity .15s ease;}
  .obq-box.on .icon{opacity:1;}
  .obq-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:20px;}
  .obq-card{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    border:1.5px solid transparent;border-radius:16px;padding:15px 7px;min-height:96px;text-align:center;
    font-size:10.5px;font-weight:700;line-height:1.25;color:#16243F;
    box-shadow:0 1px 2px rgba(22,36,63,.04),0 6px 16px rgba(22,36,63,.05);
  }
  .obq-card.sel{border-color:#3B82F6;box-shadow:0 2px 4px rgba(37,99,235,.1),0 10px 22px rgba(37,99,235,.16);}
  .obq-ce{font-size:21px;line-height:1;}
  .obq-tick{
    position:absolute;top:7px;right:7px;width:19px;height:19px;border-radius:50%;background:#3B82F6;
    display:flex;align-items:center;justify-content:center;color:#FFFFFF;opacity:0;transform:scale(.5);
    transition:opacity .18s ease,transform .26s cubic-bezier(.34,1.56,.64,1);
  }
  .obq-card.sel .obq-tick{opacity:1;transform:scale(1);}
  .obq-tick .icon{width:11px;height:11px;}
  .obq-field{
    display:flex;align-items:center;gap:11px;background:#FFFFFF;border:1.5px solid #E9EEF5;border-radius:14px;
    padding:15px 16px;margin-top:22px;text-align:left;box-shadow:0 1px 2px rgba(22,36,63,.04),0 6px 16px rgba(22,36,63,.05);
    transition:border-color .2s ease;
  }
  .obq-field:focus-within{border-color:#3B82F6;}
  .obq-field .icon{width:17px;height:17px;color:#94A3B8;flex-shrink:0;}
  .obq-input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px;font-weight:600;color:#16243F;}
  .obq-input::placeholder{color:#B6C2D2;font-weight:500;}
  .obq-area{
    width:100%;margin-top:20px;background:#FFFFFF;border:1.5px solid #E9EEF5;border-radius:16px;padding:16px;
    min-height:148px;font-size:14px;font-weight:500;color:#16243F;outline:none;resize:none;line-height:1.5;
    box-shadow:0 1px 2px rgba(22,36,63,.04),0 6px 16px rgba(22,36,63,.05);transition:border-color .2s ease;
  }
  .obq-area::placeholder{color:#B6C2D2;}
  .obq-area:focus{border-color:#3B82F6;}
  .obq-other{
    width:100%;margin-top:8px;background:#F7F9FC;border:1.5px solid #EDF1F7;border-radius:12px;padding:12px 14px;
    font-size:13px;font-weight:500;color:#16243F;outline:none;transition:border-color .2s ease,background .2s ease;
  }
  .obq-other::placeholder{color:#B6C2D2;}
  .obq-other:focus{border-color:#3B82F6;background:#FFFFFF;}
  .obq-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:26px;}
  .obq-chip{
    display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 15px;font-size:12px;
    font-weight:700;box-shadow:0 2px 8px rgba(22,36,63,.06);
  }
  .obq-ckl{display:flex;flex-direction:column;gap:11px;margin-top:26px;text-align:left;}
  .obq-ck{
    display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:600;background:#FFFFFF;
    border:1.5px solid #E9EEF5;border-radius:13px;padding:13px 15px;
    box-shadow:0 1px 2px rgba(22,36,63,.04),0 6px 16px rgba(22,36,63,.05);
  }
  .obq-ckd{
    width:21px;height:21px;border-radius:50%;background:#22C55E;flex-shrink:0;color:#FFFFFF;
    display:flex;align-items:center;justify-content:center;
  }
  .obq-ckd .icon{width:11px;height:11px;}
  .obq-foot{flex-shrink:0;padding:12px 24px calc(22px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));
            display:flex;flex-direction:column;align-items:center;gap:1px;}
  .obq-cta{
    width:100%;border-radius:15px;padding:16px;font-size:15px;font-weight:800;color:#16243F;background:#FFFFFF;
    border:1.5px solid #E4EAF2;display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 1px 2px rgba(22,36,63,.05),0 10px 24px rgba(22,36,63,.09);
    transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,border-color .2s ease;
  }
  .obq-cta:hover{border-color:#C9D6E8;}
  .obq-cta:active{transform:scale(.976);}
  .obq-cta .icon{width:15px;height:15px;}
  .obq-skip{background:none;border:none;padding:12px;font-size:13px;font-weight:600;color:#94A3B8;}
  .obq-skip:hover{color:#64748B;}

  /* Profil : relecture et modification des réponses après coup */
  .prof-row{
    width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 14px;background:none;border:none;border-radius:12px;text-align:left;
  }
  .prof-row:active{background:var(--accent-soft);}
  .prof-sub{font-size:12px;color:var(--ink-soft);line-height:1.45;margin-top:4px;}
  .prof-q{display:block;font-size:13px;color:var(--ink-faint);}
  .prof-a{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-top:2px;line-height:1.35;}
  .prof-a.empty{font-weight:500;color:var(--ink-faint);font-style:italic;}
  .prof-list{max-height:52vh;overflow-y:auto;margin:6px -8px 0;}

  @media (prefers-reduced-motion:reduce){
    .obq *{transition-duration:.12s !important;}
  }

  /* Bouton compte (accueil) */
  .account-btn{
    position:fixed;right:16px;top:16px;z-index:45;width:36px;height:36px;
    border-radius:50%;background:var(--canvas-card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
    box-shadow:0 4px 12px rgba(43,36,32,0.12);font-size:13px;font-weight:700;
  }
  .account-btn:hover{border-color:var(--accent);color:var(--accent);}
  .account-sheet{
